<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career · 職涯紀錄 | WUYAN's ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cinzel:wght@400&family=Instrument+Serif:ital@0;1&family=Noto+Serif+TC:wght@200;300&family=Noto+Sans+TC:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Cubic';src:url('assets/fomts/Cubic.ttf') format('truetype');font-weight:normal;font-display:swap}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;cursor:none!important}
html,body{width:100%;min-height:100vh;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}

:root{
  --bg:#04020e;
  --bg-deep:rgba(2,0,10,1);
  --bg-card:rgba(14,7,40,0.88);
  --line:rgba(167,139,250,0.22);
  --line-soft:rgba(167,139,250,0.12);
  --ink:rgba(246,242,255,0.95);
  --ink-mute:rgba(198,186,222,0.78);
  --ink-dim:rgba(138,122,176,0.56);
  --violet:rgba(196,181,253,0.9);
  --violet-deep:rgba(110,68,196,0.9);
  --powder:rgba(165,215,255,0.95);
  --powder-deep:rgba(118,188,240,0.9);
  --magic:rgba(240,165,205,0.95);
  --gold:#d4a84e;
  --r-sm:8px;--r:14px;--r-lg:22px;
  --display:'Instrument Serif','Noto Serif TC',Georgia,serif;
  --sans:'Noto Sans TC','Courier New',system-ui,sans-serif;
  --body:'Courier New',monospace;
  --mono:'JetBrains Mono','Courier New',monospace;
}

body{background:#04020e;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}

/* ── Cursor ── */
#cursor-dot{position:fixed;width:6px;height:6px;border-radius:50%;background:#fff;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(255,180,220,.9)}
#cursor-ring{position:fixed;width:24px;height:24px;border-radius:50%;border:1px solid rgba(240,160,200,.4);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s}
body.hov #cursor-ring{width:40px;height:40px;border-color:rgba(240,160,205,.75);box-shadow:0 0 12px rgba(220,120,175,.22)}

/* ── Stars ── */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite var(--dl,0s)}
@keyframes twinkle{0%,100%{opacity:var(--a,.3)}50%{opacity:1}}

/* ── Page background ── */
#page-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 55% at 50% -5%, rgba(55,15,115,.42) 0%, transparent 58%),
    radial-gradient(ellipse 55% 45% at 18% 40%, rgba(35,8,90,.20) 0%, transparent 55%),
    radial-gradient(ellipse 48% 38% at 82% 78%, rgba(22,6,70,.15) 0%, transparent 50%)}
#page-bg::after{content:'';position:absolute;inset:0;background:rgba(4,2,14,.28)}

/* ── Sidebar ── */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;display:flex;flex-direction:column;border-right:1px solid rgba(167,139,250,.22);height:100vh;overflow:hidden;z-index:50;background:linear-gradient(to bottom,rgba(12,5,32,.80) 0%,rgba(14,6,40,.72) 48%,rgba(28,10,55,.55) 70%,rgba(28,10,55,.28) 88%,rgba(28,10,55,.06) 100%);backdrop-filter:blur(20px);transform:translateX(calc(-100% + 16px));transition:transform .38s cubic-bezier(.25,.46,.45,.94),box-shadow .38s}
#sidebar:hover{transform:translateX(0);box-shadow:4px 0 44px rgba(0,0,0,.75),0 0 0 1px rgba(167,139,250,.1)}
#sidebar::before{content:'';position:absolute;right:0;top:22%;bottom:22%;width:2px;background:linear-gradient(to bottom,transparent,rgba(167,139,250,.72) 40%,rgba(165,215,255,.58) 60%,transparent);border-radius:1px;transition:opacity .25s;pointer-events:none;z-index:2}
#sidebar:hover::before{opacity:0}
#sidebar::after{content:'';position:absolute;left:36px;top:80px;bottom:80px;width:1.5px;background:linear-gradient(to bottom,transparent,rgba(167,139,250,.5) 20%,rgba(196,181,253,.85) 50%,rgba(167,139,250,.5) 80%,transparent);box-shadow:0 0 6px rgba(167,139,250,.28)}
.sb-head{padding:20px 14px 16px 18px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid rgba(167,139,250,.12);flex-shrink:0}
.sb-cat{width:34px;height:34px;border:1px solid rgba(167,139,250,.42);border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(5,10,30,.6);flex-shrink:0;box-shadow:0 0 12px rgba(167,139,250,.22)}
.sb-cat img{width:22px;height:22px;filter:invert(1) sepia(1) saturate(3) hue-rotate(245deg);opacity:.85}
.sb-info{flex:1;min-width:0}
.sb-title{font:700 12px monospace;letter-spacing:3px;color:rgba(196,181,253,.88);text-transform:uppercase}
.sb-sub{font:400 10px monospace;color:rgba(74,66,100,.85);letter-spacing:2px;margin-top:3px}
.sb-pulse{display:flex;align-items:center;gap:5px;margin-top:8px}
.sb-dot{width:5px;height:5px;border-radius:50%;background:rgba(80,255,120,.7);animation:sbpulse 2s ease-in-out infinite;box-shadow:0 0 5px rgba(80,255,120,.4)}
@keyframes sbpulse{0%,100%{opacity:.6}50%{opacity:1}}
.sb-online{font:400 10px monospace;letter-spacing:2px;color:rgba(80,255,120,.58)}
nav{flex:1;padding:10px 0;overflow-y:auto}
nav::-webkit-scrollbar{width:0}
.ni{display:flex;align-items:center;gap:9px;padding:12px 14px 12px 50px;position:relative;transition:all .28s cubic-bezier(.25,.46,.45,.94);margin-bottom:4px;text-decoration:none;color:inherit}
.ni::before{content:'';position:absolute;left:29px;top:50%;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);border:1px solid rgba(167,139,250,.4);background:transparent;transition:all .28s ease}
.ni:hover::before{border-color:rgba(196,181,253,.88);box-shadow:0 0 8px rgba(196,181,253,.5)}
.ni.act::before{background:rgba(167,139,250,.18);border-color:rgba(196,181,253,.92);box-shadow:0 0 10px rgba(196,181,253,.6)}
.ni::after{content:'';position:absolute;left:29px;top:50%;width:4px;height:4px;transform:translate(-50%,-50%);border-radius:50%;background:transparent;transition:all .28s ease;pointer-events:none}
.ni:hover::after{background:rgba(196,181,253,.82);box-shadow:0 0 5px rgba(196,181,253,.6)}
.ni.act::after{background:rgba(255,255,255,.88);box-shadow:0 0 6px rgba(196,181,253,.8)}
.ni:hover,.ni.act{background:rgba(110,55,195,.14)}
.ni:hover{transform:translateX(4px)}
.ni.act{border-right:2px solid rgba(167,139,250,.68)}
.ni-icon{width:15px;height:15px;object-fit:contain;opacity:.70;filter:brightness(0) invert(1);transition:opacity .22s;flex-shrink:0}
.ni:hover .ni-icon,.ni.act .ni-icon{opacity:.95}
.ni-text{display:flex;flex-direction:column}
.ni-en{font:400 12px monospace;letter-spacing:2px;text-transform:uppercase;color:rgba(175,150,220,.78);transition:color .22s}
.ni-zh{font:400 11px monospace;color:rgba(160,142,205,.65);letter-spacing:1px;margin-top:2px;transition:color .22s}
.ni:hover .ni-en,.ni.act .ni-en{color:rgba(232,224,255,.97)}
.ni:hover .ni-zh,.ni.act .ni-zh{color:rgba(210,200,240,.88)}
.sb-footer{padding:14px 18px 18px 22px;background:transparent;flex-shrink:0}
.sb-footer-text{font:400 10px monospace;letter-spacing:1px;color:rgba(120,90,150,.45);line-height:1.6}

/* ── Page section nav ── */
#page-nav{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:0}
#page-nav::before{content:'';position:absolute;right:3px;top:14px;bottom:14px;width:1px;background:linear-gradient(to bottom,transparent,rgba(167,139,250,.2) 20%,rgba(167,139,250,.2) 80%,transparent);pointer-events:none}
.pn-item{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;text-decoration:none}
.pn-label{font:400 11px monospace;letter-spacing:.15em;text-transform:uppercase;color:rgba(196,181,253,.15);transform:translateX(6px);transition:color .2s,transform .2s;white-space:nowrap;user-select:none}
.pn-item:hover .pn-label{color:rgba(196,181,253,.85);transform:translateX(0)}
.pn-item.act .pn-label{color:rgba(196,181,253,.68);transform:translateX(0)}
.pn-node{width:7px;height:7px;transform:rotate(45deg);border:1px solid rgba(167,139,250,.28);background:transparent;transition:all .25s;flex-shrink:0}
.pn-item:hover .pn-node{border-color:rgba(196,181,253,.82);background:rgba(167,139,250,.35);box-shadow:0 0 8px rgba(167,139,250,.45)}
.pn-item.act .pn-node{border-color:rgba(196,181,253,.9);background:rgba(167,139,250,.72);box-shadow:0 0 10px rgba(196,181,253,.65),0 0 22px rgba(167,139,250,.3)}

/* ── Topbar ── */
#topbar{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 40px;background:linear-gradient(180deg,rgba(4,2,14,.88) 0%,rgba(4,2,14,.52) 65%,transparent 100%);backdrop-filter:blur(14px)}
.tb-brand{font:400 14px 'Cinzel Decorative','Cinzel',serif;letter-spacing:.3em;color:rgba(240,165,205,.92)}
.topbar-crumb{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:rgba(138,122,176,.7);text-transform:uppercase;display:flex;align-items:center;gap:0}
.topbar-crumb a{color:rgba(198,186,222,.6);text-decoration:none;transition:color .2s}
.topbar-crumb a:hover{color:rgba(196,181,253,.9)}
.topbar-crumb .sep{margin:0 8px;opacity:.45}
.topbar-crumb .here{color:rgba(196,181,253,.85)}
.topbar-tag{font-family:var(--mono);font-size:10px;letter-spacing:.2em;padding:4px 12px;border:1px solid rgba(167,139,250,.3);border-radius:999px;color:rgba(196,181,253,.8);text-transform:uppercase;justify-self:end}

/* ── Shell + Page layout ── */
#shell{display:grid;grid-template-columns:1fr;min-height:100vh;position:relative;z-index:1}
.page{max-width:1240px;margin:0 auto;padding:56px 40px 120px;width:100%}

/* ── Typography ── */
.h-display{font-family:var(--display);font-weight:400;font-size:clamp(48px,7vw,96px);line-height:.95;letter-spacing:-.025em;margin:0}
.h-display em{font-style:italic;color:var(--magic);font-family:'Instrument Serif',serif}
.h-sec{font-family:var(--sans);font-weight:600;font-size:clamp(26px,3.2vw,44px);letter-spacing:-.01em;line-height:1.05;margin:0}
.h-sec em{font-family:var(--sans);font-style:normal;font-weight:500;color:var(--magic);font-size:.7em;letter-spacing:0}
.lead{font-size:16px;color:var(--ink-mute);line-height:1.7}

/* ── Common components ── */
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--powder)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--powder);box-shadow:0 0 12px var(--powder)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:11px;color:var(--ink-mute);background:rgba(14,7,40,0.5);backdrop-filter:blur(4px)}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:80px 0}

/* ── Pipeline ── */
.pipeline{display:flex;align-items:stretch;gap:6px;margin:8px 0 40px;flex-wrap:wrap}
.step{flex:1 1 130px;min-width:130px;padding:16px 14px;border-radius:var(--r);background:linear-gradient(180deg,rgba(22,10,58,1),rgba(14,6,40,1));border:1px solid var(--line)}
.step-num{font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.16em}
.step-en{font-family:var(--sans);font-weight:600;font-size:16px;margin-top:8px;letter-spacing:-.005em}
.step-zh{font-family:var(--sans);font-weight:500;font-size:14px;color:var(--magic);line-height:1.2;margin:4px 0 8px}
.step-note{font-size:12px;color:var(--ink-mute);line-height:1.4}
.step[data-k="decide"]{border-color:rgba(240,165,205,.48);background:linear-gradient(180deg,rgba(48,14,36,.8),rgba(26,6,20,.8))}
.step[data-k="calc"]{border-color:rgba(212,168,78,.45);background:linear-gradient(180deg,rgba(46,36,12,.7),rgba(26,20,6,.7))}
.step[data-k="calc"] .step-zh{color:rgba(212,168,78,.9)}
.step[data-k="ftp"],.step[data-k="share"]{border-color:rgba(165,215,255,.5);background:linear-gradient(180deg,rgba(16,28,68,1),rgba(10,18,50,1))}
.step[data-k="share"] .step-en{color:var(--powder)}
.step-arrow{display:flex;align-items:center;color:var(--ink-dim);flex:0 0 auto}

/* ── Status strip ── */
.status-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:36px 0 48px;padding:20px 22px;background:rgba(10,4,28,0.6);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(8px)}
.status-cell{position:relative}
.status-cell+.status-cell{padding-left:20px;border-left:1px solid rgba(167,139,250,.12)}
.status-label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(196,181,253,0.75)}
.status-value{line-height:1.1;margin:6px 0 4px;letter-spacing:-.01em}
.status-value.mono{font-family:var(--mono);font-weight:500;font-size:20px;color:var(--powder)}
.status-sub{font-size:11.5px;color:var(--ink-mute)}

/* ── Project card ── */
.project{background:rgba(4,2,14,.58);border-radius:28px;padding:40px 44px;border:1px solid rgba(167,139,250,.08);backdrop-filter:blur(4px)}

/* ── Note as repo ── */
.repo-link-row{margin:8px 0 28px}
.repo-link{display:inline-flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(14,6,40,0.6);border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);font-family:var(--mono);font-size:13px;transition:all .2s ease}
.repo-mark{display:inline-grid;place-items:center;width:22px;height:22px;background:linear-gradient(135deg,var(--violet-deep),var(--magic));border-radius:50%;color:white;font-size:11px}
.repo-link.as-note{background:transparent;border-style:dashed;color:var(--ink-mute);cursor:default!important}
.repo-link.as-note:hover{background:transparent;border-color:var(--line)}
.repo-mark.mark-note{background:transparent;border:1px dashed var(--line);color:var(--ink-dim)}

/* ── Arch diagram ── */
.arch{display:grid;grid-template-columns:1fr auto 2fr;gap:20px;align-items:stretch;margin:8px 0 40px}
.arch-side{padding:20px;border-radius:var(--r-lg);border:1px solid var(--line);background:rgba(14,6,40,.5);display:flex;flex-direction:column}
.arch-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:rgba(196,181,253,0.75);margin-bottom:10px}
.arch-arrow{display:flex;align-items:center;color:var(--ink-dim)}
.arch-monolith{background:linear-gradient(180deg,rgba(44,18,12,.55),rgba(26,8,6,.55));border:1px dashed rgba(200,100,60,.48);border-radius:var(--r);padding:16px}
.arch-mono-head{font-family:var(--sans);font-weight:600;font-size:15px;margin-bottom:10px}
.arch-mono-stack{display:grid;gap:5px;font-family:var(--mono);font-size:12px}
.arch-mono-stack>div{background:rgba(80,36,20,.4);padding:7px 9px;border-radius:6px;color:var(--ink);border:1px solid rgba(200,100,60,.28)}
.arch-mono-tag{font-family:var(--sans);font-weight:500;color:rgba(220,140,100,.9);font-size:13px;margin-top:10px}
.arch-before-blue .arch-monolith{background:linear-gradient(180deg,rgba(12,22,52,.6),rgba(6,12,32,.6));border-color:rgba(100,140,220,.38)}
.arch-before-blue .arch-mono-stack>div{background:rgba(20,42,90,.4);border-color:rgba(100,140,220,.28)}
.arch-before-blue .arch-mono-tag{color:rgba(140,170,220,.9)}
.arch-three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:stretch}
.arch-two{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:stretch}
.arch-box{padding:14px 12px;border-radius:var(--r);background:linear-gradient(180deg,rgba(22,12,58,.7),rgba(14,6,44,.7));border:1px solid var(--line);display:flex;flex-direction:column}
.arch-box[data-k="a"]{border-color:rgba(165,215,255,.55)}
.arch-box[data-k="b"]{border-color:rgba(240,165,205,.55)}
.arch-box[data-k="c"]{border-color:rgba(212,168,78,.5)}
.arch-box[data-k="d"]{border-color:rgba(196,181,253,.5)}
.arch-box-head{font-family:var(--sans);font-weight:600;font-size:14px;letter-spacing:-.005em}
.arch-box-sub{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:rgba(196,181,253,0.65);margin:4px 0 9px;text-transform:uppercase}
.arch-box ul{margin:0;padding:0;list-style:none;font-size:12px;color:var(--ink-mute);display:grid;gap:3px}
.arch-box ul li::before{content:'·';margin-right:5px;color:var(--magic)}

/* ── Feature grid ── */
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 40px}
.feature-card{padding:18px 20px 20px;border-radius:var(--r-lg);background:linear-gradient(180deg,rgba(22,10,58,0.7),rgba(14,6,40,0.7));border:1px solid var(--line);position:relative}
.feature-card.feature-mine{border-color:rgba(240,165,205,.45);background:linear-gradient(180deg,rgba(42,14,32,.7),rgba(22,6,20,.7))}
.feature-my-badge{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;padding:2px 8px;border-radius:99px;background:rgba(240,165,205,.12);border:1px solid rgba(240,165,205,.38);color:rgba(240,165,205,.9)}
.feature-t{font-family:var(--sans);font-weight:600;font-size:14px;margin-bottom:7px;color:var(--ink)}
.feature-d{font-size:12.5px;color:var(--ink-mute);line-height:1.55}

/* ── Client strip ── */
.client-strip{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 32px}
.client-card{padding:14px 18px;border-radius:var(--r);background:rgba(14,6,40,.5);border:1px solid var(--line);min-width:140px;flex:1}
.client-card.hl{border-color:rgba(240,165,205,.42);background:rgba(40,12,28,.5)}
.client-type{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:rgba(196,181,253,0.75);margin-bottom:5px;text-transform:uppercase}
.client-name{font-family:var(--sans);font-weight:600;font-size:15px;color:var(--ink);margin-bottom:4px}
.client-card.hl .client-name{color:var(--magic)}
.client-note{font-size:12px;color:var(--ink-mute)}

/* ── Notes ── */
.notes-wrap{margin:44px 0 8px}
.notes-head{margin-bottom:14px}
.notes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.notes-grid.cols-2{grid-template-columns:repeat(2,1fr)}
.note-card{position:relative;padding:20px 20px 22px;border-radius:var(--r-lg);background:linear-gradient(180deg,rgba(22,10,58,0.7),rgba(14,6,40,0.7));border:1px solid var(--line);overflow:hidden}
.note-card::before{content:'';position:absolute;top:-18px;right:-18px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,var(--magic),transparent 65%);opacity:.16;pointer-events:none}
.note-num{font-family:var(--mono);font-size:11px;color:var(--powder);letter-spacing:.18em;margin-bottom:12px}
.note-t{font-family:var(--sans);font-weight:600;font-size:16px;letter-spacing:-.005em;margin-bottom:7px;color:var(--ink)}
.note-d{font-size:13px;line-height:1.6;color:var(--ink-mute)}

/* ── Shell code block ── */
.sh-block{background:rgba(2,0,10,1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:12px 0 40px}
.sh-head{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(167,139,250,.1);background:rgba(8,3,24,.95);font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:rgba(196,181,253,.72)}
.sh-head .sh-lang{color:var(--powder);margin-left:auto}
.sh-body{padding:16px 18px;overflow-x:auto;line-height:2;font-family:var(--mono);font-size:12.5px;white-space:pre;color:rgba(198,186,222,.72)}
.sh-cm{color:rgba(138,122,176,.55);font-style:italic}
.sh-cmd{color:var(--powder)}
.sh-flag{color:var(--magic)}

/* ── Hero ── */
.hero{display:grid;gap:28px;padding:24px 0 36px}
.hero-mark{width:52px;height:52px;display:grid;place-items:center;background:rgba(14,7,40,0.6);border:1px solid var(--line);border-radius:14px;filter:drop-shadow(0 0 20px rgba(240,165,205,.4))}
.hero-eyebrow{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero-crumbs{font-family:var(--mono);font-size:12px;color:var(--ink-dim);display:inline-flex;gap:8px;align-items:center}
.hero-crumbs a{color:var(--ink-mute);text-decoration:none}
.hero-crumbs a:hover{color:var(--ink)}
.hero-crumbs .sep{opacity:.45}
.hero-crumbs .here{color:var(--powder)}
.h-display .hero-zh{font-family:'Cubic',var(--sans);font-weight:normal;letter-spacing:.06em;background:linear-gradient(135deg,var(--powder),var(--magic) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-lead{font-size:18px;line-height:1.65;color:var(--ink-mute);max-width:64ch;margin:4px 0 0}
.hero-lead em{font-family:var(--display);font-style:italic;color:var(--ink);font-size:1.05em;padding:0 2px}
.hero-lead .emp{font-style:normal;font-family:var(--sans);font-weight:500;letter-spacing:0;color:var(--powder)}
.hero-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px 24px;border:1px solid var(--line);background:rgba(10,4,28,0.55);border-radius:var(--r-lg);backdrop-filter:blur(8px)}
.hero-meta-cell+.hero-meta-cell{padding-left:20px;border-left:1px solid rgba(167,139,250,.12)}
.meta-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(196,181,253,0.75);margin-bottom:6px}
.meta-val{font-family:var(--sans);font-size:14px;color:var(--ink);letter-spacing:-.005em}
.hero-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hero-nav a{display:flex;align-items:baseline;gap:14px;padding:16px 18px;background:linear-gradient(180deg,rgba(22,10,58,0.65),rgba(14,6,40,0.65));border:1px solid var(--line);border-radius:var(--r-lg);text-decoration:none;color:var(--ink);font-family:var(--sans);font-weight:500;font-size:14px;transition:all .2s ease}
.hero-nav a:hover{border-color:rgba(165,215,255,.5);transform:translateY(-2px);box-shadow:0 12px 28px rgba(4,2,14,.4)}
.hero-nav .num{font-family:var(--mono);font-size:12px;color:var(--powder);letter-spacing:.1em}

/* ── Footer ── */
.foot{margin-top:96px;padding:36px 0 0;border-top:1px solid rgba(167,139,250,.12);display:grid;gap:12px;justify-items:center;text-align:center}
.foot-mark{font-family:var(--display);font-size:30px;color:var(--magic)}
.foot-text{font-size:13.5px;color:var(--ink-mute)}
.foot-text em{font-family:var(--display);font-style:italic;color:var(--ink)}
.foot-nav{display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
.foot-nav a{color:var(--ink-mute);text-decoration:none}
.foot-nav a:hover{color:var(--ink)}
.foot-nav span{opacity:.45}
#prog{position:fixed;top:0;left:0;height:2px;width:0%;background:linear-gradient(to right,rgba(103,232,249,.4),rgba(167,139,250,.85),rgba(240,165,205,.7));z-index:9000;pointer-events:none;transition:width .1s linear}

/* ── Responsive ── */
@media(max-width:960px){
  .arch{grid-template-columns:1fr}
  .arch-arrow{transform:rotate(90deg);justify-content:center;margin:8px 0}
}
@media(max-width:820px){
  .feature-grid{grid-template-columns:repeat(2,1fr)}
  .notes-grid:not(.cols-2){grid-template-columns:repeat(2,1fr)}
  .hero-nav{grid-template-columns:repeat(2,1fr);gap:8px}
  .hero-nav a{padding:12px 14px;font-size:13px}
}
/* text wrapping — global */
.note-d,.feature-d,.step-note,.lead,.hero-lead{overflow-wrap:break-word;word-break:break-word}

@media(max-width:768px){
  html,body{overflow-x:hidden;width:100%}
  #shell{max-width:100vw;overflow-x:hidden}
  .page{padding:36px 12px 80px;max-width:100vw;box-sizing:border-box}
  .project{padding:20px 12px!important;overflow-x:visible}
  .page *{min-width:0;box-sizing:border-box}
  #cursor-dot,#cursor-ring,#page-nav{display:none}
  #topbar{padding:10px 16px;grid-template-columns:1fr auto}
  #topbar>*:nth-child(2){display:none}
  .h-display{font-size:clamp(26px,7vw,46px)!important}
  .hero-lead{max-width:100%;font-size:16px}
  .hero-meta{grid-template-columns:repeat(2,1fr)!important;padding:14px 14px!important;gap:10px}
  .hero-meta-cell+.hero-meta-cell{padding-left:0;border-left:none}
  .hero-meta-cell:nth-child(even){padding-left:10px;border-left:1px solid rgba(167,139,250,.12)}
  .status-strip{grid-template-columns:repeat(2,1fr)!important;gap:10px;padding:12px 10px!important}
  .status-cell+.status-cell{padding-left:0;border-left:none}
  .status-cell:nth-child(even){padding-left:14px;border-left:1px solid rgba(167,139,250,.1)}
  .arch-three,.arch-two,.notes-grid{grid-template-columns:1fr!important}
  .pipeline{flex-wrap:wrap;gap:8px}
  .step{flex:1 1 calc(50% - 8px);min-width:120px}
  .sh-body{overflow-x:auto;-webkit-overflow-scrolling:touch;font-size:11.5px}
  .client-strip{flex-direction:column}
  .client-card{min-width:unset}
  .sec-tags{flex-wrap:wrap}
  /* scrollable diagram wrappers */
  .diagram-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .diagram-scroll svg{min-width:340px}
  /* OCR mockup sizing */
  .ocr-wrap{padding:12px 10px 10px!important}
}
@media(max-width:480px){
  .page{padding:24px 12px 60px}
  .project{padding:14px 10px!important}
  .hero-nav{grid-template-columns:1fr}
  .hero-nav a{padding:13px 16px;font-size:14px}
  .feature-grid,.notes-grid{grid-template-columns:1fr!important}
  .feature-card{padding:14px 14px 16px}
  .note-card{padding:16px 14px 18px}
  .status-strip{grid-template-columns:1fr}
  .status-cell:nth-child(even){padding-left:0;border-left:none}
  .step{flex:1 1 100%;padding:12px 12px}
  .step-en{font-size:15px}
  .diagram-scroll svg{min-width:320px}
  .pipeline{gap:6px}
  .hero-meta-cell:nth-child(even){padding-left:0;border-left:none}
  .hero-meta{grid-template-columns:repeat(2,1fr)}
}
/* ── Language toggle ── */
.lang-toggle{display:flex;align-items:center;background:rgba(14,7,40,.75);border:1px solid rgba(167,139,250,.35);border-radius:999px;padding:3px;gap:2px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.lt-cur{padding:4px 13px;background:rgba(167,139,250,.22);border-radius:999px;color:rgba(232,224,255,.95);box-shadow:0 0 10px rgba(167,139,250,.2)}
.lt-link{padding:4px 13px;color:rgba(196,181,253,.5);text-decoration:none;border-radius:999px;transition:color .18s,background .18s}
.lt-link:hover{color:rgba(232,224,255,.9);background:rgba(167,139,250,.12)}

/* ── Mobile floating section nav ── */
#mob-nav{display:none}
@media(max-width:768px){
  #mob-nav{display:block;position:fixed;right:20px;bottom:28px;z-index:80}
  #mob-nav-btn{
    width:46px;height:46px;border-radius:50%;
    background:rgba(14,7,40,.95);border:1px solid rgba(167,139,250,.5);
    color:rgba(196,181,253,.9);font-size:20px;line-height:1;cursor:pointer;
    backdrop-filter:blur(16px);
    box-shadow:0 4px 24px rgba(0,0,0,.6),0 0 0 1px rgba(167,139,250,.08);
    display:flex;align-items:center;justify-content:center;
    transition:all .22s;border:1px solid rgba(167,139,250,.5)
  }
  .mn-ico-x{display:none}
  #mob-nav.open .mn-ico-bars{display:none}
  #mob-nav.open .mn-ico-x{display:block}
  #mob-nav.open #mob-nav-btn{border-color:rgba(240,165,205,.55);color:rgba(240,165,205,.9)}
  #mob-nav-panel{
    position:absolute;bottom:56px;right:0;width:232px;
    background:rgba(10,4,28,.97);border:1px solid rgba(167,139,250,.28);
    border-radius:14px;padding:6px 0 8px;
    backdrop-filter:blur(24px);
    box-shadow:0 -4px 40px rgba(0,0,0,.7),0 0 0 1px rgba(167,139,250,.06);
    opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;
    transition:opacity .2s,transform .2s;
    max-height:72vh;overflow-y:auto
  }
  #mob-nav.open #mob-nav-panel{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .mn-head{
    font:400 9px 'JetBrains Mono','Courier New',monospace;
    letter-spacing:3px;text-transform:uppercase;
    color:rgba(140,115,190,.55);padding:8px 16px 6px;
    border-bottom:1px solid rgba(167,139,250,.1);margin-bottom:4px
  }
  .mn-sep{
    font:400 9px 'JetBrains Mono','Courier New',monospace;
    color:rgba(120,100,160,.42);letter-spacing:1px;padding:8px 16px 4px;margin-top:2px
  }
  .mn-link{
    display:flex;align-items:center;gap:10px;padding:8px 16px;
    text-decoration:none;color:rgba(175,155,215,.75);transition:all .18s
  }
  .mn-link:active,.mn-link.mn-act{background:rgba(110,55,195,.12);color:rgba(225,215,250,.95)}
  .mn-link.mn-act{box-shadow:inset 3px 0 0 rgba(196,181,253,.7)}
  .mn-num{
    font:400 10px 'JetBrains Mono','Courier New',monospace;
    letter-spacing:.1em;color:rgba(165,215,255,.6);flex-shrink:0;width:20px
  }
  .mn-link span:last-child{font:400 12px 'JetBrains Mono','Courier New',monospace}
  .mn-top .mn-num{color:rgba(240,165,205,.6)}
}

<script type="text/babel">

/* ── Shared components ── */

function SectionHeader({ index, en, zh, summary, tags, role }){
  return (
    <header style={{ display:"grid", gap:16, marginBottom:32 }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
        <span className="eyebrow"><span className="dot"></span>PROJECT · {String(index).padStart(2,'0')}</span>
        {role && <RoleBadge type={role}/>}
      </div>
      <h2 className="h-sec">{en} <em>· {zh}</em></h2>
      {tags && (
        <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
          {tags.map(t => <span key={t} className="tag">{t}</span>)}
        </div>
      )}
      {summary && <p className="lead" style={{ marginTop:4 }}>{summary}</p>}
    </header>
  );
}

function RoleBadge({ type }){
  const cfg = {
    lead:   { label:'LEAD',   c:'rgba(240,165,205,1)', bg:'rgba(240,165,205,0.10)', b:'rgba(240,165,205,0.45)' },
    contrib:{ label:'CONTRIB',c:'rgba(165,215,255,1)', bg:'rgba(165,215,255,0.08)', b:'rgba(165,215,255,0.38)' },
    solo:   { label:'SOLO',   c:'rgba(212,168,78,1)',  bg:'rgba(212,168,78,0.10)',  b:'rgba(212,168,78,0.42)'  },
  };
  const { label, c, bg, b } = cfg[type] || cfg.contrib;
  return (
    <span style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'3px 10px',
      border:`1px solid ${b}`, borderRadius:999, fontSize:10, fontFamily:'var(--mono)',
      letterSpacing:'.18em', color:c, background:bg }}>
      <span style={{ width:5, height:5, borderRadius:'50%', background:c,
        boxShadow:`0 0 5px ${c}`, display:'inline-block', flexShrink:0 }}></span>
      {label}
    </span>
  );
}

function ConfidentialNote({ text }){
  return (
    <div className="repo-link-row">
      <span className="repo-link as-note">
        <span className="repo-mark mark-note">·</span>
        <span>{text || '公司內部專案 · 程式碼不公開'}</span>
      </span>
    </div>
  );
}

function Pipeline({ steps }){
  return (
    <div className="pipeline">
      {steps.map((s, i) => (
        <React.Fragment key={s.k}>
          <div className="step" data-k={s.k}>
            <div className="step-num">{s.n}</div>
            <div className="step-en">{s.en}</div>
            <div className="step-zh">{s.zh}</div>
            <div className="step-note">{s.note}</div>
          </div>
          {i < steps.length - 1 && (
            <div className="step-arrow" aria-hidden="true">
              <svg viewBox="0 0 40 12" width="36" height="12">
                <path d="M0 6 H34 M28 1 L34 6 L28 11" stroke="currentColor" strokeWidth="1.2" fill="none"/>
              </svg>
            </div>
          )}
        </React.Fragment>
      ))}
    </div>
  );
}

function OutcomeStrip({ cells }){
  return (
    <div className="status-strip">
      {cells.map((c, i) => (
        <div key={i} className="status-cell">
          <div className="status-label">{c.label}</div>
          <div className={"status-value " + (c.mono !== false ? "mono" : "")}
            style={c.color ? { color:c.color } : {}}>
            {c.value}
          </div>
          <div className="status-sub">{c.sub}</div>
        </div>
      ))}
    </div>
  );
}

function NotesGrid({ notes, cols2 }){
  return (
    <div className="notes-wrap">
      <div className="notes-head">
        <span className="eyebrow"><span className="dot"></span>NOTES · 印象深刻的環節</span>
      </div>
      <div className={"notes-grid" + (cols2 ? " cols-2" : "")}>
        {notes.map(n => (
          <div key={n.n} className="note-card">
            <div className="note-num">{n.n}</div>
            <div className="note-t">{n.t}</div>
            <div className="note-d">{n.d}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ════════════════════════════════
   P1 — 封面自助編輯系統
   ════════════════════════════════ */
function P1CoverEditor(){
  const steps = [
    { n:"01", k:"upload",  en:"Upload",    zh:"上傳驗證",  note:"PDF 格式 · 尺寸 · 出血線自動偵測" },
    { n:"02", k:"decide",  en:"Decision",  zh:"版本判斷",  note:"裝訂方式 / 版面組合 / 色彩模式" },
    { n:"03", k:"calc",    en:"Calculate", zh:"尺寸計算",  note:"封面/書背公式 · 出血尺寸自動推算" },
    { n:"04", k:"compose", en:"Process",   zh:"影像處理",  note:"裁切 → 放大 → 拼版 → 字體縮放" },
    { n:"05", k:"export",  en:"Finalize",  zh:"規格產出",  note:"加白邊 · 裁切線(紅/黑) · 壓縮" },
    { n:"06", k:"ftp",     en:"FTP",       zh:"自動傳輸",  note:"印製端直接取件 · 零人工介入" },
  ];
  const outcome = [
    { label:"修改時程",  value:"即時完成",  mono:true, color:"var(--magic)", sub:"原本需 2–3 個工作天" },
    { label:"版面種類",  value:"多版本",    mono:false,                       sub:"騎馬釘 / 膠裝 / 多種組合" },
    { label:"我的角色",  value:"主要負責人",mono:false,                       sub:"系統流程設計 · 後端開發" },
    { label:"規格決策",  value:"全自動",    mono:true,                        sub:"無需業務人工介入確認" },
  ];
  const dims = [
    { title:"裝訂方式", color:"var(--powder)",         items:["騎馬釘（無書背，尺寸規則不同）","膠裝（書背厚度依頁數公式計算）"] },
    { title:"版面組合", color:"var(--magic)",           items:["封面 + 封底","封面 + 書背 + 封底","僅封面（單頁）"] },
    { title:"色彩模式", color:"rgba(212,168,78,1)",     items:["彩色（CMYK 流程）","黑白（灰階 · 套不同規格）"] },
    { title:"裁切線類型", color:"rgba(196,181,253,.9)", items:["預覽用 → 紅色裁切線（標示位置）","實際裁切 → 黑色裁切線（送切）"] },
  ];
  const notes = [
    { n:"01", t:"複雜的版本分支", d:"封面系統最核心的挑戰是處理各種版本組合——騎馬釘與膠裝的書背計算完全不同，封面/封底/書背各自的尺寸公式、拼版順序、出血處理都需要獨立對應。" },
    { n:"02", t:"色彩延伸套件整合", d:"其中一項功能需要 Content-Aware 邊緣填補，市面上找不到可用的免費套件，最後公司付費購入商用套件；套件整合時疑似依賴 Linux 環境，在 Windows 開發環境下排查了相當長的時間。" },
    { n:"03", t:"成果報告對內分享", d:"專案完成後在公司內部做了成果報告，是第一次正式對整個團隊說明自己主導的系統設計決策與實作過程。" },
  ];
  return (
    <section className="project">
      <SectionHeader index={1}
        en="Cover Editor"
        zh="客戶端封面自助編輯系統"
        summary="原本客戶修改書籍封面需透過業務來回溝通，流程耗費 2–3 個工作天。系統讓客戶自行上傳封面，自動依裝訂方式、版面組合與色彩模式計算尺寸、裁切、拼版，最後加上對應裁切線並壓縮後 FTP 傳至印製端，全程不需業務人工介入。"
        tags={["C#", "ASP.NET Core", "SQL Server", "FTP 自動化", "影像處理"]}
        role="lead"
      />
      <ConfidentialNote/>
      <Pipeline steps={steps}/>
      <div style={{ marginTop:4, marginBottom:44 }}>
        <div style={{ marginBottom:14 }}>
          <span className="eyebrow"><span className="dot"></span>RULE DIMENSIONS · 系統需處理的規則維度</span>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))', gap:14 }}>
          {dims.map(d => (
            <div key={d.title} className="note-card" style={{ margin:0 }}>
              <div style={{ fontFamily:'var(--mono)', fontSize:10, letterSpacing:'.16em',
                color:d.color, marginBottom:10, textTransform:'uppercase' }}>{d.title}</div>

function OcrMockup(){
  const W = 148, H = 196;
  const WinW = 480, WinH = 318;
  const titleH = 26, menuH = 22;
  const leftX = 74, rightX = 258; // symmetric in 480
  const pagesY = titleH + menuH + 22;
  const statusH = 22;

  const rows = [
    { y:26, ws:[24,14,28,10,20,12] },
    { y:40, ws:[30,16,10,32,14,18] },
    { y:54, ws:[10,22,14,16,26,10,12] },
    { y:68, ws:[26,12,28,22,16] },
    { y:84, ws:[14,22,10,18,24,12] },
    { y:98, ws:[34,12,22,28,10] },
    { y:112,ws:[10,18,26,14,20,14] },
    { y:126,ws:[22,10,20,30,12,16] },
    { y:142,ws:[16,22,10,24,18,10] },
    { y:156,ws:[24,14,22,16,26] },
    { y:170,ws:[12,20,28,16,18,12] },
    { y:184,ws:[28,14,22,18,24] },
  ];
  const lines = rows.map(r => {
    let x = 10;
    return { y:r.y, words: r.ws.map(w => { const rx=x; x+=w+4; return {x:rx,w}; }).filter(wd=>wd.x+wd.w<W-6) };
  });
  const noise = [[34,30],[86,43],[14,66],[132,56],[52,91],[120,107],[22,129],[93,145],[64,167],[135,177],[40,183]];
  const guides = rows.map(r=>r.y);

  const Page = ({ offsetX, processed }) => (
    <g>
      <rect x={offsetX+2} y={pagesY+2} width={W} height={H} rx="2" fill="rgba(0,0,0,.22)"/>
      <svg x={offsetX} y={pagesY} width={W} height={H} overflow="hidden">
        <rect x="0" y="0" width={W} height={H} fill="rgba(244,239,218,.93)"/>
        <rect x="7" y="7" width={W-14} height={H-14} fill="none" stroke="rgba(180,170,140,.18)" strokeWidth=".5"/>
        {processed && guides.map((y,i)=>(
          <line key={`g${i}`} x1="4" y1={y-1} x2={W-4} y2={y-1}
            stroke="rgba(72,135,215,.26)" strokeWidth=".7" strokeDasharray="4 4"/>
        ))}
        {processed && <line x1="10" y1="16" x2="10" y2={H-12} stroke="rgba(72,135,215,.18)" strokeWidth=".7" strokeDasharray="3 4"/>}
        {lines.map((ln,li)=>ln.words.map((wd,wi)=>(
          <rect key={`t${li}${wi}`} x={wd.x} y={ln.y-4} width={wd.w} height={3.8} rx="1" fill="rgba(32,22,12,.68)"/>
        )))}
        {!processed && noise.filter(([,cy])=>cy<H-3).map(([cx,cy],i)=>(
          <circle key={`n${i}`} cx={cx} cy={cy} r="1.5" fill="rgba(55,44,28,.44)"/>
        ))}
        {processed && lines.slice(0,11).map((ln,li)=>ln.words.map((wd,wi)=>(
          <rect key={`rb${li}${wi}`} x={wd.x-1.5} y={ln.y-6} width={wd.w+3} height={7.5}
            rx="1" fill="none" stroke="rgba(215,50,50,.70)" strokeWidth=".85"/>
        )))}
        {processed && guides.slice(0,11).map((y,i)=>(
          <line key={`rt${i}`} x1="2" y1={y-1} x2="8" y2={y-1} stroke="rgba(72,135,215,.64)" strokeWidth="1.1"/>
        ))}
        <text x={W-5} y={H-4} textAnchor="end" fill="rgba(38,28,16,.33)" fontSize="6.5" fontFamily="monospace">— {processed?'2':'1'} —</text>
      </svg>
    </g>
  );

  const arrowMidY = pagesY + H/2;

  return (
    <div className="ocr-wrap" style={{ margin:'8px 0 40px', borderRadius:18, padding:'20px 16px 16px', border:'1px solid rgba(167,139,250,.15)', background:'rgba(4,2,14,.5)' }}>
      <div style={{ marginBottom:12 }}>
        <span className="eyebrow" style={{ fontSize:11 }}><span className="dot"></span>SYSTEM OVERVIEW · 處理效果示意</span>
      </div>
      <div className="diagram-scroll">
      <svg viewBox={`0 0 ${WinW} ${WinH}`} width="100%" style={{ display:'block', minWidth:340, maxWidth:680, margin:'0 auto' }}>
        <defs>
          <clipPath id="ocr-win-clip">
            <rect x="0" y="0" width={WinW} height={WinH} rx="10"/>
          </clipPath>
        </defs>
        <g clipPath="url(#ocr-win-clip)">
          {/* 視窗底色 */}
          <rect x="0" y="0" width={WinW} height={WinH} fill="rgba(24,12,48,.96)"/>
          {/* 標題列 */}
          <rect x="0" y="0" width={WinW} height={titleH} fill="rgba(34,18,68,.98)"/>
          <line x1="0" y1={titleH} x2={WinW} y2={titleH} stroke="rgba(167,139,250,.18)" strokeWidth="1"/>
          {[18,34,50].map((cx,i)=>(
            <circle key={i} cx={cx} cy={titleH/2} r="5"
              fill={["rgba(238,76,76,.74)","rgba(238,176,56,.74)","rgba(56,196,86,.74)"][i]}/>
          ))}
          <text x={WinW/2} y={titleH/2+4.5} textAnchor="middle" fill="rgba(218,210,252,.86)" fontSize="11.5" fontFamily="monospace" letterSpacing=".5">舊書重製系統 · 頁面校正</text>
          {/* 選單列 */}
          <rect x="0" y={titleH} width={WinW} height={menuH} fill="rgba(20,10,42,.95)"/>
          <line x1="0" y1={titleH+menuH} x2={WinW} y2={titleH+menuH} stroke="rgba(167,139,250,.13)" strokeWidth="1"/>
          {['檔案','編輯','工具列','檢視'].map((item,i)=>(
            <text key={item} x={14+i*52} y={titleH+menuH-6} fill="rgba(196,184,228,.68)" fontSize="10.5" fontFamily="monospace">{item}</text>
          ))}
          <rect x={WinW-82} y={titleH+4} width={70} height={menuH-8} rx="3" fill="rgba(36,22,64,.8)" stroke="rgba(167,139,250,.22)" strokeWidth=".8"/>
          <text x={WinW-47} y={titleH+menuH-6} textAnchor="middle" fill="rgba(196,184,228,.68)" fontSize="10" fontFamily="monospace">縮放 100%</text>
          {/* 內容區 */}
          <rect x="0" y={titleH+menuH} width={WinW} height={WinH-titleH-menuH-statusH} fill="rgba(40,24,72,.4)"/>
          {/* 頁面標籤 */}
          <text x={leftX+W/2} y={titleH+menuH+16} textAnchor="middle" fill="rgba(200,188,232,.70)" fontSize="10" letterSpacing="1.5" fontFamily="monospace">原始掃描</text>
          <text x={rightX+W/2} y={titleH+menuH+16} textAnchor="middle" fill="rgba(200,188,232,.70)" fontSize="10" letterSpacing="1.5" fontFamily="monospace">OCR 處理後</text>
          <Page offsetX={leftX} processed={false}/>
          {/* 箭頭 */}
          <path d={`M ${leftX+W+4} ${arrowMidY} H ${rightX-4} M ${rightX-11} ${arrowMidY-7} L ${rightX-4} ${arrowMidY} L ${rightX-11} ${arrowMidY+7}`}
            stroke="rgba(165,215,255,.36)" strokeWidth="1.5" fill="none"/>
          <Page offsetX={rightX} processed={true}/>
          {/* 圖例 */}
          <g transform={`translate(${leftX},${pagesY+H+13})`}>
            <rect x="0" y="-3" width="13" height="7" rx="1" fill="none" stroke="rgba(215,50,50,.74)" strokeWidth=".85"/>
            <text x="17" y="2" fill="rgba(208,198,240,.74)" fontSize="9" letterSpacing=".8" fontFamily="monospace">OCR 框選</text>
            <line x1="94" y1="0" x2="108" y2="0" stroke="rgba(72,135,215,.64)" strokeWidth=".9" strokeDasharray="4 3"/>
            <text x="112" y="2" fill="rgba(208,198,240,.74)" fontSize="9" letterSpacing=".8" fontFamily="monospace">對齊線</text>
            <circle cx="192" cy="0" r="2" fill="rgba(55,44,28,.48)"/>
            <text x="198" y="2" fill="rgba(208,198,240,.74)" fontSize="9" letterSpacing=".8" fontFamily="monospace">雜點</text>
          </g>
          {/* 狀態列 */}
          <rect x="0" y={WinH-statusH} width={WinW} height={statusH} fill="rgba(16,6,36,.96)"/>
          <line x1="0" y1={WinH-statusH} x2={WinW} y2={WinH-statusH} stroke="rgba(167,139,250,.12)" strokeWidth="1"/>
          <text x="12" y={WinH-7} fill="rgba(160,182,216,.50)" fontSize="9" fontFamily="monospace">頁面 1 / 45　　雜點偵測: 完成　　對齊校正: 正常　　OCR 完成率: 98.4%</text>
        </g>
        {/* 視窗外框 */}
        <rect x="0" y="0" width={WinW} height={WinH} rx="10" fill="none" stroke="rgba(167,139,250,.22)" strokeWidth="1"/>
      </svg>
      </div>
    </div>
  );
}

/* ── Coupon schema code block ── */
function CouponSchema(){
  const code = [
    ['cm','# ── 三種 CouponType（折扣方式）────────────────────────'],
    ['kw','M'],['','  ─ 免費期間（Free Period）'],
    ['code','{"discount":{"type":"FREE_PERIOD","count":1,"unit":"MONTH"}}'],
    [''],
    ['kw','$(A)'],['','  ─ 固定金額折扣'],
    ['code','{"discount":{"type":"AMOUNT","amount":100}}'],
    [''],
    ['kw','%(P)'],['','  ─ 百分比折扣（最常用）'],
    ['code','{\n  "discount":{\n    "type":"PERCENT", "percent":10,\n    "maxDiscount":200, "recurringMonths":2,\n    "rounding":{"scale":2}\n  }\n}'],
    [''],
    ['cm','# ── constraints（使用條件）─────────────────────────────'],
    ['code','"constraints":{\n  "billingCycle":  ["Monthly"],\n  "productStatus": ["Active"],\n  "minSubtotal":   100,'],
    ['code','  "planIds":      [10007]  '],['cm','← 對應 Bundle 方案 ID'],
    ['code','}'],
  ];
  return (
    <div className="sh-block" style={{margin:'12px 0 36px'}}>
      <div className="sh-head">
        <span>COUPON SCHEMA</span>
        <span style={{marginLeft:'auto', color:'rgba(165,215,255,.72)'}}>JSON</span>
      </div>
      <div className="sh-body">
        {code.map((row,i) => {
          if(!row[0] && !row[1]) return <br key={i}/>;
          const [type, text] = row;
          if(type==='cm')   return <span key={i} className="sh-cm">{text}{'\n'}</span>;
          if(type==='kw')   return <span key={i} className="sh-cmd">{text}</span>;
          if(type==='code') return <span key={i} style={{color:'rgba(196,186,228,.80)'}}>{text}{'\n'}</span>;
          return <span key={i} style={{color:'rgba(160,150,200,.58)'}}>{text}</span>;
        })}
      </div>
    </div>
  );
}

<script>
(function(){
  const dot  = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  document.addEventListener('mousemove', e => {
    dot.style.left  = e.clientX + 'px';
    dot.style.top   = e.clientY + 'px';
    ring.style.left = e.clientX + 'px';
    ring.style.top  = e.clientY + 'px';
  });
  document.addEventListener('mouseover', e => {
    if(e.target.closest('a,button')) document.body.classList.add('hov');
  });
  document.addEventListener('mouseout', e => {
    if(e.target.closest('a,button')) document.body.classList.remove('hov');
  });
  const container = document.getElementById('stars');
  const colors = ['#ffffff','rgba(255,185,215,1)','rgba(165,215,255,1)','rgba(255,220,140,1)'];
  for(let i = 0; i < 130; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() < 0.75 ? 1 : 1.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*4)]};--d:${2+Math.random()*4}s;--dl:${Math.random()*5}s;--a:${.2+Math.random()*.55}`;
    container.appendChild(s);
  }
})();
</script>

<!-- ── Page section dot nav + progress ── -->
<script>
(function(){
  var secs = [
    { id:'top', en:'OVERVIEW'   },
    { id:'p1',  en:'COVER'      },
    { id:'p2',  en:'BOOK'       },
    { id:'p3',  en:'ERP · ESB'  },
    { id:'p4',  en:'FINANCE'    },
    { id:'p5',  en:'REFACTOR'   },
    { id:'p6',  en:'DOCKER'     },
    { id:'p7',  en:'FRONTEND'   },
    { id:'p8',  en:'LOGIN'      },
    { id:'p9',  en:'FEATURES'   },
  ];
  setTimeout(function(){
    var nav = document.getElementById('page-nav');
    if(!nav) return;
    var items = [];
    secs.forEach(function(s){
      var el = document.getElementById(s.id);
      if(!el) return;
      var a = document.createElement('a');
      a.className = 'pn-item';
      a.href = '#' + s.id;
      a.innerHTML = '<span class="pn-label">' + s.en + '</span><div class="pn-node"></div>';
      a.addEventListener('click', function(e){
        e.preventDefault();
        el.scrollIntoView({ behavior:'smooth' });
      });
      nav.appendChild(a);
      items.push({ el:el, a:a });
    });
    if(!items.length) return;
    var cur = null;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        var it = items.find(function(i){ return i.el === e.target; });
        if(!it || !e.isIntersecting) return;
        if(cur) cur.classList.remove('act');
        cur = it.a;
        cur.classList.add('act');
      });
    }, { rootMargin:'-5% 0px -60% 0px' });
    items.forEach(function(i){ io.observe(i.el); });
  }, 250);
})();
(function(){
  var mn = document.getElementById('mob-nav');
  var btn = document.getElementById('mob-nav-btn');
  var panel = document.getElementById('mob-nav-panel');
  if(!mn) return;
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    mn.classList.toggle('open');
  });
  panel.querySelectorAll('.mn-link').forEach(function(a){
    a.addEventListener('click', function(){ mn.classList.remove('open'); });
  });
  document.addEventListener('click', function(e){
    if(!mn.contains(e.target)) mn.classList.remove('open');
  });
  // highlight active section
  var secIds = ['top','p1','p2','p3','p4','p5','p6','p7','p8','p9'];
  var links = {};
  secIds.forEach(function(id){
    var a = panel.querySelector('a[href="#'+id+'"]');
    if(a) links[id] = a;
  });
  function updateAct(){
    var cur = 'top';
    secIds.forEach(function(id){
      var el = document.getElementById(id);
      if(el && el.getBoundingClientRect().top <= 100) cur = id;
    });
    Object.keys(links).forEach(function(id){
      links[id].classList.toggle('mn-act', id === cur);
    });
  }
  window.addEventListener('scroll', updateAct, {passive:true});
  updateAct();
})();

(function(){
  var prog = document.getElementById('prog');
  if(!prog) return;
  window.addEventListener('scroll', function(){
    var h = document.documentElement.scrollHeight - window.innerHeight;
    prog.style.width = (h > 0 ? Math.round(window.scrollY / h * 100) : 0) + '%';
  }, { passive:true });
})();
</script>
</body>
