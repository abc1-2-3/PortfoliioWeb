<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FIELD — every number is a place</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#06070d;
  --ink:#e8eaf2;
  --dim:rgba(232,234,242,.55);
  --faint:rgba(232,234,242,.25);
  --hue:60;
  --tint: oklch(0.82 0.14 var(--hue));
  --tint-glow: oklch(0.85 0.16 var(--hue) / .55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--ink);font-family:'JetBrains Mono',ui-monospace,monospace;overflow:hidden;height:100%}
body{
  background: radial-gradient(120% 90% at 50% 55%, oklch(0.20 0.06 var(--hue) / .35) 0%, #06070d 55%, #000 100%);
  transition: background .9s ease;
  cursor: grab;
}
body.dragging{cursor:grabbing}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

/* ghost numeral */
.numeral{
  position:fixed;inset:0;display:grid;place-items:center;z-index:0;pointer-events:none;
  font-family:'Fraunces',serif;font-weight:300;
  color: oklch(0.95 0.12 var(--hue) / .055);
  letter-spacing:-.04em;line-height:.85;
  font-size: clamp(40vmin, 64vmin, 80vmin);
  transition: color .9s ease;
  user-select:none;
  text-shadow: 0 0 80px oklch(0.85 0.16 var(--hue) / .12);
}

/* HUD */
.hud{position:fixed;z-index:10;color:var(--dim);font-size:10px;letter-spacing:.22em;text-transform:uppercase;pointer-events:none}
.hud .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--tint);margin-right:8px;vertical-align:1px;box-shadow:0 0 10px var(--tint-glow);transition:background .9s ease,box-shadow .9s ease}
.hud .ln{display:block;margin-top:4px;color:rgba(255,255,255,.35);letter-spacing:.18em}
.tl{top:24px;left:28px}
.tr{top:24px;right:28px;text-align:right}

/* composer */
.composer{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  z-index:20;display:flex;align-items:center;gap:14px;
  padding:10px 16px 10px 18px;
  background:rgba(8,10,18,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);border-radius:2px;
}
.composer label{font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.composer input{
  background:transparent;border:0;outline:0;color:var(--ink);
  font-family:'Fraunces',serif;font-weight:300;font-size:28px;letter-spacing:-.02em;
  width:9ch;text-align:center;caret-color:var(--tint);
}
.composer button{
  background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--dim);
  font-family:inherit;font-size:10px;letter-spacing:.25em;padding:6px 10px;
  text-transform:uppercase;cursor:pointer;transition:.2s;border-radius:1px;
}
.composer button:hover{color:var(--ink);border-color:var(--tint);box-shadow:0 0 16px oklch(0.85 0.16 var(--hue) / .25)}
.composer .div{width:1px;height:18px;background:rgba(255,255,255,.12)}

.classifier{
  position:fixed;top:90px;right:28px;z-index:10;
  display:flex;flex-direction:column;gap:6px;align-items:flex-end;text-align:right;
}
.tag{
  font-size:9px;letter-spacing:.3em;text-transform:uppercase;
  padding:5px 10px;border:1px solid rgba(255,255,255,.12);color:var(--dim);
  background:rgba(8,10,18,.4);backdrop-filter:blur(8px);border-radius:1px;
  transition:.25s;
}
.tag.on{color:var(--tint);border-color:var(--tint);box-shadow:0 0 14px oklch(0.85 0.16 var(--hue) / .25),inset 0 0 14px oklch(0.85 0.16 var(--hue) / .08)}
.tag.rare{
  color: oklch(0.92 0.18 90);
  border-color: oklch(0.85 0.18 90 / .8);
  box-shadow: 0 0 18px oklch(0.88 0.18 90 / .4), inset 0 0 18px oklch(0.88 0.18 90 / .15);
  background: oklch(0.20 0.06 90 / .25);
}

.lex{
  position:fixed;left:28px;bottom:24px;z-index:10;max-width:38vw;
}
.lex .head{color:rgba(255,255,255,.35);font-size:9px;letter-spacing:.4em;margin-bottom:10px;text-transform:uppercase}
.lex .factors{display:flex;flex-wrap:wrap;gap:6px 10px;font-family:'Fraunces',serif;font-weight:300}
.lex .factors span{font-size:20px;color:var(--ink);opacity:.85;letter-spacing:-.02em}
.lex .factors span.prime{color:var(--tint)}
.lex .pf{color:var(--dim);font-size:13px;margin-top:10px;letter-spacing:.04em;font-family:'Fraunces',serif}
.lex .pf b{color:var(--tint);font-weight:400}
.lex .partner{
  margin-top:14px;font-family:'Fraunces',serif;font-size:13px;color: oklch(0.92 0.18 90);
  letter-spacing:.02em;display:flex;align-items:center;gap:10px;
}
.lex .partner small{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.5);letter-spacing:.3em;text-transform:uppercase}
.lex .partner .arrow{opacity:.7}

.collatz{
  position:fixed;right:28px;bottom:24px;z-index:10;max-width:38vw;text-align:right;
}
.collatz .head{color:rgba(255,255,255,.35);font-size:9px;letter-spacing:.4em;margin-bottom:10px;text-transform:uppercase}
.collatz .seq{font-family:'Fraunces',serif;color:var(--dim);font-size:13px;letter-spacing:.02em;line-height:1.5}
.collatz .seq b{color:var(--tint);font-weight:400}
.collatz .stats{display:flex;justify-content:flex-end;gap:18px;margin-top:8px;color:var(--dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.collatz .stats span b{color:var(--ink);margin-left:6px;font-family:'Fraunces',serif;font-weight:300;font-size:14px;letter-spacing:-.01em}

.binary{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.4em;color:var(--dim);z-index:10;
  text-align:center;
}
.binary .bits{color:var(--ink)}
.binary .bits b{color:var(--tint);font-weight:500}
.binary .head{font-size:9px;letter-spacing:.4em;color:rgba(255,255,255,.35);margin-bottom:6px;text-transform:uppercase}

.hint{
  position:fixed;left:28px;top:50%;transform:translateY(-50%);
  font-size:10px;letter-spacing:.35em;color:var(--faint);text-transform:uppercase;z-index:10;
  pointer-events:none;writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg);
  opacity:.5;
}
.kbdline{
  position:fixed;right:28px;top:50%;transform:translateY(-50%);
  font-size:9px;letter-spacing:.35em;color:var(--faint);text-transform:uppercase;z-index:10;
  pointer-events:none;writing-mode:vertical-rl;
  text-align:right;line-height:2;
}
.kbdline kbd{
  display:inline-block;padding:1px 5px;border:1px solid rgba(255,255,255,.18);
  border-radius:2px;font-family:inherit;font-size:8px;margin:0 2px;color:var(--ink);
}
</style>
</head>
<body>

<div class="numeral" id="numeral">28</div>
<canvas id="c"></canvas>

<div class="composer">
  <label>n =</label>
  <input id="ninput" type="text" inputmode="numeric" value="28" autocomplete="off" />
  <div class="div"></div>
  <button id="btnRandom">random</button>
  <button id="btnToday">today</button>
  <button id="btnInc">+1</button>
  <button id="btnDec">−1</button>
  <button id="btnReset">reset view</button>
</div>

<div class="hud tl">
  <span class="dot"></span>FIELD<br/>
  <span class="ln">every number is a place</span>
</div>

<div class="hud tr">
  <span id="kindLine">composite · perfect · even</span>
  <span class="ln" id="sigmaLine">σ(n) = 56 · equals 2n</span>
</div>

<div class="classifier" id="tags"></div>

<div class="lex">
  <div class="head">factors · primes tinted</div>
  <div class="factors" id="factors"></div>
  <div class="pf" id="pf"></div>
  <div class="partner" id="partner" style="display:none"></div>
</div>

<div class="collatz">
  <div class="head">collatz orbit · 3n+1</div>
  <div class="seq" id="collatzSeq"></div>
  <div class="stats" id="collatzStats"></div>
</div>

<div class="binary">
  <div class="head">base · 2</div>
  <div class="bits" id="bits">11100</div>
</div>

<div class="hint">drag to rotate</div>
<div class="kbdline">
  <kbd>R</kbd> random &nbsp; <kbd>T</kbd> today &nbsp; <kbd>↑↓</kbd> step &nbsp; <kbd>0</kbd> reset
</div>

<script>
/* ============================================================
   FIELD v2 — 3D integer observatory
   ============================================================ */

const TAU = Math.PI * 2;
const lerp = (a,b,t) => a + (b - a) * t;
const clamp = (v,lo=0,hi=1) => Math.max(lo, Math.min(hi, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;

/* ---------- number theory ---------- */
function factorsOf(n){
  const out = [];
  for (let i = 1; i * i <= n; i++){
    if (n % i === 0){ out.push(i); if (i !== n/i) out.push(n/i); }
  }
  return out.sort((a,b)=>a-b);
}
function aliquot(n){ // sum of proper divisors
  if (n < 2) return 0;
  let s = 1;
  for (let i = 2; i*i <= n; i++){
    if (n % i === 0){ s += i; if (i !== n/i) s += n/i; }
  }
  return s;
}
function isPrime(n){
  if (n < 2) return false; if (n < 4) return true;
  if (n % 2 === 0) return false;
  for (let i = 3; i*i <= n; i += 2) if (n % i === 0) return false;
  return true;
}
function primeFactorization(n){
  const out = []; let m = n, p = 2;
  while (m > 1 && p * p <= m){
    let k = 0;
    while (m % p === 0){ m /= p; k++; }
    if (k > 0) out.push([p, k]);
    p = p === 2 ? 3 : p + 2;
  }
  if (m > 1) out.push([m, 1]);
  return out;
}
function digitSum(n){ return String(n).split('').reduce((a,b)=>a+parseInt(b||'0'),0); }
function digitRoot(n){ return n === 0 ? 0 : ((n - 1) % 9) + 1; }
function collatz(n){
  const seq = [n]; let m = n, g = 0;
  while (m !== 1 && g++ < 5000){
    m = (m % 2 === 0) ? m / 2 : 3 * m + 1;
    seq.push(m);
  }
  return seq;
}
function isSquare(n){ const r = Math.round(Math.sqrt(n)); return r*r === n ? r : 0; }
function isTriangularK(n){
  const k = (-1 + Math.sqrt(1 + 8 * n)) / 2;
  return Math.abs(Math.round(k) - k) < 1e-9 ? Math.round(k) : 0;
}
function isPentagonalK(n){
  const k = (1 + Math.sqrt(1 + 24*n)) / 6;
  return Math.abs(Math.round(k) - k) < 1e-9 ? Math.round(k) : 0;
}
function isHexagonalK(n){
  const k = (1 + Math.sqrt(1 + 8*n)) / 4;
  return Math.abs(Math.round(k) - k) < 1e-9 ? Math.round(k) : 0;
}
const FIBS = (() => { const f=[1,2]; while (f[f.length-1] < 1e7) f.push(f[f.length-1]+f[f.length-2]); return f; })();
function isFibonacci(n){ return FIBS.includes(n); }
function amicablePartner(n){
  if (n < 2) return 0;
  const m = aliquot(n);
  if (m <= 1 || m === n) return 0;
  if (aliquot(m) === n) return m;
  return 0;
}

function analyze(n){
  n = Math.max(1, Math.floor(n));
  const factors = factorsOf(n);
  const sigma = factors.reduce((a,b)=>a+b,0);
  const aliq = sigma - n;
  const ds = digitSum(n);
  const dr = digitRoot(n);
  const pf = primeFactorization(n);
  const seq = collatz(n);
  const prime = isPrime(n);
  const triK = isTriangularK(n);
  const hexK = isHexagonalK(n);
  const sqrtK = isSquare(n);
  const pentK = isPentagonalK(n);
  const partner = amicablePartner(n);

  return {
    n, factors, sigma, aliquot: aliq,
    digitSum: ds, digitRoot: dr, primeFactors: pf,
    collatz: seq, collatzLen: seq.length - 1, collatzMax: Math.max(...seq),
    isPrime: prime, isComposite: !prime && n > 1,
    isEven: n % 2 === 0, isOdd: n % 2 !== 0,
    isPerfect: aliq === n && n > 1,
    isAbundant: aliq > n,
    isDeficient: aliq < n && n > 1,
    isSquare: !!sqrtK, sqrtK,
    isTriangular: !!triK, triK,
    isHexagonal: !!hexK, hexK,
    isPentagonal: !!pentK, pentK,
    isFibonacci: isFibonacci(n),
    isHarshad: n > 0 && n % ds === 0,
    binary: n.toString(2),
    isPowerOfTwo: (n > 0) && ((n & (n - 1)) === 0),
    amicable: partner,
  };
}

/* ============================================================
   3D Camera + projection
   ============================================================ */
const cam = {
  yaw: 0, pitch: 0.42,
  tYaw: 0, tPitch: 0.42,
  vYaw: 0, vPitch: 0,
  auto: true,
  autoSpeed: 0.00015,
  lastInteract: 0,
};

function project(x, y, z){
  // yaw around Y
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const x1 = x * cy - z * sy;
  const z1 = x * sy + z * cy;
  const y1 = y;
  // pitch around X
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const y2 = y1 * cp + z1 * sp;
  const z2 = -y1 * sp + z1 * cp;
  // perspective
  const D = 800;
  const focal = 700;
  const dist = D + z2;
  if (dist < 40){ return { x:0, y:0, s:0, depth:dist, ok:false }; }
  const s = focal / dist;
  return { x: x1 * s, y: -y2 * s, s, depth: dist, ok: true };
}

/* ============================================================
   Arrangement — 3D positions
   ============================================================ */
function arrangePositions(p, R){
  const N = Math.min(p.n, 360);
  const pts = [];
  let mode;

  if (p.isPrime) mode = 'ring';
  else if (p.isPerfect && p.triK) mode = 'triangle';
  else if (p.isFibonacci && p.n > 5) mode = 'phyllotaxis';
  else if (p.isSquare) mode = 'square';
  else if (p.isTriangular) mode = 'triangle';
  else if (p.isHexagonal) mode = 'hex';
  else if (p.primeFactors.length === 1 && p.primeFactors[0][1] >= 2) mode = 'stacked-rings';
  else if (p.factors.length >= 6) mode = 'sphere';
  else mode = 'shells';

  if (mode === 'ring'){
    // ring lying on the floor (XZ plane)
    const flat = p.n > 60;
    for (let i = 0; i < N; i++){
      const a = (i / N) * TAU;
      if (flat){
        pts.push({x: Math.cos(a)*R, y: 0, z: Math.sin(a)*R, role: 'unit'});
      } else {
        // tilted ring — more visible volume
        pts.push({x: Math.cos(a)*R, y: Math.sin(a)*R*0.15, z: Math.sin(a)*R*0.95, role: 'unit'});
      }
    }
  }
  else if (mode === 'square'){
    const k = p.sqrtK || Math.round(Math.sqrt(N));
    const step = (R * 1.7) / (k - 1 || 1);
    for (let r = 0; r < k && pts.length < N; r++){
      for (let c = 0; c < k && pts.length < N; c++){
        const x = (c - (k-1)/2) * step;
        const z = (r - (k-1)/2) * step;
        pts.push({x, y: 0, z, role: 'unit'});
      }
    }
  }
  else if (mode === 'triangle'){
    const k = p.triK || Math.round((-1 + Math.sqrt(1+8*N))/2);
    const step = (R * 1.85) / k;
    let placed = 0;
    for (let row = 0; row < k && placed < N; row++){
      const items = row + 1;
      const zz = (row - (k-1)/2) * step * 0.95;
      for (let c = 0; c < items && placed < N; c++){
        const xx = (c - row/2) * step;
        pts.push({x: xx, y: 0, z: zz, role: 'unit'});
        placed++;
      }
    }
  }
  else if (mode === 'hex'){
    pts.push({x:0,y:0,z:0,role:'unit'});
    let ring = 1, placed = 1;
    const step = R / 7;
    while (placed < N){
      const count = 6 * ring;
      for (let i = 0; i < count && placed < N; i++){
        const a = (i / count) * TAU + ring * 0.1;
        pts.push({x: Math.cos(a)*step*ring, y: 0, z: Math.sin(a)*step*ring, role:'unit'});
        placed++;
      }
      ring++;
    }
  }
  else if (mode === 'phyllotaxis'){
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++){
      const t = i / N;
      const r = R * 0.95 * Math.sqrt(t);
      const a = i * golden;
      pts.push({x: Math.cos(a)*r, y: 0, z: Math.sin(a)*r, role: 'seed'});
    }
  }
  else if (mode === 'stacked-rings'){
    // for p^k: k levels, each with p per
    const [p0, k] = p.primeFactors[0];
    const perLevel = p0;
    const levels = Math.min(k, 6);
    const totalIdeal = perLevel * levels;
    const target = Math.min(N, totalIdeal);
    const step = R * 1.4;
    const ringR = R * 0.6;
    let placed = 0;
    for (let lvl = 0; lvl < levels && placed < target; lvl++){
      const yy = (lvl - (levels-1)/2) * (step / Math.max(1,levels));
      for (let i = 0; i < perLevel && placed < target; i++){
        const a = (i / perLevel) * TAU + lvl * 0.25;
        pts.push({x: Math.cos(a)*ringR, y: yy, z: Math.sin(a)*ringR, role:'unit'});
        placed++;
      }
    }
    // fill any leftover on outer sphere
    while (pts.length < N){
      const i = pts.length;
      const phi = Math.acos(1 - 2*(i+0.5)/N);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      pts.push({
        x: R * Math.sin(phi) * Math.cos(theta),
        y: R * Math.cos(phi) * 0.7,
        z: R * Math.sin(phi) * Math.sin(theta),
        role: 'unit',
      });
    }
  }
  else if (mode === 'sphere'){
    // fibonacci sphere
    for (let i = 0; i < N; i++){
      const phi = Math.acos(1 - 2*(i+0.5)/N);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;
      pts.push({
        x: R * Math.sin(phi) * Math.cos(theta),
        y: R * Math.cos(phi),
        z: R * Math.sin(phi) * Math.sin(theta),
        role: 'unit',
      });
    }
  }
  else { // shells (nested rings on different tilted planes)
    const shells = Math.max(2, Math.min(5, p.factors.length));
    const ringSizes = [];
    let total = 0;
    for (let s = 0; s < shells; s++){ ringSizes.push(s*2 + 3); total += ringSizes[s]; }
    const ringCounts = ringSizes.map(v => Math.max(1, Math.round(v / total * N)));
    let diff = N - ringCounts.reduce((a,b)=>a+b,0);
    ringCounts[ringCounts.length-1] += diff;

    for (let s = 0; s < shells; s++){
      const cnt = ringCounts[s];
      const r = lerp(R*0.25, R, s / Math.max(1, shells - 1));
      const tilt = (s - (shells-1)/2) * 0.5;   // each shell on different plane
      const phase = (s % 2) * Math.PI / cnt;
      const ct = Math.cos(tilt), st = Math.sin(tilt);
      for (let i = 0; i < cnt; i++){
        const a = (i / cnt) * TAU + phase;
        // ring in tilted plane
        const lx = Math.cos(a) * r;
        const ly = 0;
        const lz = Math.sin(a) * r;
        // rotate by tilt around Z so different shells angle
        const x = lx * ct - ly * st;
        const y = lx * st + ly * ct;
        const z = lz;
        pts.push({x, y, z, role: 'unit'});
      }
    }
  }

  return { points: pts, mode };
}

/* ============================================================
   State
   ============================================================ */
const cnv = document.getElementById('c');
const ctx = cnv.getContext('2d');
let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  cnv.width = W * DPR; cnv.height = H * DPR;
  cnv.style.width = W + 'px'; cnv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

let current = null;
let arrangement = null;
let prevPoints = null;
let appearT = 0;
let lastT = performance.now();

let dust = [];
function buildDust(p){
  const count = Math.min(140, 30 + p.factors.length * 14);
  dust = [];
  for (let i = 0; i < count; i++){
    dust.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * 0.25, vy: (Math.random() - .5) * 0.25,
      r: Math.random() * 1.4 + 0.3, a: Math.random() * 0.5 + 0.1,
    });
  }
}

function setHue(dr){
  const hues = [0, 25, 55, 90, 135, 170, 215, 255, 290, 325];
  document.documentElement.style.setProperty('--hue', hues[dr]);
}
function cssHue(){
  return getComputedStyle(document.documentElement).getPropertyValue('--hue').trim() || '60';
}

/* ---------- annotations ---------- */
function renderAnnotations(p){
  document.getElementById('numeral').textContent = p.n;
  document.getElementById('ninput').value = p.n;
  setHue(p.digitRoot);

  const kindParts = [];
  if (p.isPrime) kindParts.push('prime');
  else if (p.n === 1) kindParts.push('unit');
  else kindParts.push('composite');
  if (p.isPerfect) kindParts.push('perfect');
  else if (p.isAbundant) kindParts.push('abundant');
  else if (p.isDeficient) kindParts.push('deficient');
  kindParts.push(p.isEven ? 'even' : 'odd');
  document.getElementById('kindLine').textContent = kindParts.join(' · ');
  document.getElementById('sigmaLine').innerHTML =
    p.n === 1 ? 'σ(1) = 1'
    : `σ(n) = ${p.sigma}` + (p.isPerfect ? ' · equals 2n' : p.isAbundant ? ` · 2n + ${p.sigma - 2*p.n}` : ` · 2n − ${2*p.n - p.sigma}`);

  const tags = [
    ['prime',       p.isPrime, false],
    ['composite',   p.isComposite, false],
    ['perfect',     p.isPerfect, true],
    ['amicable',    !!p.amicable, true],
    ['abundant',    p.isAbundant && !p.isPerfect, false],
    ['deficient',   p.isDeficient, false],
    [p.isEven ? 'even' : 'odd', true, false],
    ['square',      p.isSquare && p.n > 1, false],
    ['triangular',  p.isTriangular && p.n > 1, false],
    ['hexagonal',   p.isHexagonal && p.n > 1, false],
    ['pentagonal',  p.isPentagonal && p.n > 1 && !p.isHexagonal, false],
    ['fibonacci',   p.isFibonacci && p.n > 1, true],
    ['harshad',     p.isHarshad && p.n > 1, false],
    ['power of 2',  p.isPowerOfTwo && p.n > 1, false],
  ];
  document.getElementById('tags').innerHTML = tags
    .filter(t => t[1])
    .map(t => `<div class="tag ${t[2] ? 'rare' : 'on'}">${t[0]}</div>`)
    .join('');

  document.getElementById('factors').innerHTML = p.factors.map(f =>
    `<span class="${isPrime(f) ? 'prime' : ''}">${f}</span>`
  ).join('');

  const pfEl = document.getElementById('pf');
  if (p.n === 1) pfEl.innerHTML = '1 · unit';
  else if (p.isPrime) pfEl.innerHTML = `${p.n} · <b>prime</b>`;
  else pfEl.innerHTML = p.primeFactors.map(([f,k]) =>
    k === 1 ? `<b>${f}</b>` : `<b>${f}</b><sup style="font-size:.7em">${k}</sup>`
  ).join(' · ');

  const partnerEl = document.getElementById('partner');
  if (p.amicable){
    partnerEl.style.display = 'flex';
    partnerEl.innerHTML = `<small>amicable</small> ${p.n} <span class="arrow">↔</span> ${p.amicable}`;
  } else {
    partnerEl.style.display = 'none';
  }

  const seqEl = document.getElementById('collatzSeq');
  const seq = p.collatz;
  if (seq.length <= 18){
    seqEl.innerHTML = seq.map((v,i)=> i === 0 || i === seq.length-1 ? `<b>${v}</b>` : v).join(' → ');
  } else {
    const head = seq.slice(0,4);
    const tail = seq.slice(-4);
    seqEl.innerHTML = `<b>${head[0]}</b> → ${head.slice(1).join(' → ')} → … → ${tail.slice(0,-1).join(' → ')} → <b>${tail[tail.length-1]}</b>`;
  }
  document.getElementById('collatzStats').innerHTML =
    `<span>steps <b>${p.collatzLen}</b></span><span>peak <b>${p.collatzMax}</b></span>`;

  const bits = p.binary;
  document.getElementById('bits').innerHTML = bits.split('').map(b => b === '1' ? `<b>1</b>` : '0').join('');
}

/* ---------- setNumber + morph ---------- */
function setNumber(n){
  n = Math.max(1, Math.min(9999, Math.floor(n)));
  const p = analyze(n);
  const oldArrangement = arrangement;
  current = p;
  const R = Math.min(W, H) * 0.30;
  arrangement = arrangePositions(p, R);

  if (oldArrangement){
    const oldPts = oldArrangement.points;
    prevPoints = arrangement.points.map((pt, i) => {
      const src = oldPts[i % oldPts.length] || {x:0,y:0,z:0};
      return { x: src.x, y: src.y, z: src.z };
    });
  } else {
    prevPoints = arrangement.points.map(() => ({x:0,y:0,z:0}));
  }
  appearT = 0;
  buildDust(p);
  renderAnnotations(p);
}

/* ============================================================
   Drawing
   ============================================================ */

function drawCollatz3D(p, now, alpha){
  const seq = p.collatz;
  if (seq.length < 2) return;
  const R = Math.min(W,H) * 0.34;
  const peak = Math.max(...seq);

  // compute 3D points along the path
  const path = [];
  let ang = -Math.PI/2;
  for (let i = 0; i < seq.length; i++){
    if (i > 0){
      const v = seq[i], prev = seq[i-1];
      const op = v < prev ? -0.32 : 0.55;
      ang += op;
    }
    const t = i / Math.max(1, seq.length - 1);
    const r = lerp(R * 1.2, R * 0.08, easeOut(t));
    const valNorm = Math.log(seq[i] + 1) / Math.log(peak + 1);
    const yy = (valNorm - 0.3) * R * 1.1;        // height = value
    const x = Math.cos(ang + now * 0.00004) * r;
    const z = Math.sin(ang + now * 0.00004) * r;
    path.push({x, y: yy, z, val: seq[i], t});
  }

  // draw segments back-to-front
  const segments = [];
  for (let i = 0; i < path.length - 1; i++){
    const a = project(path[i].x, path[i].y, path[i].z);
    const b = project(path[i+1].x, path[i+1].y, path[i+1].z);
    if (!a.ok || !b.ok) continue;
    segments.push({a, b, depth: (a.depth + b.depth)/2, t: path[i].t});
  }
  segments.sort((u,v) => v.depth - u.depth);

  const hue = cssHue();
  for (const s of segments){
    const aa = alpha * (0.18 + s.t * 0.4);
    ctx.strokeStyle = `oklch(0.78 0.12 ${hue} / ${aa.toFixed(3)})`;
    ctx.lineWidth = lerp(0.6, 1.6, s.t);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.a.x, s.a.y);
    ctx.lineTo(s.b.x, s.b.y);
    ctx.stroke();
  }

  // small nodes at each step
  const nodes = path.map(pt => ({...project(pt.x, pt.y, pt.z), t: pt.t, val: pt.val}))
                     .filter(n => n.ok);
  nodes.sort((u,v) => v.depth - u.depth);
  for (const node of nodes){
    const r = 1.4 * node.s * (0.4 + node.t * 0.8);
    ctx.beginPath();
    ctx.arc(node.x, node.y, Math.max(0.5, r), 0, TAU);
    ctx.fillStyle = `oklch(0.85 0.14 ${hue} / ${(alpha * (0.35 + node.t * 0.5)).toFixed(3)})`;
    ctx.fill();
  }
}

function drawConnections3D(p, pts3D, time, alpha){
  const len = pts3D.length;
  if (len < 2) return;
  const divisors = p.factors.filter(d => d > 1 && d < len);
  if (divisors.length === 0) return;

  const picks = [];
  if (divisors.length <= 4) picks.push(...divisors);
  else {
    picks.push(divisors[0], divisors[1]);
    picks.push(divisors[Math.floor(divisors.length/2)]);
    picks.push(divisors[divisors.length - 2]);
  }

  const hue = cssHue();
  const segments = [];
  picks.forEach((d, i) => {
    const baseA = alpha * (i === 0 ? 0.4 : 0.16) * (1 - i*0.04);
    const lineW = i === 0 ? 0.55 : 0.32;
    const phase = (time * 0.00006 + i * 0.13);
    for (let j = 0; j < len; j++){
      const A = pts3D[j], B = pts3D[(j + d) % len];
      const a = project(A.x, A.y, A.z);
      const b = project(B.x, B.y, B.z);
      if (!a.ok || !b.ok) continue;
      const fade = (Math.sin((j / len) * TAU * 2 + phase * TAU) + 1) / 2;
      const aa = baseA * (0.4 + fade * 0.6);
      segments.push({a, b, depth: (a.depth+b.depth)/2, lineW, aa});
    }
  });
  segments.sort((u,v) => v.depth - u.depth);
  for (const s of segments){
    ctx.strokeStyle = `oklch(0.85 0.14 ${hue} / ${s.aa.toFixed(3)})`;
    ctx.lineWidth = s.lineW;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.a.x, s.a.y);
    ctx.lineTo(s.b.x, s.b.y);
    ctx.stroke();
  }
}

function drawHarshadFlow(p, time){
  if (!p.isHarshad || p.n <= 1) return;
  // small orbiting particle along an inner ring
  const hue = cssHue();
  const R = Math.min(W, H) * 0.07;
  const speed = 0.0006;
  const count = Math.min(p.digitSum, 12);
  for (let i = 0; i < count; i++){
    const a = (i / count) * TAU + time * speed;
    const x = Math.cos(a) * R;
    const y = Math.sin(time * 0.0007 + i) * R * 0.15;
    const z = Math.sin(a) * R;
    const pr = project(x, y, z);
    if (!pr.ok) continue;
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, 1.4 * pr.s, 0, TAU);
    ctx.fillStyle = `oklch(0.92 0.12 ${hue} / 0.6)`;
    ctx.shadowColor = `oklch(0.85 0.18 ${hue} / 0.7)`;
    ctx.shadowBlur = 8;
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawAmicableCompanion(p, now){
  if (!p.amicable) return;
  const hue = cssHue();
  // companion orbits to the right
  const R = Math.min(W, H) * 0.30;
  const offX = R * 2.4;
  // pulse rhythm syncs both spheres
  const pulse = (Math.sin(now * 0.0012) + 1) / 2;

  // light beam: a series of dots traveling between
  const beamN = 14;
  const beamPhase = (now * 0.0008) % 1;
  for (let i = 0; i < beamN; i++){
    const tt = ((i / beamN) + beamPhase) % 1;
    const xb = lerp(R * 0.2, offX - R * 0.5, tt);
    const yb = Math.sin(tt * Math.PI * 3 + now * 0.001) * 8;
    const zb = 0;
    const pr = project(xb, yb, zb);
    if (!pr.ok) continue;
    const op = Math.sin(tt * Math.PI) * 0.8;
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, 2 * pr.s, 0, TAU);
    ctx.fillStyle = `oklch(0.92 0.18 90 / ${op.toFixed(3)})`;
    ctx.shadowColor = `oklch(0.85 0.22 90 / 0.8)`;
    ctx.shadowBlur = 10;
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // companion sphere — small fibonacci sphere preview
  const companionN = Math.min(40, p.amicable);
  const compR = R * 0.35;
  const pts = [];
  for (let i = 0; i < companionN; i++){
    const phi = Math.acos(1 - 2*(i+0.5)/companionN);
    const theta = Math.PI * (1 + Math.sqrt(5)) * i + now * 0.0003;
    const x = Math.sin(phi) * Math.cos(theta) * compR + offX;
    const y = Math.cos(phi) * compR;
    const z = Math.sin(phi) * Math.sin(theta) * compR;
    pts.push(project(x, y, z));
  }
  pts.sort((u,v) => v.depth - u.depth);
  for (const pr of pts){
    if (!pr.ok) continue;
    const r = 1.6 * pr.s;
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, r * 3, 0, TAU);
    ctx.fillStyle = `oklch(0.85 0.18 90 / 0.06)`;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, r, 0, TAU);
    ctx.fillStyle = `oklch(0.90 0.16 90 / ${(0.7 + pulse*0.2).toFixed(3)})`;
    ctx.shadowColor = `oklch(0.85 0.20 90 / 0.6)`;
    ctx.shadowBlur = 6;
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // label "284" or whatever — projected near companion sphere
  const lbl = project(offX, -compR * 1.4, 0);
  if (lbl.ok){
    ctx.fillStyle = `oklch(0.92 0.18 90 / 0.75)`;
    ctx.font = `${18 * lbl.s}px Fraunces, serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(p.amicable, lbl.x, lbl.y);
  }
}

function drawPerfectHalo(p, now){
  if (!p.isPerfect) return;
  const hue = cssHue();
  const breath = (Math.sin(now * 0.0008) + 1) / 2;
  const R = Math.min(W, H) * 0.32;
  const center = project(0, 0, 0);
  // golden ring (in 3D) on the floor
  const segs = 96;
  ctx.beginPath();
  for (let i = 0; i <= segs; i++){
    const a = (i / segs) * TAU;
    const pr = project(Math.cos(a) * R * 1.15, 0, Math.sin(a) * R * 1.15);
    if (!pr.ok) continue;
    if (i === 0) ctx.moveTo(pr.x, pr.y); else ctx.lineTo(pr.x, pr.y);
  }
  ctx.strokeStyle = `oklch(0.90 0.16 90 / ${(0.20 + breath*0.18).toFixed(3)})`;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // soft radial glow
  if (center.ok){
    const grad = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, R * 1.4);
    grad.addColorStop(0, `oklch(0.90 0.16 90 / ${(0.12 + breath*0.05).toFixed(3)})`);
    grad.addColorStop(1, `oklch(0.85 0.18 90 / 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(center.x, center.y, R * 1.4, 0, TAU);
    ctx.fill();
  }
}

function drawFibonacciOverlay(p, now){
  if (!p.isFibonacci || p.n < 5) return;
  const hue = cssHue();
  const R = Math.min(W, H) * 0.04;
  const turns = 3;
  const steps = 140;
  const segs = [];
  for (let i = 0; i <= steps; i++){
    const tt = i / steps;
    const a = tt * turns * TAU + now * 0.0001;
    const rr = R * Math.pow(1.618, tt * 4);
    const pr = project(Math.cos(a) * rr, 0, Math.sin(a) * rr);
    segs.push(pr);
  }
  ctx.beginPath();
  for (let i = 0; i < segs.length; i++){
    if (!segs[i].ok) continue;
    if (i === 0) ctx.moveTo(segs[i].x, segs[i].y);
    else ctx.lineTo(segs[i].x, segs[i].y);
  }
  ctx.strokeStyle = `oklch(0.88 0.14 ${hue} / 0.30)`;
  ctx.lineWidth = 0.9;
  ctx.stroke();
}

function drawBinaryRing(p, now, alpha){
  const bits = p.binary;
  const count = bits.length;
  const R = Math.min(W, H) * 0.43;
  for (let i = 0; i < count; i++){
    const bit = bits[i];
    const a = (i / count) * TAU - Math.PI/2;
    const x = Math.cos(a) * R + W/2;
    const y = Math.sin(a) * R + H/2;
    if (bit === '1'){
      ctx.beginPath();
      ctx.arc(x, y, 2.4, 0, TAU);
      ctx.fillStyle = `oklch(0.88 0.16 ${cssHue()} / ${alpha.toFixed(3)})`;
      ctx.shadowColor = `oklch(0.85 0.16 ${cssHue()} / 0.6)`;
      ctx.shadowBlur = 10;
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(x, y, 1, 0, TAU);
      ctx.fillStyle = `rgba(255,255,255,${(alpha*0.18).toFixed(3)})`;
      ctx.shadowBlur = 0;
      ctx.fill();
    }
  }
  ctx.shadowBlur = 0;
}

/* ============================================================
   Main frame
   ============================================================ */
function frame(now){
  const dt = Math.min(60, now - lastT);
  lastT = now;

  // camera smoothing + auto-rotate
  if (cam.auto && (now - cam.lastInteract) > 2200){
    cam.tYaw += cam.autoSpeed * dt;
  }
  cam.yaw   += (cam.tYaw   - cam.yaw)   * 0.10;
  cam.pitch += (cam.tPitch - cam.pitch) * 0.10;

  appearT = Math.min(1, appearT + dt / 900);
  const morph = easeOut(appearT);

  ctx.clearRect(0, 0, W, H);

  if (!current){ requestAnimationFrame(frame); return; }
  const p = current;

  // === binary ring (screen space, not 3D) ===
  drawBinaryRing(p, now, 0.75);

  // === dust (screen space) ===
  for (const d of dust){
    d.x += d.vx; d.y += d.vy;
    if (d.x < 0) d.x = W; else if (d.x > W) d.x = 0;
    if (d.y < 0) d.y = H; else if (d.y > H) d.y = 0;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, TAU);
    ctx.fillStyle = `rgba(255,255,255,${(d.a * 0.5).toFixed(3)})`;
    ctx.fill();
  }

  // === origin transform for 3D scene ===
  ctx.save();
  ctx.translate(W/2, H/2);

  // ===== global breathing =====
  const baseFreq = p.isPerfect ? 0.0007 : p.isEven ? 0.0010 : 0.0013;
  const freqMod = p.isAbundant ? 1.25 : p.isDeficient ? 0.75 : 1;
  const breath = p.isOdd
    ? (Math.sin(now * baseFreq * freqMod) * 0.5 + Math.sin(now * baseFreq * freqMod * 2.3) * 0.5) * 0.5 + 0.5
    : (Math.sin(now * baseFreq * freqMod) + 1) / 2;

  // ===== perfect-number halo (drawn first, behind) =====
  drawPerfectHalo(p, now);

  // ===== collatz 3D trail =====
  drawCollatz3D(p, now, 0.75);

  // ===== fibonacci spiral overlay =====
  drawFibonacciOverlay(p, now);

  // ===== particles =====
  const pts = arrangement.points;
  const breathScale = 1 + breath * (p.isPerfect ? 0.025 : p.isAbundant ? 0.04 : 0.018);

  // interpolated 3D positions + project
  const projected = [];
  for (let i = 0; i < pts.length; i++){
    const pt = pts[i];
    const src = prevPoints[i] || {x:0,y:0,z:0};
    const x = lerp(src.x, pt.x, morph) * breathScale;
    const y = lerp(src.y, pt.y, morph) * breathScale;
    const z = lerp(src.z, pt.z, morph) * breathScale;
    projected.push({ world: {x,y,z}, proj: project(x,y,z), idx: i });
  }

  // connections (drawn behind particles)
  if (morph > 0.5){
    const worldPts = projected.map(it => it.world);
    drawConnections3D(p, worldPts, now, (morph - 0.5) / 0.5);
  }

  // harshad inner flow
  drawHarshadFlow(p, now);

  // depth-sort particles back to front
  projected.sort((u,v) => v.proj.depth - u.proj.depth);

  const hue = cssHue();
  const baseR = p.isPrime ? 3.2 : 2.5;
  for (const it of projected){
    const pr = it.proj;
    if (!pr.ok) continue;
    const localBreath = (Math.sin(now * baseFreq * freqMod + it.idx * 0.12) + 1) / 2;
    const r = (baseR + localBreath * (p.isPerfect ? 1.6 : 0.8)) * pr.s;
    const label = it.idx + 1;
    const isPrimePos = isPrime(label);

    // glow
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, r * 3.4, 0, TAU);
    ctx.fillStyle = `oklch(0.85 0.14 ${hue} / ${(0.045 + localBreath*0.05).toFixed(3)})`;
    ctx.fill();

    // core
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, Math.max(0.4, r), 0, TAU);
    if (isPrimePos && !p.isPrime){
      ctx.fillStyle = `oklch(0.95 0.16 ${hue} / 0.95)`;
    } else {
      ctx.fillStyle = `oklch(0.88 0.10 ${hue} / 0.85)`;
    }
    ctx.shadowColor = `oklch(0.85 0.18 ${hue} / 0.7)`;
    ctx.shadowBlur = isPrimePos ? 14 : 6;
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // amicable companion (drawn last, after main scene)
  drawAmicableCompanion(p, now);

  ctx.restore();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================================================
   Input wiring
   ============================================================ */
const inp = document.getElementById('ninput');
inp.addEventListener('input', () => {
  const v = parseInt(inp.value.replace(/[^0-9]/g, ''), 10);
  if (!isNaN(v) && v > 0) setNumber(v);
});
inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
document.getElementById('btnRandom').addEventListener('click', () => {
  const r = Math.floor(Math.random() * Math.random() * 999) + 1;
  setNumber(r);
});
document.getElementById('btnToday').addEventListener('click', () => {
  setNumber(new Date().getDate());
});
document.getElementById('btnInc').addEventListener('click', () => setNumber(current.n + 1));
document.getElementById('btnDec').addEventListener('click', () => setNumber(Math.max(1, current.n - 1)));
document.getElementById('btnReset').addEventListener('click', () => {
  cam.tYaw = 0; cam.tPitch = 0.42; cam.lastInteract = 0; cam.auto = true;
});

window.addEventListener('keydown', e => {
  if (document.activeElement === inp) return;
  if (e.key === 'r' || e.key === 'R') document.getElementById('btnRandom').click();
  else if (e.key === 't' || e.key === 'T') document.getElementById('btnToday').click();
  else if (e.key === '0') document.getElementById('btnReset').click();
  else if (e.key === 'ArrowUp') { setNumber(current.n + 1); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { setNumber(Math.max(1, current.n - 1)); e.preventDefault(); }
});

/* ---------- mouse / touch rotation ---------- */
let dragging = false, lastX = 0, lastY = 0;
function startDrag(x, y){
  dragging = true; lastX = x; lastY = y;
  cam.lastInteract = performance.now();
  document.body.classList.add('dragging');
}
function moveDrag(x, y){
  if (!dragging) return;
  const dx = x - lastX, dy = y - lastY;
  lastX = x; lastY = y;
  cam.tYaw   += dx * 0.005;
  cam.tPitch += dy * 0.005;
  cam.tPitch = clamp(cam.tPitch, -0.5, 1.3);
  cam.lastInteract = performance.now();
  cam.vYaw = dx * 0.005;
  cam.vPitch = dy * 0.005;
}
function endDrag(){
  dragging = false;
  document.body.classList.remove('dragging');
  // momentum
  let mY = cam.vYaw, mP = cam.vPitch;
  function decay(){
    if (Math.abs(mY) < 0.0005 && Math.abs(mP) < 0.0005) return;
    cam.tYaw   += mY;
    cam.tPitch = clamp(cam.tPitch + mP, -0.5, 1.3);
    mY *= 0.93; mP *= 0.93;
    cam.lastInteract = performance.now();
    requestAnimationFrame(decay);
  }
  decay();
}

cnv.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
window.addEventListener('mouseup', endDrag);
cnv.addEventListener('touchstart', e => {
  if (e.touches.length === 1){ startDrag(e.touches[0].clientX, e.touches[0].clientY); }
}, {passive: true});

  if (e.touches.length === 1){ moveDrag(e.touches[0].clientX, e.touches[0].clientY); }
}, {passive: true});
window.addEventListener('touchend', endDrag);
