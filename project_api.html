<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API · SDK — 後端小作品 | WUYAN's ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cinzel:wght@400&family=Instrument+Serif:ital@0;1&family=Noto+Serif+TC:wght@200;300&family=Noto+Sans+TC:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Cubic';src:url('assets/fomts/Cubic.ttf') format('truetype');font-weight:normal;font-display:swap}
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;cursor:none!important}
html,body{width:100%;min-height:100vh;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}

/* ── CSS Variables ── */
:root{
  --bg:#04020e;
  --bg-deep:rgba(2,0,10,1);
  --bg-card:rgba(14,7,40,0.88);
  --bg-card-2:rgba(20,10,52,0.88);
  --line:rgba(167,139,250,0.22);
  --line-soft:rgba(167,139,250,0.12);
  --ink:rgba(246,242,255,0.95);
  --ink-mute:rgba(198,186,222,0.78);
  --ink-dim:rgba(138,122,176,0.56);
  --violet:rgba(196,181,253,0.9);
  --violet-deep:rgba(110,68,196,0.9);
  --powder:rgba(165,215,255,0.95);
  --powder-deep:rgba(118,188,240,0.9);
  --magic:rgba(240,165,205,0.95);
  --gold:#d4a84e;
  --r-sm:8px;--r:14px;--r-lg:22px;
  --display:'Instrument Serif','Noto Serif TC',Georgia,serif;
  --sans:'Noto Sans TC','Courier New',system-ui,sans-serif;
  --body:'Courier New',monospace;
  --mono:'JetBrains Mono','Courier New',monospace;
}

/* ── Body ── */
body{
  background:#04020e;
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.6;
}

/* ── Page background image (fixed, behind everything) ── */
#page-bg{position:fixed;inset:0;z-index:0;background-image:url('assets/project_api/hero-reference.webp');background-size:contain;background-repeat:no-repeat;background-position:center top;filter:saturate(1.1) brightness(.62);pointer-events:none}
#page-bg::after{content:'';position:absolute;inset:0;background:rgba(4,2,14,.42)}

/* ── Cursor ── */
#cursor-dot{position:fixed;width:6px;height:6px;border-radius:50%;background:#fff;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(255,180,220,.9)}
#cursor-ring{position:fixed;width:24px;height:24px;border-radius:50%;border:1px solid rgba(240,160,200,.4);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s}
body.hov #cursor-ring{width:40px;height:40px;border-color:rgba(240,160,205,.75);box-shadow:0 0 12px rgba(220,120,175,.22)}

/* ── Stars ── */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite var(--dl,0s)}
@keyframes twinkle{0%,100%{opacity:var(--a,.3)}50%{opacity:1}}

/* ── Sidebar ── */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;display:flex;flex-direction:column;border-right:1px solid rgba(167,139,250,.22);height:100vh;overflow:hidden;z-index:50;background:linear-gradient(to bottom,rgba(12,5,32,.80) 0%,rgba(14,6,40,.72) 48%,rgba(28,10,55,.55) 70%,rgba(28,10,55,.28) 88%,rgba(28,10,55,.06) 100%);backdrop-filter:blur(20px);transform:translateX(calc(-100% + 16px));transition:transform .38s cubic-bezier(.25,.46,.45,.94),box-shadow .38s}
#sidebar:hover{transform:translateX(0);box-shadow:4px 0 44px rgba(0,0,0,.75),0 0 0 1px rgba(167,139,250,.1)}
#sidebar::before{content:'';position:absolute;right:0;top:22%;bottom:22%;width:2px;background:linear-gradient(to bottom,transparent,rgba(167,139,250,.72) 40%,rgba(165,215,255,.58) 60%,transparent);border-radius:1px;transition:opacity .25s;pointer-events:none;z-index:2}
#sidebar:hover::before{opacity:0}
#sidebar::after{content:'';position:absolute;left:36px;top:80px;bottom:80px;width:1.5px;background:linear-gradient(to bottom,transparent,rgba(167,139,250,.5) 20%,rgba(196,181,253,.85) 50%,rgba(167,139,250,.5) 80%,transparent);box-shadow:0 0 6px rgba(167,139,250,.28)}
.sb-head{padding:20px 14px 16px 18px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid rgba(167,139,250,.12);flex-shrink:0}
.sb-cat{width:34px;height:34px;border:1px solid rgba(167,139,250,.42);border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(5,10,30,.6);flex-shrink:0;box-shadow:0 0 12px rgba(167,139,250,.22)}
.sb-cat img{width:22px;height:22px;filter:invert(1) sepia(1) saturate(3) hue-rotate(245deg);opacity:.85}
.sb-info{flex:1;min-width:0}
.sb-title{font:700 12px monospace;letter-spacing:3px;color:rgba(196,181,253,.88);text-transform:uppercase}
.sb-sub{font:400 10px monospace;color:rgba(74,66,100,.85);letter-spacing:2px;margin-top:3px}
.sb-pulse{display:flex;align-items:center;gap:5px;margin-top:8px}
.sb-dot{width:5px;height:5px;border-radius:50%;background:rgba(80,255,120,.7);animation:sbpulse 2s ease-in-out infinite;box-shadow:0 0 5px rgba(80,255,120,.4)}
@keyframes sbpulse{0%,100%{opacity:.6}50%{opacity:1}}
.sb-online{font:400 10px monospace;letter-spacing:2px;color:rgba(80,255,120,.58)}
nav{flex:1;padding:10px 0;overflow-y:auto}
nav::-webkit-scrollbar{width:0}
.ni{display:flex;align-items:center;gap:9px;padding:12px 14px 12px 50px;position:relative;transition:all .28s cubic-bezier(.25,.46,.45,.94);margin-bottom:4px;text-decoration:none;color:inherit}
.ni::before{content:'';position:absolute;left:29px;top:50%;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);border:1px solid rgba(167,139,250,.4);background:transparent;transition:all .28s ease}
.ni:hover::before{border-color:rgba(196,181,253,.88);box-shadow:0 0 8px rgba(196,181,253,.5)}
.ni.act::before{background:rgba(167,139,250,.18);border-color:rgba(196,181,253,.92);box-shadow:0 0 10px rgba(196,181,253,.6)}
.ni::after{content:'';position:absolute;left:29px;top:50%;width:4px;height:4px;transform:translate(-50%,-50%);border-radius:50%;background:transparent;transition:all .28s ease;pointer-events:none}
.ni:hover::after{background:rgba(196,181,253,.82);box-shadow:0 0 5px rgba(196,181,253,.6)}
.ni.act::after{background:rgba(255,255,255,.88);box-shadow:0 0 6px rgba(196,181,253,.8)}
.ni:hover,.ni.act{background:rgba(110,55,195,.14)}
.ni:hover{transform:translateX(4px)}
.ni.act{border-right:2px solid rgba(167,139,250,.68)}
.ni-icon{width:15px;height:15px;object-fit:contain;opacity:.70;filter:brightness(0) invert(1);transition:opacity .22s;flex-shrink:0}
.ni:hover .ni-icon,.ni.act .ni-icon{opacity:.95}
.ni-text{display:flex;flex-direction:column}
.ni-en{font:400 12px monospace;letter-spacing:2px;text-transform:uppercase;color:rgba(175,150,220,.78);transition:color .22s}
.ni-zh{font:400 11px monospace;color:rgba(160,142,205,.65);letter-spacing:1px;margin-top:2px;transition:color .22s}
.ni:hover .ni-en,.ni.act .ni-en{color:rgba(232,224,255,.97)}
.ni:hover .ni-zh,.ni.act .ni-zh{color:rgba(210,200,240,.88)}
.sb-footer{padding:14px 18px 18px 22px;background:transparent;flex-shrink:0}
.sb-footer-text{font:400 10px monospace;letter-spacing:1px;color:rgba(120,90,150,.45);line-height:1.6}

/* ── Page section nav (right side dots) ── */
#page-nav{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:0}
#page-nav::before{content:'';position:absolute;right:3px;top:14px;bottom:14px;width:1px;background:linear-gradient(to bottom,transparent,rgba(167,139,250,.2) 20%,rgba(167,139,250,.2) 80%,transparent);pointer-events:none}
.pn-item{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;text-decoration:none}
.pn-label{font:400 11px monospace;letter-spacing:.15em;text-transform:uppercase;color:rgba(196,181,253,.15);transform:translateX(6px);transition:color .2s,transform .2s;white-space:nowrap;user-select:none}
.pn-item:hover .pn-label{color:rgba(196,181,253,.85);transform:translateX(0)}
.pn-item.act .pn-label{color:rgba(196,181,253,.68);transform:translateX(0)}
.pn-node{width:7px;height:7px;transform:rotate(45deg);border:1px solid rgba(167,139,250,.28);background:transparent;transition:all .25s;flex-shrink:0}
.pn-item:hover .pn-node{border-color:rgba(196,181,253,.82);background:rgba(167,139,250,.35);box-shadow:0 0 8px rgba(167,139,250,.45)}
.pn-item.act .pn-node{border-color:rgba(196,181,253,.9);background:rgba(167,139,250,.72);box-shadow:0 0 10px rgba(196,181,253,.65),0 0 22px rgba(167,139,250,.3)}

/* ── Topbar ── */
#topbar{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 40px;background:linear-gradient(180deg,rgba(4,2,14,.88) 0%,rgba(4,2,14,.52) 65%,transparent 100%);backdrop-filter:blur(14px)}
.tb-brand{font:400 14px 'Cinzel Decorative','Cinzel',serif;letter-spacing:.3em;color:rgba(240,165,205,.92)}
.topbar-crumb{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:rgba(138,122,176,.7);text-transform:uppercase;display:flex;align-items:center;gap:0}
.topbar-crumb a{color:rgba(198,186,222,.6);text-decoration:none;transition:color .2s}
.topbar-crumb a:hover{color:rgba(196,181,253,.9)}
.topbar-crumb .sep{margin:0 8px;opacity:.45}
.topbar-crumb .here{color:rgba(196,181,253,.85)}
.topbar-tag{font-family:var(--mono);font-size:10px;letter-spacing:.2em;padding:4px 12px;border:1px solid rgba(167,139,250,.3);border-radius:999px;color:rgba(196,181,253,.8);text-transform:uppercase;justify-self:end}

/* ── Shell + Page layout ── */
#shell{display:grid;grid-template-columns:1fr;min-height:100vh;position:relative;z-index:1}
.page{max-width:1240px;margin:0 auto;padding:56px 40px 120px;width:100%}

/* ── Typography ── */
.h-display{font-family:var(--display);font-weight:400;font-size:clamp(48px,7vw,96px);line-height:.95;letter-spacing:-.025em;margin:0}
.h-display em{font-style:italic;color:var(--magic);font-family:'Instrument Serif',serif}
.h-sec{font-family:var(--sans);font-weight:600;font-size:clamp(26px,3.2vw,44px);letter-spacing:-.01em;line-height:1.05;margin:0}
.h-sec em{font-family:var(--sans);font-style:normal;font-weight:500;color:var(--magic);font-size:.7em;letter-spacing:0}
.lead{font-size:16px;color:var(--ink-mute);max-width:62ch;line-height:1.7}

/* ── Common components ── */
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--powder)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--powder);box-shadow:0 0 12px var(--powder)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:11px;color:var(--ink-mute);background:rgba(14,7,40,0.5);backdrop-filter:blur(4px)}
.tag.glow{border-color:var(--powder-deep);color:var(--powder);box-shadow:inset 0 0 0 1px rgba(165,215,255,.18)}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:80px 0}

/* ── Code block ── */
.code{background:var(--bg-deep);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-family:var(--mono);font-size:13px}
.code-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(167,139,250,.1);background:rgba(8,3,24,1);font-size:11px;color:var(--ink-dim)}
.code-head .lang{font-family:var(--mono);color:var(--powder);margin-left:auto}
.code-head .file{color:var(--ink-mute)}
.code-body{padding:14px 18px;overflow:auto;max-height:480px;line-height:1.65;color:var(--ink);white-space:pre}
.code-body .kw{color:var(--magic)}
.code-body .str{color:var(--powder)}
.code-body .num{color:var(--gold)}
.code-body .com{color:var(--ink-dim);font-style:italic}
.code-body .fn{color:rgba(130,210,255,.9)}
.code-body .dec{color:var(--violet)}
.code-body .ln{display:inline-block;width:28px;color:var(--ink-dim);user-select:none}
.copy-btn{appearance:none;background:rgba(30,16,72,0.7);border:1px solid var(--line);color:var(--ink-mute);padding:4px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;border-radius:999px;cursor:pointer!important;transition:all .15s ease}
.copy-btn:hover{color:var(--ink);border-color:var(--powder-deep)}
.copy-btn.ok{color:var(--powder);border-color:var(--powder)}
.code-body::-webkit-scrollbar{height:8px;width:8px}
.code-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

/* ── Tabs ── */
.tabs{display:inline-flex;gap:6px;padding:5px;background:rgba(8,3,24,1);border:1px solid var(--line);border-radius:999px}
.tabs button{appearance:none;background:transparent;border:0;color:var(--ink-mute);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;border-radius:999px;cursor:pointer!important;transition:all .15s ease}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:linear-gradient(135deg,var(--violet-deep),var(--magic));color:white;box-shadow:0 6px 22px rgba(110,68,196,.4)}

/* ── Hero section ── */
.hero{display:grid;gap:28px;padding:24px 0 36px}
.hero-mark{width:52px;height:52px;display:grid;place-items:center;background:rgba(14,7,40,0.6);border:1px solid var(--line);border-radius:14px;filter:drop-shadow(0 0 20px rgba(240,165,205,.4))}
.hero-eyebrow{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero-crumbs{font-family:var(--mono);font-size:12px;color:var(--ink-dim);display:inline-flex;gap:8px;align-items:center}
.hero-crumbs a{color:var(--ink-mute);text-decoration:none}
.hero-crumbs a:hover{color:var(--ink)}
.hero-crumbs .sep{opacity:.45}
.hero-crumbs .here{color:var(--powder)}
.h-display .hero-zh{font-family:'Cubic',var(--sans);font-weight:normal;letter-spacing:.06em;background:linear-gradient(135deg,var(--powder),var(--magic) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-lead{font-size:18px;line-height:1.65;color:var(--ink-mute);max-width:64ch;margin:4px 0 0}
.hero-lead em{font-family:var(--display);font-style:italic;color:var(--ink);font-size:1.05em;padding:0 2px}
.hero-lead .emp{font-style:normal;font-family:var(--sans);font-weight:500;letter-spacing:0;color:var(--powder)}
.hero-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px 24px;border:1px solid var(--line);background:rgba(10,4,28,0.55);border-radius:var(--r-lg);backdrop-filter:blur(8px)}
.hero-meta-cell+.hero-meta-cell{padding-left:20px;border-left:1px solid rgba(167,139,250,.12)}
.meta-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px}
.meta-val{font-family:var(--sans);font-size:14px;color:var(--ink);letter-spacing:-.005em}
@media(max-width:760px){.hero-meta{grid-template-columns:1fr 1fr}.hero-meta-cell:nth-child(odd){padding-left:0;border-left:0}}
.hero-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hero-nav a{display:flex;align-items:baseline;gap:14px;padding:16px 18px;background:linear-gradient(180deg,rgba(22,10,58,0.65),rgba(14,6,40,0.65));border:1px solid var(--line);border-radius:var(--r-lg);text-decoration:none;color:var(--ink);font-family:var(--sans);font-weight:500;font-size:14px;transition:all .2s ease}
.hero-nav a:hover{border-color:rgba(165,215,255,.5);transform:translateY(-2px);box-shadow:0 12px 28px rgba(4,2,14,.4)}
.hero-nav .num{font-family:var(--mono);font-size:12px;color:var(--powder);letter-spacing:.1em}
@media(max-width:760px){.hero-nav{grid-template-columns:1fr}}

/* ── Project section dark backdrop ── */
.project{background:rgba(4,2,14,.58);border-radius:28px;padding:40px 44px;border:1px solid rgba(167,139,250,.08);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}

/* ── Repo link ── */
.repo-link-row{margin:8px 0 28px}
.repo-link{display:inline-flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(14,6,40,0.6);border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);font-family:var(--mono);font-size:13px;transition:all .2s ease}
.repo-link:hover{border-color:rgba(165,215,255,.5);background:rgba(22,10,58,0.7)}
.repo-mark{display:inline-grid;place-items:center;width:22px;height:22px;background:linear-gradient(135deg,var(--violet-deep),var(--magic));border-radius:50%;color:white;font-size:11px}
.repo-path{color:var(--ink)}
.repo-path b{color:var(--powder);font-weight:600}
.repo-meta{color:var(--ink-dim);font-size:11px;letter-spacing:.08em;padding-left:12px;border-left:1px solid rgba(167,139,250,.12)}
.repo-link.as-note{background:transparent;border-style:dashed;color:var(--ink-mute);cursor:default!important}
.repo-link.as-note:hover{background:transparent;border-color:var(--line)}
.repo-mark.mark-note{background:transparent;border:1px dashed var(--line);color:var(--ink-dim)}

/* ── Pipeline (Project X) ── */
.pipeline{display:flex;align-items:stretch;gap:6px;margin:8px 0 40px;flex-wrap:wrap}
.step{flex:1 1 130px;min-width:130px;padding:16px 14px;border-radius:var(--r);background:linear-gradient(180deg,rgba(22,10,58,1),rgba(14,6,40,1));border:1px solid var(--line)}
.step-num{font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.16em}
.step-en{font-family:var(--sans);font-weight:600;font-size:16px;margin-top:8px;letter-spacing:-.005em}
.step-zh{font-family:var(--sans);font-weight:500;font-size:14px;color:var(--magic);line-height:1.2;margin:4px 0 8px}
.step-note{font-size:12px;color:var(--ink-mute);line-height:1.4}
.step[data-k="schedule"],.step[data-k="post"]{border-color:rgba(165,215,255,.5);background:linear-gradient(180deg,rgba(16,28,68,1),rgba(10,18,50,1))}
.step[data-k="post"] .step-en{color:var(--powder)}
.step-arrow{display:flex;align-items:center;color:var(--ink-dim);flex:0 0 auto}

/* ── Status strip ── */
.status-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:36px 0 48px;padding:20px 22px;background:rgba(10,4,28,0.6);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(8px)}
.status-cell{position:relative}
.status-cell+.status-cell{padding-left:20px;border-left:1px solid rgba(167,139,250,.12)}
.status-label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}
.status-value{line-height:1.1;margin:6px 0 4px;letter-spacing:-.01em}
.status-value.mono{font-family:var(--mono);font-weight:500;font-size:20px;color:var(--powder)}
.status-sub{font-size:11.5px;color:var(--ink-mute)}

/* ── Glass card effect (commission.html style) ── */
.post-frame{
  position:relative;
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.025) 50%,rgba(255,255,255,.07));
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-radius:var(--r-lg);
  padding:16px 16px 12px;
  overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.05),0 22px 48px -14px rgba(0,0,0,.55);
  transform-style:preserve-3d;
  will-change:transform;
  transition:box-shadow .3s,border-color .3s;
  isolation:isolate;
}
.post-frame::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:conic-gradient(from calc(var(--iris-angle,135deg) - 30deg),
    rgba(240,165,205,.85) 0%,rgba(196,181,253,.85) 20%,rgba(165,215,255,.85) 40%,
    rgba(140,225,200,.75) 55%,rgba(212,168,78,.75) 70%,rgba(240,165,205,.85) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);

<script type="text/babel">
const { useState, useRef } = React;

/* ─── Syntax Highlighter ─── */
const KW = {
  python: /\b(def|class|return|import|from|as|if|elif|else|for|while|in|not|and|or|with|try|except|finally|raise|yield|lambda|async|await|pass|True|False|None|self)\b/g,
  csharp: /\b(public|private|protected|internal|class|interface|namespace|using|return|if|else|for|foreach|while|new|var|static|readonly|async|await|task|void|string|int|bool|true|false|null|this|override|virtual|abstract|sealed|switch|case|break|throw|try|catch|finally|in|out|ref)\b/g,
  js:     /\b(const|let|var|function|return|if|else|for|while|class|extends|new|async|await|import|from|export|default|true|false|null|undefined|this|try|catch|finally|throw)\b/g,
};
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function highlight(code, lang){
  if (lang === 'http' || lang === 'json'){
    let s = escapeHtml(code);
    s = s.replace(/"([^"\\]|\\.)*"/g, m => `<span class="str">${m}</span>`);
    s = s.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
    if (lang === 'http'){
      s = s.replace(/^(GET|POST|PUT|PATCH|DELETE)\b/gm, '<span class="kw">$1</span>');
      s = s.replace(/^([A-Za-z-]+):/gm, '<span class="fn">$1</span>:');
    }
    return s;
  }
  let s = escapeHtml(code);
  if (lang === 'python') s = s.replace(/(#[^\n]*)/g, '<span class="com">$1</span>');
  else {
    s = s.replace(/(\/\/[^\n]*)/g, '<span class="com">$1</span>');
    s = s.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="com">$1</span>');
  }
  s = s.replace(/("([^"\\]|\\.)*")|('([^'\\]|\\.)*')|(`([^`\\]|\\.)*`)/g, m => {
    if (m.includes('class="com"')) return m;
    return `<span class="str">${m}</span>`;
  });
  if (lang === 'python') s = s.replace(/(^|\n)(\s*)(@\w+)/g, '$1$2<span class="dec">$3</span>');
  if (lang === 'csharp') s = s.replace(/(\[[A-Za-z][\w.]*(\([^\)]*\))?\])/g, '<span class="dec">$1</span>');
  const kw = KW[lang];
  if (kw) s = s.replace(kw, m => `<span class="kw">${m}</span>`);
  s = s.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
  return s;
}

/* ─── CodeBlock ─── */
function CodeBlock({ code, lang = 'python', file, showLineNumbers = false }){
  const [copied, setCopied] = useState(false);
  const trimmed = code.replace(/^\n/, '').replace(/\s+$/, '');
  const html = highlight(trimmed, lang);
  const lines = html.split('\n');
  const onCopy = async () => {
    try { await navigator.clipboard.writeText(trimmed); setCopied(true); setTimeout(() => setCopied(false), 1500); } catch(e){}
  };
  return (
    <div className="code">
      <div className="code-head">
        {file && <span className="file">{file}</span>}
        <span className="lang">{lang}</span>
        <button className={"copy-btn " + (copied ? "ok" : "")} onClick={onCopy}>{copied ? "✓ copied" : "copy"}</button>
      </div>
      <pre className="code-body"><code dangerouslySetInnerHTML={{ __html:
        showLineNumbers
          ? lines.map((l, i) => `<span class="ln">${String(i+1).padStart(2,' ')}</span>${l}`).join('\n')
          : html
      }}/></pre>
    </div>
  );
}

/* ─── Tabs ─── */
function Tabs({ items, value, onChange }){
  return (
    <div className="tabs" role="tablist">
      {items.map(it => (
        <button key={it.value} role="tab" aria-selected={value === it.value}
          className={value === it.value ? "on" : ""} onClick={() => onChange(it.value)}>
          {it.label}
        </button>
      ))}
    </div>
  );
}

/* ─── SectionHeader ─── */
function SectionHeader({ index, en, zh, summary, tags }){
  return (
    <header style={{ display:"grid", gap:16, marginBottom:32 }}>
      <div style={{ display:"flex", alignItems:"baseline", gap:12, flexWrap:"wrap" }}>

        {tags && tags.map(t => <span key={t} className="tag">{t}</span>)}
      </div>
      <h2 className="h-sec">{en} <em>· {zh}</em></h2>
      {summary && <p className="lead" style={{ marginTop:2 }}>{summary}</p>}
    </header>
  );
}

/* ════════════════════════════════
   PROJECT X — Auto-Muse Tweet Bot
   ════════════════════════════════ */

function snowflakeToDate(id){
  try { const ms = Number(BigInt(id) >> 22n) + 1288834974657; return new Date(ms); } catch(e){ return new Date(); }
}
function fmtTs(d){
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}  ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function Pipeline(){
  const steps = [
    { n:"01", k:"prompt",   en:"Prompt",         zh:"主題種子",  note:"從編號 txt 抽選詠唱咒語" },
    { n:"02", k:"text",     en:"Gemini · Text",  zh:"生成文案",  note:"模型寫出 1–2 句推文" },
    { n:"03", k:"image",    en:"Gemini · Image", zh:"生成圖片",  note:"用文案作為 prompt 產圖" },
    { n:"04", k:"compose",  en:"Compose",        zh:"組裝推文",  note:"圖 + 文 + tag 打包" },
    { n:"05", k:"schedule", en:"Schedule",       zh:"排程",      note:"每 6 小時跑一次" },
    { n:"06", k:"post",     en:"Post → X",       zh:"自動發佈",  note:"X API v2 · OAuth1" },
  ];
  return (
    <div className="pipeline">
      {steps.map((s, i) => (
        <React.Fragment key={s.k}>
          <div className="step" data-k={s.k}>
            <div className="step-num">{s.n}</div>
            <div className="step-en">{s.en}</div>
            <div className="step-zh">{s.zh}</div>
            <div className="step-note">{s.note}</div>
          </div>
          {i < steps.length - 1 && (
            <div className="step-arrow" aria-hidden="true">
              <svg viewBox="0 0 40 12" width="36" height="12">
                <path d="M0 6 H34 M28 1 L34 6 L28 11" stroke="currentColor" strokeWidth="1.2" fill="none"/>
              </svg>

function PostCard({ post }){
  const { id, url, text, img, views, likes, accent } = post;
  const ts = fmtTs(snowflakeToDate(id));
  const [imgError, setImgError] = useState(false);
  const frameRef = useRef(null);
  const shimmerRef = useRef(null);

  const onEnter = () => {
    if (frameRef.current) frameRef.current.style.transition = 'box-shadow .3s,border-color .3s';
  };
  const onMove = (e) => {
    const card = frameRef.current, shimmer = shimmerRef.current;
    if (!card || !shimmer) return;
    const rect = card.getBoundingClientRect();
    const dx = (e.clientX - rect.left) / rect.width - 0.5;
    const dy = (e.clientY - rect.top)  / rect.height - 0.5;
    const px = ((e.clientX - rect.left) / rect.width  * 100).toFixed(1);
    const py = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);
    const ang = ((Math.atan2(e.clientY - (rect.top + rect.height/2), e.clientX - (rect.left + rect.width/2)) * 180 / Math.PI) + 360) % 360;
    card.style.transform = `perspective(700px) rotateX(${(-dy*8).toFixed(2)}deg) rotateY(${(dx*12).toFixed(2)}deg) scale3d(1.02,1.02,1.02)`;
    card.style.setProperty('--iris-angle', ang + 'deg');
    shimmer.style.cssText = `opacity:1;background:radial-gradient(ellipse 65% 55% at ${px}% ${py}%,rgba(255,255,255,.18),rgba(210,170,255,.12) 30%,rgba(100,195,255,.07) 55%,transparent 78%)`;
  };
  const onLeave = () => {
    const card = frameRef.current, shimmer = shimmerRef.current;
    if (!card || !shimmer) return;
    card.style.transition = 'transform .55s cubic-bezier(.23,1,.32,1),box-shadow .35s,border-color .25s';
    card.style.transform = '';
    card.style.removeProperty('--iris-angle');
    shimmer.style.opacity = '0';
  };

  return (
    <article className="post" style={{"--accent": accent}}>
      <div className="post-frame" ref={frameRef} onMouseEnter={onEnter} onMouseMove={onMove} onMouseLeave={onLeave}>
        <div className="card-shimmer" ref={shimmerRef}></div>
        <header className="post-head">
          <div className="post-orb"></div>
          <div className="post-id">
            <div className="post-name">wuyan4411 <span className="post-tail">❄</span></div>
            <div className="post-meta">
              <span>@wuyan4411</span>
              <span className="dot-sep">·</span>
              <span>{ts}</span>
            </div>
          </div>
          <div className="post-badge"><span className="post-badge-dot"></span>AUTO</div>
        </header>
        <p className="post-text">{text}</p>
        <div className="post-image" aria-label="AI generated image">
          <div className="post-image-tag">gemini-2.0-flash</div>
          {!imgError && img ? (
            <img className="post-image-real" src={img} alt={text} onError={() => setImgError(true)} loading="lazy" />
          ) : (
            <div className="post-image-inner">
              <div className="ph-stripes"></div>
              <div className="ph-label">image · couldn't load</div>
            </div>
          )}
        </div>
        <footer className="post-stats">
          <span className="post-numbers"><b>{views}</b> views <span className="dot-sep">·</span> <b>{likes}</b> likes</span>
          <a className="post-view" href={url} target="_blank" rel="noreferrer">view on X ↗</a>

[Route("api/[controller]")]
public class OrdersController : ControllerBase

    private readonly IOrderService _orders;
    public OrdersController(IOrderService orders) => _orders = orders;

    // GET api/orders/123
    [HttpGet("{id:int}")]
    public async Task<ActionResult<OrderDto>> GetAsync(int id)
    {

    public async Task<ActionResult<OrderDto>> CreateAsync(CreateOrderRequest req)

public class OrderService : IOrderService
{
    private readonly IOrderRepository _repo;
    private readonly IUnitOfWork _uow;

    public OrderService(IOrderRepository repo, IUnitOfWork uow)
    {
        _repo = repo;
        _uow  = uow;
    }

    public async Task<OrderDto> CreateAsync(CreateOrderRequest req, int userId)
    {
        // 1. 驗證商業規則
        if (req.Items.Count == 0)
            throw new DomainException("訂單至少要有一個品項");

        // 2. 組成領域物件
        var order = Order.NewFromRequest(req, userId);

        // 3. 持久化 + 交易
        await _repo.AddAsync(order);
        await _uow.SaveChangesAsync();

        return OrderDto.From(order);
    }
}

function JwtFlow(){
  const nodes = [
    { k:"client", t:"Client",        d:"前端 / SDK" },
    { k:"login",  t:"POST /login",   d:"傳帳密" },
    { k:"server", t:"Auth Service",  d:"驗證 + 簽發 token" },
    { k:"token",  t:"JWT",           d:"access + refresh" },
    { k:"api",    t:"Protected API", d:"middleware 驗 token" },
  ];
  return (
    <div className="jwt-flow">
      {nodes.map((n, i) => (
        <React.Fragment key={n.k}>
          <div className={"jwt-node n-" + n.k}>
            <div className="jwt-t">{n.t}</div>
            <div className="jwt-d">{n.d}</div>
          </div>
          {i < nodes.length - 1 && (
            <div className="jwt-arrow" aria-hidden="true">
              <svg viewBox="0 0 30 10" width="28" height="10">
                <path d="M0 5 H24 M20 1 L24 5 L20 9" stroke="currentColor" strokeWidth="1" fill="none"/>
              </svg>
            </div>
          )}
        </React.Fragment>
      ))}
    </div>
  );
}

<!-- ── Cursor + Stars ── -->
<script>
(function(){
  const dot  = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  document.addEventListener('mousemove', e => {
    dot.style.left  = e.clientX + 'px'; dot.style.top  = e.clientY + 'px';
    ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px';
  });
  document.addEventListener('mouseover', e => {
    if (e.target.closest('a,button,.sdk-row,.copy-btn')) document.body.classList.add('hov');
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('a,button,.sdk-row,.copy-btn')) document.body.classList.remove('hov');
  });

  const container = document.getElementById('stars');
  const colors = ['#ffffff','rgba(255,185,215,1)','rgba(165,215,255,1)','rgba(255,220,140,1)'];
  for (let i = 0; i < 130; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() < 0.75 ? 1 : 1.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*4)]};--d:${2+Math.random()*4}s;--dl:${Math.random()*5}s;--a:${.2+Math.random()*.55}`;
    container.appendChild(s);
  }
})();
</script>
<script>
/* ── Page section dot nav ── */
(function(){
  var secs=[
    {id:'top',en:'OVERVIEW'},{id:'x',en:'AUTO-MUSE'},
    {id:'mvc',en:'MVC'},{id:'sdk',en:'SDK'}
  ];
  setTimeout(function(){
    var nav=document.getElementById('page-nav');if(!nav)return;
    var items=[];
    secs.forEach(function(s){
      var el=document.getElementById(s.id);if(!el)return;
      var a=document.createElement('a');a.className='pn-item';a.href='#'+s.id;
      a.innerHTML='<span class="pn-label">'+s.en+'</span><div class="pn-node"></div>';
      a.addEventListener('click',function(e){e.preventDefault();el.scrollIntoView({behavior:'smooth'})});
      nav.appendChild(a);items.push({el:el,a:a});
    });
    if(!items.length)return;
    var cur=null;
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        var it=items.find(function(i){return i.el===e.target});
        if(!it||!e.isIntersecting)return;
        if(cur)cur.classList.remove('act');cur=it.a;cur.classList.add('act');
      });
    },{rootMargin:'-5% 0px -60% 0px'});
    items.forEach(function(i){io.observe(i.el)});
  },250);
})();
(function(){
  var prog=document.getElementById('prog');
  if(!prog)return;
  window.addEventListener('scroll',function(){
    var h=document.documentElement.scrollHeight-window.innerHeight;
    prog.style.width=(h>0?Math.round(window.scrollY/h*100):0)+'%';
  },{passive:true});
})();
</script>
