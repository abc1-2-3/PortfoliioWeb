<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>插畫典藏 | WUYAN's ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cinzel:wght@400&family=Noto+Serif+TC:wght@200;300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sidebar.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;background:#04020e;color:#cec8f0;font-family:'Courier New',monospace;overflow-x:hidden;cursor:none}
*{cursor:none!important}

/* ── Cursor ── */
#cursor-dot{position:fixed;width:6px;height:6px;border-radius:50%;background:#fff;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(255,180,220,.9)}
#cursor-ring{position:fixed;width:24px;height:24px;border-radius:50%;border:1px solid rgba(240,160,200,.4);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s}
body.hov #cursor-ring{width:40px;height:40px;border-color:rgba(240,160,205,.75);box-shadow:0 0 12px rgba(220,120,175,.22)}

/* ── Stars ── */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite var(--dl,0s)}
@keyframes twinkle{0%,100%{opacity:var(--a,.3)}50%{opacity:1}}

/* ── Reveal ── */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

/* ── Shell ── */
#shell{display:grid;grid-template-columns:1fr;min-height:100vh;position:relative;z-index:1}

/* ── Main ── */
#main{grid-column:1;min-height:100vh;overflow-x:hidden}

/* ── Topbar ── */
#topbar{
  position:sticky;top:0;z-index:40;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:14px 40px;
  background:linear-gradient(180deg,rgba(4,2,14,.92) 0%,rgba(4,2,14,.58) 65%,transparent 100%);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(240,165,205,.08)
}
.topbar-crumb{
  font:'Courier New',monospace;font-size:11px;letter-spacing:.18em;
  color:rgba(138,122,176,.7);text-transform:uppercase;
  display:flex;align-items:center;gap:0
}
.topbar-crumb a{color:rgba(240,165,205,.58);text-decoration:none;transition:color .2s}
.topbar-crumb a:hover{color:rgba(240,165,205,.9)}
.topbar-crumb .sep{margin:0 8px;opacity:.4}
.topbar-crumb .here{color:rgba(240,165,205,.88)}
.tb-brand{
  font:400 13px 'Cinzel Decorative','Cinzel',serif;
  letter-spacing:.3em;color:rgba(240,165,205,.85)
}
.topbar-tag{
  font:400 10px 'Courier New',monospace;letter-spacing:.18em;
  padding:4px 14px;border:1px solid rgba(240,165,205,.22);
  border-radius:999px;color:rgba(240,165,205,.72);
  text-transform:uppercase;justify-self:end
}

/* ── Hero ── */
.hero{padding:52px max(40px,calc((100% - 1100px)/2)) 40px}
.hero-eyebrow{font:400 8px monospace;letter-spacing:6px;color:rgba(240,165,205,.42);text-transform:uppercase;margin-bottom:14px}
.hero-title{
  display:block;
  font:200 clamp(30px,5vw,62px)/1.2 'Noto Serif TC','Georgia',serif;
  letter-spacing:10px;
  background:linear-gradient(135deg,#f5e8c2 0%,#e8c87a 18%,#d4a84e 38%,#c09030 52%,#d4a84e 66%,#e8c87a 82%,#f5e8c2 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 28px rgba(195,148,42,.38));margin-bottom:14px
}
.hero-sub{font:200 clamp(13px,1.3vw,16px)/1.75 'Noto Serif TC',serif;letter-spacing:3px;color:rgba(228,208,245,.55);margin-bottom:22px;max-width:480px}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap}
.htag{font:400 9px monospace;letter-spacing:2px;padding:5px 14px;border:1px solid rgba(240,165,205,.22);border-radius:20px;color:rgba(240,165,205,.68);transition:all .25s}
.htag:hover{border-color:rgba(240,165,205,.58);color:rgba(255,225,242,.96)}
.hero-stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.hs-item{display:flex;flex-direction:column;align-items:flex-start}
.hs-num{font:200 28px 'Noto Serif TC',serif;color:rgba(240,165,205,.88);letter-spacing:2px;line-height:1}
.hs-label{font:400 8px monospace;letter-spacing:3px;color:rgba(196,181,253,.35);text-transform:uppercase;margin-top:4px}

/* ── Divider ── */
.divider{display:flex;align-items:center;gap:14px;padding:0 max(40px,calc((100% - 1100px)/2));opacity:.28}
.div-line{flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(240,165,205,.65),transparent)}
.div-gem{width:5px;height:5px;background:rgba(240,165,205,.9);transform:rotate(45deg);flex-shrink:0;box-shadow:0 0 6px rgba(240,165,205,.4)}

/* ── Filter ── */
.filter-wrap{padding:32px max(40px,calc((100% - 1100px)/2)) 0}
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-label{font:400 8px monospace;letter-spacing:3px;color:rgba(196,181,253,.3);text-transform:uppercase;margin-right:4px;flex-shrink:0}
.ft-btn{font:400 10px monospace;letter-spacing:2px;padding:6px 18px;border:1px solid rgba(167,139,250,.2);border-radius:2px;color:rgba(196,181,253,.5);background:transparent;transition:all .22s}
.ft-btn:hover{border-color:rgba(240,165,205,.45);color:rgba(240,165,205,.82)}
.ft-btn.active{border-color:rgba(240,165,205,.65);color:rgba(255,220,242,.96);background:rgba(240,165,205,.06)}

/* ── Gallery ── */
.gallery-section{padding:24px max(40px,calc((100% - 1100px)/2)) 90px}
.sec-label{font:700 9px monospace;letter-spacing:4px;color:rgba(240,165,205,.6);text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:22px}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(240,165,205,.16),transparent)}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}

/* ── Art Card ── */
.art-card{
  border:1px solid rgba(240,165,205,.12);border-radius:8px;
  overflow:hidden;background:rgba(8,4,18,.55);
  transition:border-color .3s,box-shadow .3s,transform .3s;
  animation:fadeUp .5s ease both
}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.art-card:hover{border-color:rgba(240,165,205,.46);box-shadow:0 0 28px rgba(240,100,165,.1);transform:translateY(-4px)}
.ac-thumb{aspect-ratio:4/3;position:relative;overflow:hidden;background:#080412}
.ac-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ac-placeholder-geom{width:52px;height:52px;border:1px solid rgba(240,165,205,.16);transform:rotate(45deg);position:relative}
.ac-placeholder-geom::after{content:'';position:absolute;inset:12px;border:1px solid rgba(240,165,205,.07)}
.ac-overlay{position:absolute;inset:0;background:rgba(4,2,14,0);transition:background .3s;display:flex;align-items:center;justify-content:center}
.art-card:hover .ac-overlay{background:rgba(4,2,14,.42)}
.ac-zoom{font:400 9px monospace;letter-spacing:4px;color:rgba(255,225,242,.92);opacity:0;transition:opacity .3s;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.ac-zoom::before,.ac-zoom::after{content:'';width:18px;height:1px;background:currentColor}
.art-card:hover .ac-zoom{opacity:1}
.ac-meta{padding:14px 16px}
.ac-cat{font:400 8px monospace;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
.ac-cat.orig   {color:rgba(165,215,255,.6)}
.ac-cat.fan    {color:rgba(240,165,205,.6)}
.ac-cat.fanart {color:rgba(180,140,255,.65)}
.ac-title{font:400 13px monospace;color:rgba(232,222,252,.92);letter-spacing:.5px;margin-bottom:5px}
.ac-sub{font:400 10px monospace;color:rgba(162,140,200,.4);letter-spacing:1px}

/* placeholder bg per category */
.pp-orig  {background:radial-gradient(ellipse at 30% 30%,rgba(165,215,255,.07) 0%,rgba(120,190,240,.04) 50%,transparent 80%)}
.pp-fan   {background:radial-gradient(ellipse at 70% 30%,rgba(240,165,205,.08) 0%,rgba(215,120,170,.04) 50%,transparent 80%)}
.pp-fanart{background:radial-gradient(ellipse at 50% 25%,rgba(180,140,255,.08) 0%,rgba(150,100,235,.04) 50%,transparent 80%)}
.pp-misc  {background:radial-gradient(ellipse at 50% 60%,rgba(180,140,255,.05) 0%,rgba(150,100,235,.03) 50%,transparent 80%)}

/* ── Empty state ── */
.empty-state{text-align:center;padding:60px 20px;grid-column:1/-1}
.empty-gem{font-size:28px;opacity:.22;margin-bottom:12px}
.empty-text{font:400 10px monospace;letter-spacing:3px;color:rgba(196,181,253,.25);text-transform:uppercase}

/* ── Lightbox ── */
#lightbox{
  position:fixed;inset:0;z-index:200;
  background:rgba(4,2,14,.94);backdrop-filter:blur(24px);
  display:none;align-items:center;justify-content:center;padding:40px 20px
}
#lightbox.open{display:flex}
.lb-inner{max-width:760px;width:100%;position:relative}
.lb-close{
  position:absolute;top:-42px;right:0;
  font:400 9px monospace;letter-spacing:3px;
  color:rgba(240,165,205,.52);background:none;
  border:1px solid rgba(240,165,205,.18);padding:5px 16px;border-radius:2px;transition:all .2s
}
.lb-close:hover{color:rgba(240,165,205,.96);border-color:rgba(240,165,205,.52)}
.lb-img-area{
  aspect-ratio:4/3;border:1px solid rgba(240,165,205,.14);border-radius:8px;
  overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center
}
.lb-img-area img{width:100%;height:100%;object-fit:contain;object-position:center}
.lb-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.lb-placeholder-mark{width:80px;height:80px;border:1px solid rgba(240,165,205,.16);transform:rotate(45deg)}
.lb-placeholder-text{font:400 9px monospace;letter-spacing:4px;color:rgba(240,165,205,.28);text-transform:uppercase;position:absolute;bottom:20px}
.lb-info{margin-top:18px;display:flex;align-items:baseline;gap:14px;padding:0 2px}
.lb-title{font:200 20px 'Noto Serif TC',serif;color:rgba(232,220,255,.92);letter-spacing:3px}
.lb-meta{font:400 10px monospace;color:rgba(162,140,200,.45);letter-spacing:2px}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  font:400 10px monospace;letter-spacing:2px;
  color:rgba(240,165,205,.42);background:rgba(4,2,14,.75);
  border:1px solid rgba(240,165,205,.16);padding:10px 14px;border-radius:2px;transition:all .2s
}
.lb-nav:hover{color:rgba(240,165,205,.92);border-color:rgba(240,165,205,.48)}
#lb-prev{left:-56px}
#lb-next{right:-56px}
</style>
<script>window.SIDEBAR_PAGE = 'archive';</script>
<script src="sidebar.js" defer></script>
</head>
<body>
<div id="cursor-dot"></div>
<div id="cursor-ring"></div>
<div id="stars"></div>

<!-- ── Sidebar ── -->
<aside id="sidebar"></aside>

<!-- ── Lightbox ── -->
<div id="lightbox">
  <div class="lb-inner">
    <button class="lb-close" onclick="closeLightbox()">ESC · CLOSE</button>
    <button class="lb-nav" id="lb-prev" onclick="lbShift(-1)">‹ PREV</button>
    <button class="lb-nav" id="lb-next" onclick="lbShift(1)">NEXT ›</button>
    <div class="lb-img-area" id="lb-img-area"></div>
    <div class="lb-info">
      <span class="lb-title" id="lb-title"></span>
      <span class="lb-meta" id="lb-meta"></span>
    </div>
  </div>
</div>

<!-- ── Shell ── -->
<div id="shell">
  <div id="main">

    <!-- Topbar -->
    <div id="topbar">
      <div class="topbar-crumb">
        <a href="works_v3.html">Archive</a>
        <span class="sep">/</span>
        <span class="here">Illust</span>
      </div>
      <div class="tb-brand">✦ WUYAN · ARCHIVE</div>
      <span class="topbar-tag">Illust · Visual</span>
    </div>

    <!-- Hero -->
    <section class="hero reveal">
      <div class="hero-eyebrow">ILLUSTRATION · VISUAL · ARCHIVE</div>
      <span class="hero-title">插畫典藏</span>
      <div class="hero-sub">過去歷史的視覺作品收錄<br>包含原創角色・同人插畫</div>
      <div class="hero-tags">
        <span class="htag">Digital Art</span>
        <span class="htag">Character Design</span>
        <span class="htag">VTuber Fanart</span>
        <span class="htag">Original</span>
      </div>
      <div class="hero-stats">
        <div class="hs-item">
          <div class="hs-num" id="stat-total">—</div>
          <div class="hs-label">Total</div>
        </div>
        <div class="hs-item">
          <div class="hs-num" id="stat-orig">—</div>
          <div class="hs-label">原創</div>
        </div>
        <div class="hs-item">
          <div class="hs-num" id="stat-fan">—</div>
          <div class="hs-label">同人</div>
        </div>
        <div class="hs-item">
          <div class="hs-num" id="stat-fanart">—</div>
          <div class="hs-label">Fanart</div>
        </div>
      </div>
    </section>

    <div class="divider"><div class="div-line"></div><div class="div-gem"></div><div class="div-line"></div></div>

    <!-- Filter -->
    <div class="filter-wrap reveal">
      <div class="filter-bar">
        <span class="filter-label">Filter</span>
        <button class="ft-btn active" data-filter="all">ALL</button>
        <button class="ft-btn" data-filter="orig">原創</button>
        <button class="ft-btn" data-filter="fan">同人</button>
        <button class="ft-btn" data-filter="fanart">Fanart</button>
      </div>
    </div>

    <!-- Gallery -->
    <div class="gallery-section">
      <div class="sec-label">Works</div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>

  </div>
</div>

<script>
// ── Works data ───────────────────────────────────────────────
// img: null → 佔位；換成實際路徑後自動顯示圖片
const WORKS = [
  { id:1, title:'作品名稱 01', sub:'原創角色',      cat:'orig',   catLabel:'原創',   year:'2024', img:null },
  { id:2, title:'作品名稱 02', sub:'VTuber 同人',   cat:'fan',    catLabel:'同人',   year:'2024', img:null },
  { id:3, title:'作品名稱 03', sub:'VTuber Fanart', cat:'fanart', catLabel:'Fanart', year:'2023', img:null },
  { id:4, title:'作品名稱 04', sub:'原創角色設計',  cat:'orig',   catLabel:'原創',   year:'2023', img:null },
  { id:5, title:'作品名稱 05', sub:'VTuber 同人',   cat:'fan',    catLabel:'同人',   year:'2022', img:null },
  { id:6, title:'作品名稱 06', sub:'VTuber Fanart', cat:'fanart', catLabel:'Fanart', year:'2022', img:null },
  { id:7, title:'作品名稱 07', sub:'原創插畫',      cat:'orig',   catLabel:'原創',   year:'2022', img:null },
];

const PP = { orig:'pp-orig', fan:'pp-fan', fanart:'pp-fanart' };

// ── Render ────────────────────────────────────────────────────
let activeFilter = 'all';
let lbIndex = 0;

function filteredList() {
  return activeFilter === 'all' ? WORKS : WORKS.filter(w => w.cat === activeFilter);
}

function renderGallery() {
  const grid = document.getElementById('gallery-grid');
  const list = filteredList();

  if (list.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-gem">✦</div><div class="empty-text">No works in this category yet</div></div>`;
    return;
  }

  grid.innerHTML = list.map((w, i) => `
    <div class="art-card" style="animation-delay:${i * 0.06}s" onclick="openLightbox(${w.id})">
      <div class="ac-thumb ${PP[w.cat] || 'pp-misc'}">
        ${w.img
          ? `<img src="${w.img}" alt="${w.title}" style="width:100%;height:100%;object-fit:cover">`
          : `<div class="ac-placeholder"><div class="ac-placeholder-geom"></div></div>`
        }
        <div class="ac-overlay"><span class="ac-zoom">View</span></div>
      </div>
      <div class="ac-meta">
        <div class="ac-cat ${w.cat}">${w.catLabel}</div>
        <div class="ac-title">${w.title}</div>
        <div class="ac-sub">${w.year} · ${w.sub}</div>
      </div>
    </div>
  `).join('');

  updateStats();
}

function updateStats() {
  document.getElementById('stat-total').textContent  = String(WORKS.length).padStart(2, '0');
  document.getElementById('stat-orig').textContent   = String(WORKS.filter(w => w.cat === 'orig').length).padStart(2, '0');
  document.getElementById('stat-fan').textContent    = String(WORKS.filter(w => w.cat === 'fan').length).padStart(2, '0');
  document.getElementById('stat-fanart').textContent = String(WORKS.filter(w => w.cat === 'fanart').length).padStart(2, '0');
}

// ── Filter ────────────────────────────────────────────────────
document.querySelectorAll('.ft-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ft-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderGallery();
  });
});

// ── Lightbox ──────────────────────────────────────────────────
function openLightbox(id) {
  const list = filteredList();
  lbIndex = list.findIndex(w => w.id === id);
  renderLightbox(list[lbIndex]);
  document.getElementById('lightbox').classList.add('open');
}

function renderLightbox(w) {
  const area = document.getElementById('lb-img-area');
  area.className = 'lb-img-area ' + (PP[w.cat] || 'pp-misc');
  area.innerHTML = w.img
    ? `<img src="${w.img}" alt="${w.title}">`
    : `<div class="lb-placeholder">
        <div class="lb-placeholder-mark"></div>
        <div class="lb-placeholder-text">Image · Placeholder</div>
       </div>`;
  document.getElementById('lb-title').textContent = w.title;
  document.getElementById('lb-meta').textContent  = w.year + ' · ' + w.catLabel + ' · ' + w.sub;

  const list = filteredList();
  document.getElementById('lb-prev').style.visibility = lbIndex > 0 ? 'visible' : 'hidden';
  document.getElementById('lb-next').style.visibility = lbIndex < list.length - 1 ? 'visible' : 'hidden';
}

function lbShift(dir) {
  const list = filteredList();
  lbIndex = Math.max(0, Math.min(list.length - 1, lbIndex + dir));
  renderLightbox(list[lbIndex]);
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox') closeLightbox();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape')      closeLightbox();
  if (e.key === 'ArrowLeft')   lbShift(-1);
  if (e.key === 'ArrowRight')  lbShift(1);
});

// ── Stars ─────────────────────────────────────────────────────
(function() {
  const colors = ['#ffffff', 'rgba(255,185,215,1)', 'rgba(165,215,255,1)', 'rgba(255,220,140,1)'];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 1.6 + 0.5;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:${colors[Math.floor(Math.random()*4)]};--d:${2+Math.random()*4}s;--dl:${Math.random()*4}s;--a:${0.15+Math.random()*0.55}`;
    frag.appendChild(s);
  }
  document.getElementById('stars').appendChild(frag);
})();

// ── Cursor ────────────────────────────────────────────────────
(function() {
  const dot  = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  let rx = 0, ry = 0, mx = 0, my = 0;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; dot.style.left = mx+'px'; dot.style.top = my+'px'; });
  document.addEventListener('mouseover', e => {
    document.body.classList.toggle('hov', !!e.target.closest('a,button,.art-card'));
  });
  (function loop() { rx += (mx-rx)*.14; ry += (my-ry)*.14; ring.style.left = rx+'px'; ring.style.top = ry+'px'; requestAnimationFrame(loop); })();
})();

// ── Scroll reveal ─────────────────────────────────────────────
(function() {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }), { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
})();

renderGallery();
</script>
</body>
</html>
