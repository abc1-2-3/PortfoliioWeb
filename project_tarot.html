<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARCANA · 塔羅占卜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Topbar ===== */
#topnav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 48px;
  z-index: 1000;
  background: rgba(11, 8, 32, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(167, 139, 250, 0.16);
  display: flex;
  align-items: center;
  padding: 0 18px;
}
.tnav-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.tnav-back {
  display: flex;
  align-items: center;
  gap: 6px;
  color: rgba(196, 181, 253, 0.55);
  text-decoration: none;
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 0.18em;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid transparent;
  transition: all 0.2s;
}
.tnav-back:hover {
  color: #e8e0f8;
  background: rgba(167, 139, 250, 0.09);
  border-color: rgba(167, 139, 250, 0.2);
}
.tnav-sep {
  width: 1px; height: 22px;
  background: rgba(167, 139, 250, 0.16);
  flex-shrink: 0;
}
.tnav-brand {
  display: flex;
  align-items: center;
  gap: 9px;
}
.tnav-brand-mark {
  font-size: 16px;
  color: #d6b06c;
  filter: drop-shadow(0 0 7px rgba(214, 176, 108, 0.55));
  line-height: 1;
  font-family: 'Cormorant Garamond', serif;
}
.tnav-brand-text {
  display: flex;
  flex-direction: column;
}
.tnav-brand-en {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.24em;
  color: #ece8f8;
  line-height: 1.2;
}
.tnav-brand-zh {
  font-size: 9px;
  letter-spacing: 0.4em;
  color: rgba(196, 181, 253, 0.4);
  font-family: 'Noto Serif TC', serif;
  line-height: 1;
  margin-top: 2px;
}

/* ===== Tarot App Styles ===== */
:root {
  --bg-0: #0b0820;
  --bg-1: #14102e;
  --bg-2: #1f1a44;
  --ink: #f3ead5;
  --ink-dim: rgba(243, 234, 213, 0.65);
  --ink-faint: rgba(243, 234, 213, 0.38);
  --gold: #d6b06c;
  --gold-soft: #c89e58;
  --gold-glow: rgba(214, 176, 108, 0.5);
  --violet: #6d4bb3;
  --rail-w-open: 400px;
  --rail-w-collapsed: 56px;
  --serif-en: "Cormorant Garamond", "Cinzel", Georgia, serif;
  --display: "Cinzel", "Cormorant Garamond", serif;
  --serif-cn: "Noto Serif TC", "Songti TC", "STSong", serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--serif-cn);
  color: var(--ink);
  background: var(--bg-0);
  overflow: hidden;
  height: 100vh;
  letter-spacing: 0.02em;
}

/* ===== Stage / Background ===== */
.stage {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(109, 75, 179, 0.28) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(214, 176, 108, 0.10) 0%, transparent 55%),
    linear-gradient(rgba(8, 5, 22, 0.52), rgba(8, 5, 22, 0.52)),
    url('assets/tarot/tarotbg.webp') center / cover no-repeat;
  overflow: hidden;
  z-index: 0;
}
.stars, .stars-2, .stars-3 { position: absolute; inset: 0; pointer-events: none; }
.stars::before, .stars-2::before, .stars-3::before {
  content: "";
  position: absolute;
  inset: -50%;
  background-repeat: repeat;
}
.stars::before {
  background-image: radial-gradient(1px 1px at 25% 30%, rgba(255,255,255,0.9), transparent),
                    radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.7), transparent),
                    radial-gradient(1.5px 1.5px at 80% 20%, rgba(255,255,255,0.85), transparent),
                    radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,0.6), transparent),
                    radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,0.8), transparent),
                    radial-gradient(1px 1px at 40% 90%, rgba(214,176,108,0.5), transparent);
  background-size: 300px 300px;
  animation: twinkle 8s ease-in-out infinite;
}
.stars-2::before {
  background-image: radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.6), transparent),
                    radial-gradient(0.5px 0.5px at 30% 60%, rgba(255,255,255,0.4), transparent),
                    radial-gradient(0.5px 0.5px at 75% 25%, rgba(255,255,255,0.5), transparent);
  background-size: 200px 200px;
  animation: twinkle 12s ease-in-out infinite reverse;
}
.stars-3::before {
  background-image: radial-gradient(1.5px 1.5px at 10% 10%, rgba(214,176,108,0.6), transparent),
                    radial-gradient(1px 1px at 70% 80%, rgba(214,176,108,0.4), transparent),
                    radial-gradient(1.5px 1.5px at 45% 35%, rgba(255,240,200,0.7), transparent);
  background-size: 500px 500px;
  animation: twinkle 15s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 1; transform: translateY(0); }
  50% { opacity: 0.55; transform: translateY(-8px); }
}
.smoke {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 40% at 30% 100%, rgba(140, 96, 220, 0.18), transparent 70%),
    radial-gradient(ellipse 60% 30% at 70% 0%, rgba(214, 176, 108, 0.08), transparent 70%);
  filter: blur(20px);
  mix-blend-mode: screen;
}
.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
}

/* ===== App Header (decorative, below topbar) ===== */
.header {
  position: fixed;
  top: 48px; left: 0; right: 0;
  padding: 16px 44px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  z-index: 50;
  pointer-events: none;
}
.brand { display: none; }
.header-subtitle {
  font-family: var(--serif-cn);
  color: var(--ink-faint);
  font-size: 12px;
  letter-spacing: 0.4em;
  padding-left: 0.4em;
}

/* ===== Main grid ===== */
.app-main {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: grid;
  transition: grid-template-columns 0.45s cubic-bezier(0.4, 0, 0.2, 1);
}
.app-main.no-rail { grid-template-columns: 1fr; }
.app-main.has-rail-collapsed { grid-template-columns: 1fr var(--rail-w-collapsed); }
.app-main.has-rail-open { grid-template-columns: 1fr var(--rail-w-open); }

/* ===== Board (left column) ===== */
.board-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 112px 40px 40px;
  overflow: hidden;
  min-width: 0;
}

.board-meta {
  text-align: center;
  margin-bottom: 28px;
}
.board-meta-en {
  font-family: var(--display);
  letter-spacing: 0.45em;
  font-size: 11px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.board-meta-cn {
  font-family: var(--serif-cn);
  font-size: 30px;
  letter-spacing: 0.32em;
  color: var(--ink);
  padding-left: 0.32em;
  text-shadow: 0 0 30px rgba(214,176,108,0.25);
}
.board-meta-orn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 14px;
  color: var(--gold);
}
.board-meta-orn > span:not(.orn-glyph) {
  width: 60px;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold), transparent);
}
.orn-glyph {
  font-size: 11px;
  opacity: 0.85;
}

.board {
  position: relative;
  width: 100%;
  max-width: 1000px;
  flex: 0 0 auto;
  transition: max-width 0.4s ease, height 0.4s ease;
  margin: 8px 0 16px;
}
.board.is-celtic { max-width: 820px; }

/* ===== Board CTA ===== */
.board-cta {
  margin-top: auto;
  padding-top: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.board-cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 18px;
  padding: 18px 46px;
  background: linear-gradient(180deg, rgba(214,176,108,0.2), rgba(214,176,108,0.06));
  border: 1px solid var(--gold);
  color: var(--ink);
  font-family: var(--serif-cn);
  font-size: 15px;
  letter-spacing: 0.45em;
  padding-left: calc(46px + 0.45em);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}
.board-cta-btn::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(214,176,108,0.25);
  pointer-events: none;
}
.board-cta-btn .cta-rune {
  color: var(--gold);
  font-size: 13px;
}
.board-cta-btn:hover {
  background: linear-gradient(180deg, rgba(214,176,108,0.3), rgba(214,176,108,0.12));
  box-shadow: 0 0 50px var(--gold-glow), inset 0 0 30px rgba(214,176,108,0.15);
}
.board-cta-hint {
  font-family: var(--serif-cn);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.28em;
}

/* ===== Bottom Bar ===== */
.bottom-bar {
  margin-top: auto;
  padding-top: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}
.bar-status {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 22px;
  background: rgba(11,8,32,0.5);
  border: 1px solid rgba(214,176,108,0.25);
  font-family: var(--serif-cn);
}
.bar-status-label {
  font-size: 12px;
  color: var(--ink-dim);
  letter-spacing: 0.3em;
  padding-left: 0.3em;
}
.bar-status-num {
  font-family: var(--display);
  font-size: 16px;
  color: var(--gold);
  letter-spacing: 0.1em;
}
.bar-btn {
  padding: 12px 24px;
  font-family: var(--serif-cn);
  font-size: 13px;
  letter-spacing: 0.3em;
  padding-left: calc(24px + 0.3em);
  cursor: pointer;
  transition: all 0.25s ease;
  border: 1px solid;
}
.bar-btn-primary {
  background: linear-gradient(180deg, rgba(214,176,108,0.2), rgba(214,176,108,0.05));
  border-color: var(--gold);
  color: var(--ink);
  position: relative;
}
.bar-btn-primary::before {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(214,176,108,0.25);
  pointer-events: none;
}
.bar-btn-primary:hover {
  background: linear-gradient(180deg, rgba(214,176,108,0.32), rgba(214,176,108,0.12));
  box-shadow: 0 0 24px var(--gold-glow);
}
.bar-btn-ghost {
  background: transparent;
  border-color: rgba(214,176,108,0.4);
  color: var(--ink-dim);
}
.bar-btn-ghost:hover {
  border-color: var(--gold);
  color: var(--ink);
}
.bar-btn-text {
  background: transparent;
  border: none;
  color: var(--ink-faint);
  font-size: 12px;
  padding: 8px 12px;
  letter-spacing: 0.25em;
}
.bar-btn-text:hover { color: var(--gold); }

/* ===== Slot placeholder ===== */
.slot-placeholder {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: none;
  animation: slotIn 0.6s ease both;
}
.slot-placeholder.is-overlay { z-index: 2; }
.slot-inner {
  width: 100%;
  height: 100%;
  border: 1px dashed rgba(214,176,108,0.32);
  background: rgba(11, 8, 32, 0.25);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  border-radius: 4px;
}
.slot-inner::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(214,176,108,0.08);
  border-radius: 2px;
}
.slot-num {
  font-family: var(--display);
  font-size: 24px;
  color: var(--gold);
  opacity: 0.6;
  letter-spacing: 0.1em;
}
.slot-label {
  font-family: var(--serif-cn);
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.25em;
  white-space: nowrap;
  padding-left: 0.25em;
}
@keyframes slotIn {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* ===== Tarot Card ===== */
.tarot-card-slot {
  position: absolute;
  transform: translate(-50%, -50%);
  perspective: 1200px;
  transition: opacity 0.6s ease;
  user-select: none;
  pointer-events: none;
}
.tarot-card-slot.is-dimmed { opacity: 0.4; }
.tarot-card-slot.is-overlay { z-index: 3; }
.tarot-card-slot.is-focused { z-index: 4; }

.tarot-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  pointer-events: auto;
}
.tarot-card-slot.is-flipped .tarot-card-inner {
  transform: rotate(var(--card-rot, 0deg)) rotateY(180deg) !important;
}

.tarot-card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 6px;
  overflow: hidden;
  box-shadow:
    0 12px 36px rgba(0,0,0,0.65),
    0 0 0 1px rgba(214,176,108,0.35),
    inset 0 0 0 1px rgba(214,176,108,0.15);
}
.tarot-card-back {
  background: radial-gradient(circle at 50% 50%, #2a1f5a 0%, #14102e 60%, #0b0820 100%);
}
.back-ornament { position: absolute; inset: 0; }
.back-ornament svg { width: 100%; height: 100%; display: block; }

.tarot-card-front {
  background: linear-gradient(180deg, #1d1838 0%, #15102f 100%);
  transform: rotateY(180deg);
  display: grid;
  place-items: center;
}
.tarot-card-front.is-reversed .front-inner { transform: rotate(180deg); }

.front-inner {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 14px 10px;
}
.front-frame {
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(214,176,108,0.55);
  pointer-events: none;
}
.front-frame::before {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(214,176,108,0.2);
}
.corner {
  position: absolute;
  font-family: var(--display);
  color: var(--gold);
  font-size: 11px;
  letter-spacing: 0.1em;
}
.corner.tl { top: 8px; left: 10px; }
.corner.br { bottom: 8px; right: 10px; }
.front-glyph {
  font-size: 60px;
  color: var(--gold);
  margin-top: 22px;
  text-shadow: 0 0 24px rgba(214,176,108,0.55);
  font-family: var(--display);
  line-height: 1;
}
.front-name { text-align: center; margin-bottom: 8px; z-index: 2; }
.name-cn {
  font-family: var(--serif-cn);
  font-size: 15px;
  color: var(--ink);
  letter-spacing: 0.3em;
  padding-left: 0.3em;
}
.name-en {
  font-family: var(--display);
  font-style: italic;
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 0.12em;
  margin-top: 4px;
}
.reversed-tag {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(180deg);
  font-family: var(--display);
  font-size: 9px;
  color: rgba(214,176,108,0.55);
  letter-spacing: 0.3em;
  border: 1px solid rgba(214,176,108,0.3);
  padding: 3px 8px;
  margin-top: 48px;
}
.card-label {
  position: absolute;
  bottom: -26px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--serif-cn);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.2em;
  white-space: nowrap;
  pointer-events: none;
}
.tarot-card-slot.is-flipped .card-label { color: var(--gold); }
.tarot-card-slot.is-focused .card-label { color: var(--gold); }
.tarot-card-inner:hover ~ .card-label { color: var(--gold); }

/* Entry animation */
.tarot-card-slot {
  animation: deal 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}
@keyframes deal {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) translateY(-60px) scale(0.7);
    filter: blur(6px);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, -50%);
    filter: blur(0);
  }
}
.tarot-card-slot:not(.is-flipped) .tarot-card-inner:hover {
  transform: rotate(var(--card-rot, 0deg)) translateY(-6px) scale(1.04);
}
.tarot-card-slot:not(.is-flipped) .tarot-card-inner:hover .tarot-card-face {
  box-shadow:
    0 22px 50px rgba(0,0,0,0.75),
    0 0 0 1px var(--gold),
    0 0 36px var(--gold-glow);
}

/* ===== Floating Spread Picker ===== */
.spread-float {
  position: fixed;
  top: 118px;
  right: 32px;
  width: 340px;
  background: linear-gradient(180deg, rgba(11,8,32,0.92), rgba(20,16,46,0.94));
  border: 1px solid rgba(214,176,108,0.32);
  backdrop-filter: blur(16px);
  padding: 22px 22px 22px;
  z-index: 40;
  box-shadow:
    0 30px 80px rgba(0,0,0,0.55),
    0 0 0 1px rgba(214,176,108,0.06),
    inset 0 0 0 1px rgba(214,176,108,0.06);
  animation: floatIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.spread-float::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(214,176,108,0.12);
  pointer-events: none;
}
@keyframes floatIn {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.float-header {
  text-align: left;
  margin-bottom: 18px;
  position: relative;
}
.float-eyebrow {
  font-family: var(--display);
  font-size: 10px;
  letter-spacing: 0.45em;
  color: var(--gold);
  text-transform: uppercase;
}
.float-title {
  font-family: var(--serif-cn);
  font-size: 20px;
  color: var(--ink);
  letter-spacing: 0.3em;
  margin-top: 6px;
  padding-left: 0.3em;
}
.float-divider {
  margin-top: 12px;
  height: 1px;
  background: linear-gradient(to right, rgba(214,176,108,0.5), transparent);
}
.float-list { display: flex; flex-direction: column; gap: 4px; }
.float-pick {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  background: transparent;
  border: 1px solid rgba(214,176,108,0.12);
  cursor: pointer;
  font-family: inherit;
  color: inherit;
  text-align: left;
  transition: all 0.22s ease;
}
.float-pick:hover {
  border-color: rgba(214,176,108,0.4);
  background: rgba(214,176,108,0.05);
}
.float-pick.is-selected {
  border-color: var(--gold);
  background: linear-gradient(90deg, rgba(214,176,108,0.14), rgba(214,176,108,0.02));
  box-shadow: 0 0 20px rgba(214,176,108,0.15);
}
.float-pick-radio {
  width: 14px; height: 14px;
  border: 1px solid var(--gold);
  border-radius: 50%;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.radio-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0;
  transition: opacity 0.2s ease;
}
.float-pick.is-selected .radio-dot { opacity: 1; }
.float-pick-info { flex: 1; min-width: 0; }
.float-pick-name {
  font-family: var(--serif-cn);
  font-size: 14px;
  color: var(--ink);
  letter-spacing: 0.15em;
  padding-left: 0.15em;
}
.float-pick-sub {
  font-family: var(--display);
  font-style: italic;
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.1em;
  margin-top: 2px;
}
.float-pick-mini {
  width: 52px; height: 28px;
  color: var(--ink-faint);
  flex-shrink: 0;
}
.float-pick-mini svg { width: 100%; height: 100%; }
.float-pick.is-selected .float-pick-mini { color: var(--gold); }
.float-desc {
  margin-top: 16px;
  padding: 12px 14px;
  border-left: 2px solid var(--gold);
  background: rgba(214,176,108,0.04);
  font-family: var(--serif-cn);
  font-size: 12px;
  color: var(--ink-dim);
  line-height: 1.85;
  letter-spacing: 0.05em;
}

  height: 100vh;
  overflow: hidden;
  transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
}
.rail-toggle {
  position: absolute;
  top: 50%;
  left: -16px;
  transform: translateY(-50%);
  width: 32px;
  height: 60px;
  border-radius: 6px 0 0 6px;
  background: var(--bg-2);
  border: 1px solid rgba(214,176,108,0.4);

.rail-collapsed-label {

  padding: 120px 28px 32px;

}
.rail-content::-webkit-scrollbar { width: 6px; }
.rail-content::-webkit-scrollbar-thumb { background: rgba(214,176,108,0.2); border-radius: 3px; }
.rail-section-title {
  display: flex;

.rail-section-title > span:first-child::before {

.rail-section-divider {

  height: 1px;
  background: linear-gradient(to right, rgba(214,176,108,0.4), transparent);
}
.rail-empty {

  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
  border: 1px dashed rgba(214,176,108,0.2);

.shuffle-overlay {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  50% { transform: translate(0,0) rotate(0deg); }
  75% { transform: translate(34px,-12px) rotate(8deg); }

<script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;

  .twk-hd{display:flex;align-items:center;justify-content:space-between;

    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd">
          <b>{title}</b>
          <button className="twk-x" onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (<><div className="twk-sect">{label}</div>{children}</>);
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div ref={trackRef} className="twk-seg">
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" onClick={() => onChange(o.value)}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakToggle, TweakRadio });
</script>

<script type="text/babel">
const { useState, useEffect } = React;

function SpreadDiagram({ id, color = "currentColor" }) {
  const stroke = color;
  if (id === "single") return (
    <svg viewBox="0 0 100 78"><rect x="42" y="14" width="16" height="50" rx="1.5" fill="none" stroke={stroke} strokeWidth="1"/></svg>
  );
  if (id === "trinity") return (
    <svg viewBox="0 0 140 78">
      <rect x="14" y="14" width="16" height="50" rx="1.5" fill="none" stroke={stroke} strokeWidth="1"/>
      <rect x="62" y="14" width="16" height="50" rx="1.5" fill="none" stroke={stroke} strokeWidth="1"/>
      <rect x="110" y="14" width="16" height="50" rx="1.5" fill="none" stroke={stroke} strokeWidth="1"/>
    </svg>
  );
  if (id === "core") return (
    <svg viewBox="0 0 180 78">
      <rect x="8"   y="14" width="16" height="50" rx="1.5" fill="none" stroke={stroke} strokeWidth="1"/>
      <rect x="56"  y="14" width="16" height="50" rx="1.5" fill="none" stroke={stroke} strokeWidth="1"/>
      <rect x="104" y="14" width="16" height="50" rx="1.5" fill="none" stroke={stroke} strokeWidth="1"/>
      <rect x="152" y="14" width="16" height="50" rx="1.5" fill="none" stroke={stroke} strokeWidth="1"/>
    </svg>
  );
  if (id === "celtic") return (
    <svg viewBox="0 0 200 100">
      <rect x="44" y="36" width="14" height="28" rx="1.2" fill="none" stroke={stroke} strokeWidth="0.9"/>
      <rect x="40" y="42" width="22" height="16" rx="1.2" fill="none" stroke={stroke} strokeWidth="0.9" transform="rotate(90 51 50)"/>
      <rect x="44" y="72" width="14" height="20" rx="1.2" fill="none" stroke={stroke} strokeWidth="0.9"/>
      <rect x="24" y="36" width="14" height="28" rx="1.2" fill="none" stroke={stroke} strokeWidth="0.9"/>
      <rect x="44" y="8"  width="14" height="20" rx="1.2" fill="none" stroke={stroke} strokeWidth="0.9"/>
      <rect x="68" y="36" width="14" height="28" rx="1.2" fill="none" stroke={stroke} strokeWidth="0.9"/>
      {[6, 30, 54, 78].map((y, i) => (
        <rect key={i} x="110" y={y} width="14" height="18" rx="1.2" fill="none" stroke={stroke} strokeWidth="0.9"/>
      ))}
    </svg>
  );
  return null;
}

function shuffleDeck() {
  const deck = ARCANA.map(c => ({ card: c, reversed: Math.random() < 0.28 }));
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

function App() {
  const tweaks = window.useTweaks ? window.useTweaks(window.__TAROT_TWEAKS_DEFAULTS__) : [window.__TAROT_TWEAKS_DEFAULTS__, () => {}];
  const [t, setTweak] = tweaks;

  const [spreadId, setSpreadId] = useState("trinity");
  const [phase, setPhase] = useState("ready");
  const [draws, setDraws] = useState([]);
  const [activeIdx, setActiveIdx] = useState(null);
  const [panelOpen, setPanelOpen] = useState(false);

  const spread = SPREADS[spreadId];
  const hasDraws = draws.length > 0;
  const flippedCount = draws.filter(d => d.flipped).length;
  const allFlipped = hasDraws && flippedCount === draws.length;

  function pickSpread(id) {
    setSpreadId(id);
    setDraws([]);
    setActiveIdx(null);
    setPhase("ready");
  }

  function startDraw() {
    setPhase("shuffle");
    setActiveIdx(null);
    setPanelOpen(false);
    const deck = shuffleDeck();
    const count = SPREADS[spreadId].count;
    const picked = deck.slice(0, count).map(d => ({ ...d, flipped: false }));
    setTimeout(() => {
      setDraws(picked);
      setPhase("reading");
    }, 2200);
  }

  function handleCardClick(idx) {
    setDraws(prev => prev.map((d, i) => i === idx ? { ...d, flipped: true } : d));
  }

  function handleCardDoubleClick(idx) {
    setDraws(prev => prev.map((d, i) => i === idx ? { ...d, flipped: true } : d));
    setActiveIdx(idx);
    setPanelOpen(true);
  }

  function flipAll() {
    setDraws(prev => prev.map(d => ({ ...d, flipped: true })));
  }

  function resetBoard() {
    setDraws([]);
    setActiveIdx(null);
    setPanelOpen(false);
    setPhase("ready");
  }

  const cardSize = spreadId === "celtic" ? 0.78 : 1.0;

  return (
    <>
      <div className="stage">
        <div className="stars" />
        <div className="stars-2" />
        {t.starsExtra && <div className="stars-3" />}
        {t.smoke && <div className="smoke" />}
        <div className="vignette" />
      </div>

      <div className="header">
        <div className="header-subtitle">凝神靜心，將問題置於心中</div>
      </div>

      <main className={
        "app-main"
        + (hasDraws ? (panelOpen ? " has-rail-open" : " has-rail-collapsed") : " no-rail")
      }>
        <Board
          spread={spread}
          draws={draws}
          phase={phase}
          activeIdx={activeIdx}
          onCardClick={handleCardClick}
          onCardDoubleClick={handleCardDoubleClick}
          onStartDraw={startDraw}
          cardSize={cardSize}
          flippedCount={flippedCount}
          allFlipped={allFlipped}
          onFlipAll={flipAll}
          onReset={resetBoard}
        />

        <SideRail
          activeDraw={activeIdx != null ? draws[activeIdx] : null}
          activePos={activeIdx != null ? spread.positions[activeIdx] : null}
          panelOpen={panelOpen}
          hasDraws={hasDraws}
          onTogglePanel={() => setPanelOpen(v => !v)}
        />
      </main>

      {phase === "ready" && !hasDraws && (
        <SpreadPickerFloat
          spreadId={spreadId}
          spread={spread}
          onPick={pickSpread}
        />
      )}

      {phase === "shuffle" && <ShuffleOverlay />}

      {window.TweaksPanel && (
        <window.TweaksPanel title="氛圍與細節">
          <TweaksContent t={t} setTweak={setTweak} />
        </window.TweaksPanel>
      )}
    </>
  );
}

function Board({ spread, draws, phase, activeIdx, onCardClick, onCardDoubleClick, onStartDraw, cardSize, flippedCount, allFlipped, onFlipAll, onReset }) {
  const isCeltic = spread.id === "celtic";
  const hasDraws = draws.length > 0;

  return (
    <div className="board-wrap">
      <div className="board-meta">
        <div className="board-meta-en">{spread.sub} · {spread.count} {spread.count === 1 ? "Card" : "Cards"}</div>
        <div className="board-meta-cn">{spread.name}</div>
        <div className="board-meta-orn">
          <span /><span className="orn-glyph">✦</span><span />
        </div>
      </div>

      <div
        className={"board" + (isCeltic ? " is-celtic" : "")}
        style={{ height: isCeltic ? 580 : 460 }}
      >
        {!hasDraws && spread.positions.map((pos, i) => (
          <div
            key={"slot-" + i}
            className={"slot-placeholder" + (pos.overlay ? " is-overlay" : "")}
            style={{
              left: `${pos.x}%`,
              top: `${pos.y}%`,
              width: `${140 * cardSize}px`,
              height: `${228 * cardSize}px`,
              "--card-rot": `${pos.rot || 0}deg`,
              animationDelay: `${i * 80}ms`,
            }}
          >
            <div className="slot-inner" style={{ transform: `rotate(${pos.rot || 0}deg)` }}>
              <div className="slot-num">{i + 1}</div>
              <div className="slot-label" style={{ transform: pos.overlay ? `rotate(${-(pos.rot || 0)}deg)` : "none" }}>
                {pos.label}
              </div>
            </div>
          </div>
        ))}

        {hasDraws && draws.map((d, i) => {
          const pos = spread.positions[i];
          return (
            <window.TarotCard
              key={i + "-" + d.card.num}
              card={d.card}
              reversed={d.reversed}
              flipped={d.flipped}
              position={pos}
              label={pos.label}
              delay={i * 160}
              size={cardSize}
              focused={activeIdx === i}
              dimmed={activeIdx != null && activeIdx !== i}
              onFlip={() => onCardClick(i)}
              onDoubleFlip={() => onCardDoubleClick(i)}
            />
          );
        })}
      </div>

      {!hasDraws && phase !== "shuffle" && (
        <div className="board-cta">
          <button className="board-cta-btn" onClick={onStartDraw}>
            <span className="cta-rune">✦</span>
            <span>開始抽牌</span>
            <span className="cta-rune">✦</span>
          </button>
          <div className="board-cta-hint">點一下翻牌 ・ 點兩下查看牌義</div>
        </div>
      )}

      {hasDraws && phase === "reading" && (
        <BottomBar
          flippedCount={flippedCount}
          total={draws.length}
          allFlipped={allFlipped}
          onFlipAll={onFlipAll}
          onRedraw={onStartDraw}
          onReset={onReset}
        />
      )}
    </div>
  );
}

function SpreadPickerFloat({ spreadId, spread, onPick }) {
  const ids = ["single", "trinity", "core", "celtic"];
  return (
    <div className="spread-float">
      <div className="float-header">
        <div className="float-eyebrow">CHOOSE SPREAD</div>
        <div className="float-title">選擇牌陣</div>
        <div className="float-divider" />
      </div>
      <div className="float-list">
        {ids.map(id => {
          const s = SPREADS[id];
          const selected = id === spreadId;
          return (
            <button
              key={id}
              className={"float-pick" + (selected ? " is-selected" : "")}
              onClick={() => onPick(id)}
            >
              <div className="float-pick-radio"><span className="radio-dot" /></div>
              <div className="float-pick-info">
                <div className="float-pick-name">{s.name}</div>
                <div className="float-pick-sub">{s.sub} · {s.count} {s.count === 1 ? "Card" : "Cards"}</div>

              <div className="float-pick-mini"><SpreadDiagram id={id} /></div>
            </button>
          );
        })}
      </div>
      <div className="float-desc">{spread.desc}</div>
    </div>

}

function SideRail({ activeDraw, activePos, panelOpen, hasDraws, onTogglePanel }) {
  if (!hasDraws) return null;

  return (
    <aside className={"side-rail" + (panelOpen ? " is-open" : " is-collapsed")}>
      <button
        className="rail-toggle"
        onClick={onTogglePanel}
        title={panelOpen ? "收起" : "展開"}
      >
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path
            d={panelOpen ? "M9 6l6 6-6 6" : "M15 6l-6 6 6 6"}
            fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
          />
        </svg>
      </button>

      {!panelOpen && (
        <div className="rail-collapsed-label">
          <div className="rail-collapsed-title">牌義解讀</div>
        </div>
      )}

      {panelOpen && (
        <div className="rail-content">
          <div className="rail-section-title">
            <span>牌義解讀</span>
            <span className="rail-section-divider" />
          </div>
          {activeDraw && activeDraw.flipped ? (
            <CardDetail draw={activeDraw} position={activePos} />
          ) : (
            <div className="rail-empty">
              <div className="rail-empty-glyph">✦</div>
              <div className="rail-empty-text">

              </div>
            </div>
          )}
        </div>
      )}
    </aside>
  );
}

function CardDetail({ draw, position }) {
  const { card, reversed } = draw;
  return (
    <div className="card-detail">
      <div className="cd-position">{position.label}</div>
      <div className="cd-name">{card.name}</div>

function ShuffleOverlay() {
  return (
    <div className="shuffle-overlay">
      <div className="shuffle-stack">
        <div className="shuffle-card" />
        <div className="shuffle-card" />
        <div className="shuffle-card" />
        <div className="shuffle-card" />
        <div className="shuffle-card" />
      </div>
      <div className="shuffle-text">SHUFFLING THE DECK</div>

function TweaksContent({ t, setTweak }) {
  const { TweakSection, TweakToggle, TweakRadio } = window;
  return (
    <>
      <TweakSection title="氛圍">
        <TweakToggle label="額外星辰層" value={t.starsExtra} onChange={v => setTweak("starsExtra", v)} />
        <TweakToggle label="紫煙縈繞" value={t.smoke} onChange={v => setTweak("smoke", v)} />
      </TweakSection>
      <TweakSection title="色調">
        <TweakRadio
          label="主色調"
          value={t.mood}
          options={[
            { label: "深邃神秘", value: "deep" },
            { label: "靜謐冷峻", value: "cold" },
            { label: "古銅暖黃", value: "warm" },
          ]}
          onChange={v => { setTweak("mood", v); applyMood(v); }}
        />
      </TweakSection>
    </>
  );
}

function applyMood(mood) {
  const root = document.documentElement;
  if (mood === "cold") {
    root.style.setProperty("--bg-0", "#070a1f");
    root.style.setProperty("--bg-1", "#0d1330");
    root.style.setProperty("--bg-2", "#162247");
    root.style.setProperty("--gold", "#8ec3d8");
    root.style.setProperty("--gold-soft", "#6ea9c2");
    root.style.setProperty("--gold-glow", "rgba(142,195,216,0.45)");
  } else if (mood === "warm") {
    root.style.setProperty("--bg-0", "#1a1208");
    root.style.setProperty("--bg-1", "#2a1d10");
    root.style.setProperty("--bg-2", "#3a2814");
    root.style.setProperty("--gold", "#e6b97c");
    root.style.setProperty("--gold-soft", "#c89556");
    root.style.setProperty("--gold-glow", "rgba(230,185,124,0.55)");
  } else {
    root.style.setProperty("--bg-0", "#0b0820");
    root.style.setProperty("--bg-1", "#14102e");
    root.style.setProperty("--bg-2", "#1f1a44");
    root.style.setProperty("--gold", "#d6b06c");
    root.style.setProperty("--gold-soft", "#c89e58");
    root.style.setProperty("--gold-glow", "rgba(214,176,108,0.5)");
  }
}

setTimeout(() => {
  if (window.__TAROT_TWEAKS_DEFAULTS__?.mood) applyMood(window.__TAROT_TWEAKS_DEFAULTS__.mood);
}, 0);

window.App = App;

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<window.App />);
</script>

</body>
</html>
