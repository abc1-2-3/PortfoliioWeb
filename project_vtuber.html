<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吳言 WUYAN — Vtuber 虛擬主播 | WUYAN's ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Serif+TC:wght@200;300;400&display=swap" rel="stylesheet">
<!-- Live2D Cubism 4 Core -->
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<!-- PIXI.js v6 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>
<!-- pixi-live2d-display Cubism4 build -->
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
<!-- React 18 + Babel standalone -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;cursor:none!important}
html,body{width:100%;background:#04020e;color:#f5f0ff;font-family:'Noto Serif TC','Cormorant Garamond',serif;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}

/* ── Cursor ── */
#cursor-dot{position:fixed;width:6px;height:6px;border-radius:50%;background:#fff;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(255,180,220,.9)}
#cursor-ring{position:fixed;width:24px;height:24px;border-radius:50%;border:1px solid rgba(240,160,200,.4);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s}
body.hov #cursor-ring{width:40px;height:40px;border-color:rgba(240,160,205,.75);box-shadow:0 0 12px rgba(220,120,175,.22)}

/* ── Progress bar ── */
#prog{position:fixed;top:0;left:0;height:2px;width:0%;background:linear-gradient(to right,rgba(167,139,250,.4),rgba(240,171,252,.9),rgba(253,230,138,.7));z-index:9000;pointer-events:none;transition:width .1s linear}

/* ── Stars ── */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite var(--dl,0s)}
@keyframes twinkle{0%,100%{opacity:var(--a,.3)}50%{opacity:1}}

/* ── Sidebar ── */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;display:flex;flex-direction:column;border-right:1px solid rgba(167,139,250,.22);height:100vh;overflow:hidden;z-index:50;background:linear-gradient(to bottom,rgba(12,5,32,.80) 0%,rgba(14,6,40,.72) 48%,rgba(28,10,55,.55) 70%,rgba(28,10,55,.28) 88%,rgba(28,10,55,.06) 100%);backdrop-filter:blur(20px);transform:translateX(calc(-100% + 16px));transition:transform .38s cubic-bezier(.25,.46,.45,.94),box-shadow .38s}
#sidebar:hover{transform:translateX(0);box-shadow:4px 0 44px rgba(0,0,0,.75),0 0 0 1px rgba(167,139,250,.1)}
#sidebar::before{content:'';position:absolute;right:0;top:22%;bottom:22%;width:2px;background:linear-gradient(to bottom,transparent,rgba(167,139,250,.72) 40%,rgba(165,215,255,.58) 60%,transparent);border-radius:1px;transition:opacity .25s;pointer-events:none;z-index:2}
#sidebar:hover::before{opacity:0}
#sidebar::after{content:'';position:absolute;left:32px;top:72px;bottom:44px;width:1px;background:linear-gradient(to bottom,transparent,rgba(167,139,250,.15) 5%,rgba(196,181,253,.85) 50%,rgba(167,139,250,.15) 95%,transparent);box-shadow:0 0 6px rgba(167,139,250,.55)}
.sb-head{padding:20px 14px 16px 18px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid rgba(167,139,250,.12);flex-shrink:0}
.sb-cat{width:34px;height:34px;border:1px solid rgba(167,139,250,.42);border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(5,10,30,.6);flex-shrink:0;box-shadow:0 0 12px rgba(167,139,250,.22)}
.sb-cat img{width:22px;height:22px;filter:invert(1) sepia(1) saturate(3) hue-rotate(245deg);opacity:.85}
.sb-info{flex:1;min-width:0}
.sb-title{font:700 12px monospace;letter-spacing:3px;color:rgba(196,181,253,.88);text-transform:uppercase}
.sb-sub{font:400 10px monospace;color:rgba(74,66,100,.85);letter-spacing:2px;margin-top:3px}
.sb-pulse{display:flex;align-items:center;gap:5px;margin-top:8px}
.sb-dot{width:5px;height:5px;border-radius:50%;background:rgba(80,255,120,.7);animation:sbpulse 2s ease-in-out infinite;box-shadow:0 0 5px rgba(80,255,120,.4)}
@keyframes sbpulse{0%,100%{opacity:.6}50%{opacity:1}}
.sb-online{font:400 10px monospace;letter-spacing:2px;color:rgba(80,255,120,.58)}
nav{flex:1;padding:10px 0;overflow-y:auto}
nav::-webkit-scrollbar{width:0}
.ni{display:flex;align-items:center;gap:9px;padding:12px 14px 12px 50px;position:relative;transition:all .28s cubic-bezier(.25,.46,.45,.94);margin-bottom:4px;text-decoration:none;color:inherit}
.ni::before{content:'';position:absolute;left:29px;top:50%;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);border:1px solid rgba(167,139,250,.4);background:transparent;transition:all .28s ease}
.ni:hover::before{border-color:rgba(196,181,253,.88);box-shadow:0 0 8px rgba(196,181,253,.5)}
.ni.act::before{background:rgba(167,139,250,.18);border-color:rgba(196,181,253,.92);box-shadow:0 0 10px rgba(196,181,253,.6)}
.ni::after{content:'';position:absolute;left:29px;top:50%;width:4px;height:4px;transform:translate(-50%,-50%);border-radius:50%;background:transparent;transition:all .28s ease;pointer-events:none}
.ni:hover::after{background:rgba(196,181,253,.82);box-shadow:0 0 5px rgba(196,181,253,.6)}
.ni.act::after{background:rgba(255,255,255,.88);box-shadow:0 0 6px rgba(196,181,253,.8)}
.ni:hover,.ni.act{background:rgba(110,55,195,.14)}
.ni:hover{transform:translateX(4px)}
.ni.act{border-right:2px solid rgba(167,139,250,.68)}
.ni-icon{width:15px;height:15px;object-fit:contain;opacity:.70;filter:brightness(0) invert(1);transition:opacity .22s;flex-shrink:0}
.ni:hover .ni-icon,.ni.act .ni-icon{opacity:.95}
.ni-text{display:flex;flex-direction:column}
.ni-en{font:400 12px monospace;letter-spacing:2px;text-transform:uppercase;color:rgba(175,150,220,.78);transition:color .22s}
.ni-zh{font:400 11px monospace;color:rgba(160,142,205,.65);letter-spacing:1px;margin-top:2px;transition:color .22s}
.ni:hover .ni-en,.ni.act .ni-en{color:rgba(232,224,255,.97)}
.ni:hover .ni-zh,.ni.act .ni-zh{color:rgba(210,200,240,.88)}
.sb-footer{padding:14px 18px 18px 22px;background:transparent;flex-shrink:0}
.sb-footer-text{font:400 10px monospace;letter-spacing:1px;color:rgba(120,90,150,.45);line-height:1.6}

/* ── Page section nav (right side dots) ── */
#page-nav{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:0}
#page-nav::before{content:'';position:absolute;right:3px;top:14px;bottom:14px;width:1px;background:linear-gradient(to bottom,transparent,rgba(167,139,250,.2) 20%,rgba(167,139,250,.2) 80%,transparent);pointer-events:none}
.pn-item{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;text-decoration:none}
.pn-label{font:400 11px monospace;letter-spacing:.15em;text-transform:uppercase;color:rgba(196,181,253,.15);transform:translateX(6px);transition:color .2s,transform .2s;white-space:nowrap;user-select:none}
.pn-item:hover .pn-label{color:rgba(196,181,253,.85);transform:translateX(0)}
.pn-item.act .pn-label{color:rgba(196,181,253,.68);transform:translateX(0)}
.pn-node{width:7px;height:7px;transform:rotate(45deg);border:1px solid rgba(167,139,250,.28);background:transparent;transition:all .25s;flex-shrink:0}
.pn-item:hover .pn-node{border-color:rgba(196,181,253,.82);background:rgba(167,139,250,.35);box-shadow:0 0 8px rgba(167,139,250,.45)}
.pn-item.act .pn-node{border-color:rgba(196,181,253,.9);background:rgba(167,139,250,.72);box-shadow:0 0 10px rgba(196,181,253,.65),0 0 22px rgba(167,139,250,.3)}

/* ═══════════════════════════════════════════════
   Design-draft styles (styles.css, adapted)
   ═══════════════════════════════════════════════ */
:root{
  --bg-void:#07041a;--bg-deep:#0d0726;--bg-panel:#150a35;
  --bg-glass:rgba(20,10,50,.55);
  --neon-violet:#a78bfa;--neon-magenta:#f0abfc;--neon-cyan:#22d3ee;
  --neon-amber:#fde68a;--neon-rose:#fda4af;
  --rune-gold:#d4a45c;--rune-blue:#6ea8ff;
  --ink-100:#f5f0ff;--ink-300:#c8bfe7;--ink-500:#8a7fb8;--ink-700:#4d4470;
  --line-soft:rgba(167,139,250,.18);--line-strong:rgba(167,139,250,.45);
  --font-display:'Cinzel','Noto Serif TC',serif;
  --font-serif:'Noto Serif TC','Cormorant Garamond',serif;
  --font-mono:'JetBrains Mono','Courier New',monospace;
  --font-rune:'Cinzel Decorative','Cinzel',serif;
}

/* ambient backdrop */
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%,rgba(167,139,250,.18),transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 30%,rgba(240,171,252,.12),transparent 60%),
    radial-gradient(ellipse 70% 50% at 50% 100%,rgba(34,211,238,.10),transparent 60%),
    #04020e;
  z-index:-2;pointer-events:none}

/* grid */
body::after{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:48px 48px;z-index:-1;pointer-events:none;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 90%)}

/* scanlines override */
body.scanlines::after{
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.015) 0,rgba(255,255,255,.015) 1px,transparent 1px,transparent 3px);
  z-index:9999;mix-blend-mode:overlay}

/* typography */
h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;letter-spacing:.04em;margin:0}
.mono{font-family:var(--font-mono)}
.rune{font-family:var(--font-rune);letter-spacing:.18em}

/* layout */
.page{position:relative;width:100%;max-width:1440px;margin:0 auto;padding:0 48px}
section{position:relative;padding:0;border-top:1px solid var(--line-soft)}
section:first-of-type{border-top:none}
section.page{padding-top:128px;padding-bottom:128px}

/* eyebrow */
.section-eyebrow{display:flex;align-items:center;gap:14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.3em;color:var(--neon-violet);text-transform:uppercase;margin-bottom:18px}
.section-eyebrow::before{content:'';width:28px;height:1px;background:linear-gradient(to right,transparent,var(--neon-violet))}
.section-eyebrow .idx{color:var(--ink-500)}
.section-title{font-family:var(--font-display);font-size:clamp(38px,4.4vw,64px);font-weight:500;line-height:1.05;margin-bottom:12px;background:linear-gradient(180deg,#fff 0%,#c8bfe7 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.section-subtitle{font-family:var(--font-mono);font-size:12px;color:var(--ink-500);letter-spacing:.15em;text-transform:uppercase;margin-bottom:56px}

/* panel chrome */
.panel{position:relative;background:var(--bg-glass);border:1px solid var(--line-soft);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.panel.crt{background:linear-gradient(180deg,rgba(167,139,250,.04) 0%,rgba(7,4,26,.6) 100%);border:1px solid var(--line-strong);box-shadow:inset 0 0 60px rgba(167,139,250,.05),0 0 0 1px rgba(0,0,0,.5),0 30px 60px -20px rgba(0,0,0,.8)}
.panel.bracketed::before,.panel.bracketed::after{content:'';position:absolute;width:18px;height:18px;border:1px solid var(--neon-violet);pointer-events:none}
.panel.bracketed::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.panel.bracketed::after{bottom:-1px;right:-1px;border-left:none;border-top:none}
.term-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line-soft);font-family:var(--font-mono);font-size:11px;color:var(--ink-300);letter-spacing:.1em}
.term-bar .dots{display:flex;gap:6px}
.term-bar .dots span{width:8px;height:8px;border-radius:50%;background:var(--ink-700)}
.term-bar .dots span:nth-child(1){background:var(--neon-magenta)}
.term-bar .dots span:nth-child(2){background:var(--neon-amber)}
.term-bar .dots span:nth-child(3){background:var(--neon-cyan)}

/* buttons / chips */
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;background:transparent;color:var(--ink-100);border:1px solid var(--line-strong);transition:all .25s;text-decoration:none;position:relative}
.btn:hover{border-color:var(--neon-violet);background:rgba(167,139,250,.08);box-shadow:0 0 20px rgba(167,139,250,.25);color:var(--neon-magenta)}
.btn.primary{background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(240,171,252,.15));border-color:var(--neon-violet);color:#fff}
.chip{display:inline-flex;align-items:center;padding:4px 10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;border:1px solid var(--line-soft);color:var(--ink-300);background:rgba(167,139,250,.05)}

/* ── Hero ── */
.hero{min-height:100vh;padding:0;border-top:none;display:flex;align-items:center;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-image:url('assets/vtuber/hero-reference.webp');background-size:cover;background-position:center;filter:saturate(1.1);opacity:.55}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,4,26,.4) 0%,rgba(7,4,26,.7) 60%,#04020e 100%),radial-gradient(ellipse at 50% 60%,transparent 30%,rgba(7,4,26,.6) 80%)}
.hero-content{position:relative;width:100%;max-width:1440px;margin:0 auto;padding:0 48px;display:grid;grid-template-columns:1.4fr 1fr;gap:80px;align-items:center;z-index:2}
.hero-meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.3em;color:var(--neon-violet);text-transform:uppercase;display:flex;gap:24px;margin-bottom:24px}
.hero-meta span:not(:first-child)::before{content:'◆';margin-right:24px;color:var(--ink-700)}
.hero h1{font-family:'Noto Serif TC',serif;font-size:clamp(54px,7vw,108px);line-height:1;font-weight:200;margin:0 0 8px}
.hero h1 .name-cn{display:block;background:linear-gradient(135deg,#fff 0%,#f0abfc 50%,#a78bfa 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:'Noto Serif TC',serif;font-weight:200;letter-spacing:.1em}
.hero h1 .name-en{display:block;font-family:'Noto Serif TC',serif;font-size:.3em;letter-spacing:.45em;color:rgba(200,191,231,.75);font-weight:200;margin-top:18px;font-style:normal}
.hero-tag{font-family:'Noto Serif TC',serif;font-size:16px;font-style:normal;font-weight:300;color:var(--ink-300);max-width:520px;margin:28px 0 40px;line-height:2;letter-spacing:.05em}
.hero-tag .accent{color:var(--neon-magenta)}
.hero-actions{display:flex;gap:16px}
.hero-spec .spec-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.3em;color:var(--ink-500);margin-bottom:6px}
.hero-spec .spec-value{font-family:var(--font-display);font-size:18px;color:var(--ink-100);margin-bottom:18px}
.hero-runes{position:absolute;right:48px;top:50%;transform:translateY(-50%);width:320px;height:320px;pointer-events:none;opacity:.5}
@keyframes rune-spin{to{transform:rotate(360deg)}}
.rune-ring{animation:rune-spin 80s linear infinite;transform-origin:center}
.rune-ring.reverse{animation-direction:reverse;animation-duration:60s}
.cursor-blink{animation:cblink 1s steps(2) infinite}
@keyframes cblink{50%{opacity:0}}

/* ── Profile ── */
.profile-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:60px;align-items:start}
.profile-portrait{position:relative;aspect-ratio:3/4;border:1px solid var(--line-strong);background:linear-gradient(135deg,rgba(167,139,250,.05),rgba(34,211,238,.05)),repeating-linear-gradient(45deg,rgba(167,139,250,.04) 0 2px,transparent 2px 14px);display:flex;align-items:center;justify-content:center}
.placeholder-label{font-family:var(--font-mono);font-size:11px;color:var(--neon-violet);letter-spacing:.2em;text-align:center;padding:0 20px}
.placeholder-label::before{content:'◇ '}
.profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line-soft)}
.stat{padding:22px 24px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.stat:nth-child(2n){border-right:none}
.stat .stat-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.25em;color:var(--ink-500);text-transform:uppercase;margin-bottom:8px}
.stat .stat-value{font-family:var(--font-display);font-size:22px;color:var(--ink-100);font-weight:500}
.stat .stat-value.small{font-size:16px;font-family:var(--font-serif)}
.story-block{margin-top:40px;padding:28px;border:1px solid var(--line-soft);background:rgba(13,7,38,.5);font-family:var(--font-serif);line-height:1.85;color:var(--ink-300);font-size:15px;position:relative}
.story-block .quote-mark{position:absolute;top:-14px;left:24px;background:#04020e;padding:0 12px;font-family:var(--font-rune);font-size:14px;color:var(--neon-violet);letter-spacing:.3em}

/* ── Concept ── */
.concept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.concept-card{border:1px solid var(--line-soft);padding:32px;background:rgba(13,7,38,.5);position:relative}
.concept-card .num{font-family:var(--font-display);font-size:56px;color:var(--neon-violet);opacity:.4;font-weight:300;line-height:1}
.concept-card h4{font-family:var(--font-display);font-size:22px;margin:12px 0;color:var(--ink-100)}
.concept-card p{font-family:var(--font-serif);font-size:14px;line-height:1.8;color:var(--ink-300);margin:0}

/* ── Modeling / Live2D ── */
.modeling-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:start}
.modeling-sticky{position:sticky;top:96px;align-self:start}
.modeling-right-stack{display:flex;flex-direction:column;gap:24px;min-width:0}
.modeling-right-stack .layer-tree{max-height:320px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--neon-violet) transparent}
.modeling-right-stack .layer-tree::-webkit-scrollbar{width:6px}
.modeling-right-stack .layer-tree::-webkit-scrollbar-thumb{background:rgba(167,139,250,.4);border-radius:3px}
.live2d-stage{position:relative;border:1px solid var(--line-strong);aspect-ratio:4/5;background:radial-gradient(ellipse at 50% 60%,rgba(167,139,250,.15),transparent 60%),repeating-linear-gradient(45deg,rgba(167,139,250,.04) 0 2px,transparent 2px 14px),var(--bg-deep);overflow:hidden}
.live2d-stage .stage-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(167,139,250,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(167,139,250,.1) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;opacity:.4}
.live2d-stage .stage-axis{position:absolute;top:50%;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,var(--neon-violet),transparent);opacity:.4}
.live2d-stage .stage-axis.v{top:0;bottom:0;left:50%;width:1px;height:auto;background:linear-gradient(to bottom,transparent,var(--neon-violet),transparent)}
.layer-tree{background:var(--bg-deep);border:1px solid var(--line-soft);font-family:var(--font-mono);font-size:12px}
.layer-tree-header{padding:10px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink-300);letter-spacing:.15em;font-size:10px;text-transform:uppercase;display:flex;justify-content:space-between}
.layer{display:flex;align-items:center;gap:8px;padding:6px 14px;color:var(--ink-300);transition:background .15s;position:relative}
.layer:hover{background:rgba(167,139,250,.08);color:var(--ink-100)}
.layer.active{background:rgba(167,139,250,.15);color:var(--neon-magenta)}
.layer.folder{color:var(--neon-amber);font-weight:500}
.layer .indent{display:inline-block;width:12px}
.layer .icon{width:12px;height:12px;border:1px solid currentColor;display:inline-block;flex-shrink:0}
.layer .icon.folder-i{background:currentColor;opacity:.4}
.layer .visibility{margin-left:auto;font-size:10px;opacity:.5}

/* ── Webcam ── */
.webcam-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:stretch}
.webcam-feed,.webcam-output{aspect-ratio:4/3;border:1px solid var(--line-strong);position:relative;background:radial-gradient(ellipse at center,rgba(167,139,250,.1),transparent 70%),var(--bg-deep);overflow:hidden;display:flex;align-items:center;justify-content:center}
.webcam-feed video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.webcam-feed .scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,var(--neon-cyan),transparent);box-shadow:0 0 20px var(--neon-cyan);animation:scan-v 3s linear infinite}
@keyframes scan-v{0%{top:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
.webcam-status{position:absolute;top:12px;left:12px;font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--neon-cyan);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.webcam-status .dot{width:6px;height:6px;border-radius:50%;background:var(--neon-cyan);animation:wpulse 1.4s ease-in-out infinite}
.webcam-status.live .dot{background:var(--neon-magenta)}
.webcam-status.live{color:var(--neon-magenta)}
@keyframes wpulse{0%,100%{opacity:1;box-shadow:0 0 8px currentColor}50%{opacity:.4}}

/* ── Channel ── */
.channel-card{border:1px solid var(--line-strong);padding:40px;background:linear-gradient(135deg,rgba(167,139,250,.06),rgba(240,171,252,.04));position:relative}
.channel-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:40px}
.stream-card{border:1px solid var(--line-soft);aspect-ratio:16/9;position:relative;display:flex;align-items:flex-end;padding:16px;transition:all .3s;overflow:hidden;background:#07041a}
.stream-card::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(7,4,26,.92) 0%,rgba(7,4,26,.3) 55%,rgba(7,4,26,.08) 100%);z-index:2;pointer-events:none}
.stream-card:hover{border-color:var(--neon-violet);box-shadow:0 10px 40px -10px rgba(167,139,250,.4)}
.stream-card .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s ease;z-index:0}
.stream-card .thumb-hover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease;z-index:1}
.stream-card:hover .thumb{opacity:0}
.stream-card:hover .thumb-hover{opacity:1}
.stream-card .label{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--ink-100);text-transform:uppercase;position:relative;z-index:3}
.stream-card .duration{position:absolute;top:12px;right:12px;font-family:var(--font-mono);font-size:10px;color:var(--neon-amber);background:rgba(0,0,0,.7);padding:2px 6px;z-index:3}

/* ── Topnav (from React component) ── */
.topnav{position:fixed;top:0;left:0;right:0;z-index:45;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 48px;background:linear-gradient(180deg,rgba(4,2,14,.88) 0%,rgba(4,2,14,.52) 65%,transparent 100%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topnav .brand{font-family:var(--font-rune);font-size:14px;letter-spacing:.3em;color:rgba(240,165,205,.92)}
.topnav .nav-links{display:flex;gap:32px;font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.topnav .nav-links a{color:var(--ink-300);text-decoration:none;transition:color .2s}
.topnav .nav-links a:hover{color:rgba(240,165,205,.92)}
.topnav .crumb{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--ink-500);text-transform:uppercase;justify-self:end;text-align:right}
.topnav .crumb .sep{color:var(--ink-700);margin:0 10px}
.topnav .crumb .current{color:rgba(240,165,205,.92)}

/* ── Footer ── */
footer{padding:60px 48px;border-top:1px solid var(--line-soft);font-family:var(--font-mono);font-size:11px;letter-spacing:.15em;color:var(--ink-500);display:flex;justify-content:space-between;align-items:center}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ── Character portrait: blink + petals ── */
#char-blink{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block;opacity:0;transition:opacity .06s ease;pointer-events:none}
.char-petal{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;pointer-events:none;opacity:.82}
.char-petal[data-p="1"]{animation:petalDrift1 7s ease-in-out infinite}
.char-petal[data-p="2"]{animation:petalDrift2 9s ease-in-out infinite;animation-delay:-3.2s}
.char-petal[data-p="3"]{animation:petalDrift3 6.2s ease-in-out infinite;animation-delay:-1.6s}
@keyframes petalDrift1{0%,100%{transform:translate(0,0)}35%{transform:translate(5px,-9px)}68%{transform:translate(-4px,6px)}}
@keyframes petalDrift2{0%,100%{transform:translate(0,0)}42%{transform:translate(-6px,-7px)}74%{transform:translate(4px,9px)}}
@keyframes petalDrift3{0%,100%{transform:translate(0,0)}28%{transform:translate(3px,-11px)}70%{transform:translate(-5px,5px)}}

<!-- ── runes ── -->
<script type="text/babel">
const RuneRing=({size=320,reverse=false})=>{
  const runes=['✦','◇','☾','✧','◈','⟁','✺','◊','☆','◯','⬢','✶'];
  const cx=size/2,cy=size/2,r1=size*.46,r2=size*.38;
  return(<svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{overflow:'visible'}}>
    <defs><radialGradient id="rune-glow"><stop offset="0%" stopColor="rgba(167,139,250,0.3)"/><stop offset="100%" stopColor="rgba(167,139,250,0)"/></radialGradient></defs>
    <circle cx={cx} cy={cy} r={size*.5} fill="url(#rune-glow)"/>
    <g className={`rune-ring${reverse?' reverse':''}`} style={{transformOrigin:`${cx}px ${cy}px`}}>
      <circle cx={cx} cy={cy} r={r1} fill="none" stroke="rgba(167,139,250,0.4)" strokeWidth="1" strokeDasharray="2 6"/>
      <circle cx={cx} cy={cy} r={r1-8} fill="none" stroke="rgba(240,171,252,0.2)" strokeWidth="0.5"/>
      {runes.map((rune,i)=>{const a=(i/runes.length)*Math.PI*2-Math.PI/2;return(<text key={i} x={cx+Math.cos(a)*r1} y={cy+Math.sin(a)*r1} textAnchor="middle" dominantBaseline="middle" fill="rgba(240,171,252,0.7)" fontSize="14" fontFamily="Cinzel Decorative">{rune}</text>)})}
    </g>
    <g className="rune-ring reverse" style={{transformOrigin:`${cx}px ${cy}px`}}>
      <circle cx={cx} cy={cy} r={r2} fill="none" stroke="rgba(34,211,238,0.3)" strokeWidth="0.5"/>
      {[...Array(24)].map((_,i)=>{const a=(i/24)*Math.PI*2,x1=cx+Math.cos(a)*(r2-4),y1=cy+Math.sin(a)*(r2-4),x2=cx+Math.cos(a)*(r2+4),y2=cy+Math.sin(a)*(r2+4);return<line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="rgba(34,211,238,0.3)" strokeWidth="0.5"/>})}
    </g>
    <g opacity="0.5">
      <polygon points={[0,1,2,3,4].map(i=>{const a=(i/5)*Math.PI*2-Math.PI/2;return`${cx+Math.cos(a)*40},${cy+Math.sin(a)*40}`}).join(' ')} fill="none" stroke="rgba(240,171,252,0.5)" strokeWidth="0.5"/>
    </g>
  </svg>);
};
window.RuneRing=RuneRing;

<!-- ── live2d-stage ── -->
<script type="text/babel">
const MODEL_PATH='assets/vtuber/live2d/wuyan.model3.json';
const LIVE2D_EXPRESSIONS=[
  {name:'xinxin',label:'✦',cn:'閃閃眼'},{name:'crycry',label:'⟁',cn:'哭哭'},
  {name:'fuwafuwa',label:'☁',cn:'軟軟'},{name:'petal',label:'✿',cn:'花瓣'},
  {name:'loading',label:'◌',cn:'讀取'},{name:'dazweye',label:'◉',cn:'呆滯'},
  {name:'芙莉蓮表情',label:'☾',cn:'芙莉蓮'},{name:'貓耳',label:'◑',cn:'貓耳'},
  {name:'骨頭帽子',label:'✟',cn:'骨頭帽'},{name:'藍色頭髮',label:'✦',cn:'藍髮'},
  {name:'臉黑',label:'▮',cn:'臉黑'},{name:'數學思考',label:'Σ',cn:'思考'},
  {name:'手把切換',label:'◈',cn:'手把'},{name:'脫外套',label:'⌬',cn:'脫外套'},
];
const VIEW_PRESETS={full:{scale:1.00,yFrac:0.00},upper:{scale:2.20,yFrac:0.50},face:{scale:4.20,yFrac:1.45}};
const Live2DCanvas=React.forwardRef(({yOffset=0,fitScale=0.95,initialView='full',onReady,style},ref)=>{
  const containerRef=React.useRef(null);
  const[status,setStatus]=React.useState('idle');
  const[error,setError]=React.useState(null);
  const overridesRef=React.useRef({});
  const modelRef=React.useRef(null);
  const appRef=React.useRef(null);
  const fitRef=React.useRef(null);
  const viewRef=React.useRef(initialView);
  const[activeExpression,setActiveExpression]=React.useState(null);
  React.useImperativeHandle(ref,()=>({
    setParam:(id,v)=>{overridesRef.current[id]=v},
    clearParam:(id)=>{delete overridesRef.current[id]},
    clearAllParams:()=>{overridesRef.current={}},
    setExpression:(name)=>{const m=modelRef.current;if(!m)return;try{if(name){m.expression(name);setActiveExpression(name)}else{m.internalModel.motionManager.expressionManager?.resetExpression();setActiveExpression(null)}}catch(e){console.warn('expression failed',e)}},
    getActiveExpression:()=>activeExpression,
    playMotion:(group='Idle')=>{try{modelRef.current?.motion(group)}catch(e){}},
    refit:()=>fitRef.current&&fitRef.current(),
    setView:(preset)=>{if(VIEW_PRESETS[preset]){viewRef.current=preset;fitRef.current&&fitRef.current()}},
    getView:()=>viewRef.current,
    getModel:()=>modelRef.current,
    getStatus:()=>status,
  }),[activeExpression,status]);
  React.useEffect(()=>{
    if(!containerRef.current)return;
    let cancelled=false,pollId,ro;
    const mount=async()=>{
      const el=containerRef.current;if(!el||cancelled)return;
      const w=el.clientWidth,h=el.clientHeight;
      if(w<20||h<20){pollId=setTimeout(mount,100);return}
      if(!window.PIXI||!window.PIXI.live2d){setStatus('error');setError('Live2D SDK 未載入');return}
      setStatus('loading');
      try{
        const PIXI=window.PIXI;const{Live2DModel}=PIXI.live2d;
        Live2DModel.registerTicker(PIXI.Ticker);
        const app=new PIXI.Application({width:w,height:h,backgroundAlpha:0,antialias:true,autoDensity:true,resolution:window.devicePixelRatio||1,preserveDrawingBuffer:true});
        el.appendChild(app.view);app.view.style.width='100%';app.view.style.height='100%';app.view.style.display='block';
        appRef.current=app;
        const m=await Live2DModel.from(MODEL_PATH,{autoInteract:false});
        if(cancelled){app.destroy(true);return}
        app.stage.addChild(m);modelRef.current=m;
        const fit=()=>{
          const W=app.renderer.width/app.renderer.resolution,H=app.renderer.height/app.renderer.resolution;
          const bw=m.internalModel.width||m.width||1,bh=m.internalModel.height||m.height||1;
          const baseS=Math.min(W/bw,H/bh)*fitScale;
          const vp=VIEW_PRESETS[viewRef.current]||VIEW_PRESETS.full;
          m.scale.set(baseS*vp.scale);m.anchor.set(0.5,0.5);m.x=W/2;m.y=H/2+yOffset+H*vp.yFrac;m.alpha=1;m.visible=true;
        };
        fitRef.current=fit;fit();setTimeout(fit,200);setTimeout(fit,600);
        ro=new ResizeObserver(()=>{const cw=el.clientWidth,ch=el.clientHeight;if(cw&&ch){app.renderer.resize(cw,ch);fit()}});ro.observe(el);
        app.ticker.add(()=>{const core=m.internalModel?.coreModel;if(core){const o=overridesRef.current;for(const id in o){try{core.setParameterValueById(id,o[id])}catch(e){}}}app.renderer.render(app.stage)});
        if(!app.ticker.started)app.ticker.start();
        setStatus('ready');if(onReady)onReady();
      }catch(e){console.error('Live2D load error:',e);setStatus('error');setError(e.message||String(e))}
    };
    mount();
    return()=>{cancelled=true;if(pollId)clearTimeout(pollId);if(ro)ro.disconnect();if(appRef.current){try{appRef.current.destroy(true,{children:true})}catch(e){}appRef.current=null}modelRef.current=null};
  },[]);
  return(<div ref={containerRef} style={{position:'relative',width:'100%',height:'100%',overflow:'hidden',...style}}>
    {status==='loading'&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12,fontFamily:'var(--font-mono)',fontSize:11,color:'var(--neon-violet)',letterSpacing:'0.25em',pointerEvents:'none',zIndex:1}}>
      <div style={{animation:'rune-spin 2s linear infinite',fontSize:24}}>◇</div>
      <div>CONJURING MODEL · 召 喚 中</div>
      <div style={{fontSize:9,color:'var(--ink-500)'}}>loading wuyan.moc3 + 3 textures</div>
    </div>}
    {status==='error'&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',padding:20,fontFamily:'var(--font-mono)',fontSize:11,color:'var(--neon-rose)',textAlign:'center',zIndex:1}}>
      ⚠ Live2D 載入失敗<br/><span style={{fontSize:9,color:'var(--ink-500)',marginTop:8}}>{error}</span>
    </div>}
  </div>);
});
window.Live2DCanvas=Live2DCanvas;
window.LIVE2D_EXPRESSIONS=LIVE2D_EXPRESSIONS;
</script>

<!-- ── hero ── -->

<!-- ── drawing ── -->
<script type="text/babel">
const STAGE2_LAYERS=[
  {name:'head',     file:'head_1.png',             order:1, label:'頭部',  en:'Head'},
  {name:'eyebrow',  file:'Eyebrow_2.png',           order:2, label:'眉毛',  en:'Eyebrow'},
  {name:'eyes',     file:'Eyes_3.png',              order:3, label:'眼睛',  en:'Eyes'},
  {name:'nose',     file:'Nose_3.png',              order:3, label:'鼻子',  en:'Nose'},
  {name:'mouth',    file:'Mouth_4.png',             order:4, label:'嘴巴',  en:'Mouth'},
  {name:'facebase', file:'FaceBace_5.png',          order:5, label:'臉底',  en:'Face Base'},
  {name:'s_hair',   file:'BesideDownHair_6.png',    order:6, label:'側髮',  en:'Side Hair'},
  {name:'h_hdl',    file:'M_rise_hand_handle_6.png',order:6, label:'手把',  en:'Hand Handle'},
  {name:'f_jacket', file:'Front_jacket_7.png',      order:7, label:'外套前', en:'Front Jacket'},
  {name:'dress',    file:'Dress_8.png',             order:8, label:'裙裝',  en:'Dress'},
  {name:'l_finger', file:'Left_finger_9.png',       order:9, label:'左手指', en:'Left Finger'},
  {name:'r_finger', file:'Right_finger_9.png',      order:9, label:'右手指', en:'Right Finger'},
  {name:'l_arm',    file:'Left_arm_10.png',         order:10,label:'左手臂', en:'Left Arm'},
  {name:'r_arm',    file:'Right_arm_10.png',        order:10,label:'右手臂', en:'Right Arm'},
  {name:'l_leg',    file:'Left_Leg_11.png',         order:11,label:'左腿',  en:'Left Leg'},
  {name:'r_leg',    file:'Right_Leg_11.png',        order:11,label:'右腿',  en:'Right Leg'},
  {name:'neck',     file:'Neck_12.png',             order:12,label:'脖子',  en:'Neck'},
  {name:'b_skirt',  file:'back_skirt_13.png',       order:13,label:'裙背',  en:'Back Skirt'},
  {name:'j_back',   file:'jacketBack_14.png',       order:14,label:'外套背', en:'Jacket Back'},
  {name:'b_hair',   file:'Back_hair_15.png',        order:15,label:'後髮',  en:'Back Hair'},
  {name:'fuwafuwa', file:'fuwafuwa.png',            order:16,label:'光效',  en:'Glow FX'},
  {name:'kirakira', file:'kirakira.png',            order:17,label:'閃亮',  en:'Sparkle FX'},
];

const Drawing=()=>{
  const[activeStage,setActiveStage]=React.useState(0);
  const[lightbox,setLightbox]=React.useState(null);
  const[lbScale,setLbScale]=React.useState(1);
  const[lbPan,setLbPan]=React.useState({x:0,y:0});
  const lbDragRef=React.useRef(null);
  const lbMovedRef=React.useRef(false);
  const lbRef=React.useRef(null);
  const[imgScale,setImgScale]=React.useState(1);
  const[imgPan,setImgPan]=React.useState({x:0,y:0});
  const imgDragRef=React.useRef(null);
  const imgMovedRef=React.useRef(false);
  const imgBoxRef=React.useRef(null);
  const[offsets,setOffsets]=React.useState({});
  const[dragInfo,setDragInfo]=React.useState(null);
  const[selLayer,setSelLayer]=React.useState(null);
  const[fanMode,setFanMode]=React.useState(false);
  const hasIntroRef=React.useRef(false);
  const[showIntroHint,setShowIntroHint]=React.useState(false);

  React.useEffect(()=>{
    if(!lightbox)return;
    const el=lbRef.current;if(!el)return;
    const onWheel=e=>{e.preventDefault();setLbScale(s=>Math.max(.35,Math.min(8,s*(e.deltaY>0?.88:1.14))))};
    const onKey=e=>{if(e.key==='Escape')setLightbox(null)};
    el.addEventListener('wheel',onWheel,{passive:false});
    document.addEventListener('keydown',onKey);
    return()=>{el.removeEventListener('wheel',onWheel);document.removeEventListener('keydown',onKey)};
  },[lightbox]);

  React.useEffect(()=>{
    if(activeStage===1)return;
    const el=imgBoxRef.current;if(!el)return;
    const onWheel=e=>{e.preventDefault();setImgScale(s=>Math.max(1,Math.min(6,s*(e.deltaY>0?.88:1.14))))};
    el.addEventListener('wheel',onWheel,{passive:false});
    return()=>el.removeEventListener('wheel',onWheel);
  },[activeStage]);

  React.useEffect(()=>{setImgScale(1);setImgPan({x:0,y:0})},[activeStage]);
  React.useEffect(()=>{if(activeStage!==1)setSelLayer(null)},[activeStage]);

  React.useEffect(()=>{
    if(!dragInfo)return;
    const onMove=e=>{
      const dx=e.clientX-dragInfo.sx,dy=e.clientY-dragInfo.sy;
      setOffsets(p=>({...p,[dragInfo.name]:{x:dragInfo.ox+dx,y:dragInfo.oy+dy}}));
    };
    const onUp=()=>setDragInfo(null);
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    return()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp)};
  },[dragInfo]);

  React.useEffect(()=>{
    if(activeStage!==1||hasIntroRef.current)return;
    hasIntroRef.current=true;
    setShowIntroHint(true);
    const o={};STAGE2_LAYERS.forEach((l,i)=>{o[l.name]={x:(i-11)*26,y:(i%5-2)*18}});
    setOffsets(o);setFanMode(true);
    const t1=setTimeout(()=>{setOffsets({});setFanMode(false)},1800);
    const t2=setTimeout(()=>setShowIntroHint(false),2600);
    return()=>{clearTimeout(t1);clearTimeout(t2)};
  },[activeStage]);

  const openLb=src=>{setLightbox(src);setLbScale(1);setLbPan({x:0,y:0})};
  const toggleFan=()=>{
    if(fanMode){setOffsets({});setFanMode(false)}
    else{const o={};STAGE2_LAYERS.forEach((l,i)=>{o[l.name]={x:i*18,y:i*5}});setOffsets(o);setFanMode(true)}
  };
  const resetAll=()=>{setOffsets({});setFanMode(false);setSelLayer(null)};
  const startDrag=(e,layer)=>{
    e.preventDefault();e.stopPropagation();
    setSelLayer(layer.name);
    setDragInfo({name:layer.name,sx:e.clientX,sy:e.clientY,ox:offsets[layer.name]?.x||0,oy:offsets[layer.name]?.y||0});
  };

  const stages=[
    {label:'stage_01',title:'原稿繪製',en:'ILLUSTRATION',
     desc:'從草稿、線稿到完稿一氣呵成。色彩、光影、特效都在這個階段定調。',
     parts:['草稿 SKETCH','線稿 LINEART','平塗 FLAT','上色 RENDER','光影 EFFECT'],density:'主視覺 · 約 18 hrs'},
    {label:'stage_02',title:'結構拆件',en:'PART SEPARATION',
     desc:'為了讓 Live2D 能動，必須拆成數百個獨立部件 — 每一綹頭髮、眼皮、嘴唇都要分開命名，並補繪被遮住的後方。',
     parts:['Head / Face','Hair × 多層','Body / Arms','Accessories','補繪遮蓋'],density:'PSD 圖層 · 22 parts'},
    {label:'stage_03',title:'建模綁定',en:'RIGGING',
     desc:'匯入 PSD → 為每個部件加變形器 → 設定 200+ 參數 → 用 physics3.json 描述頭髮、配件的物理擺動。',
     parts:['Deformer','Parameter','Physics','Expression × 14'],density:'Live2D Cubism · 約 60 hrs'},
  ];
  const cur=stages[activeStage];
  const stageImg=`assets/vtuber/paint/stage${activeStage===0?1:3}.png`;

  return(<section className="page" id="drawing">
    <div className="section-eyebrow"><span className="idx">04</span><span>illustration.process</span></div>
    <h2 className="section-title">繪製過程<br/><span style={{color:'var(--ink-500)',fontSize:'0.5em',letterSpacing:'0.3em'}}>CLIP STUDIO PAINT → LIVE2D</span></h2>
    <div className="section-subtitle">// 從原稿到模型 · 三個製作階段</div>

    <div style={{display:'grid',gridTemplateColumns:`repeat(${stages.length},1fr)`,gap:8,marginBottom:24}}>
      {stages.map((s,i)=>(
        <button key={i} onClick={()=>setActiveStage(i)} style={{padding:'14px 16px',textAlign:'left',background:activeStage===i?'rgba(167,139,250,.1)':'rgba(13,7,38,.5)',border:`1px solid ${activeStage===i?'var(--neon-violet)':'var(--line-soft)'}`,color:'inherit',transition:'all .2s'}}>
          <div style={{fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'0.25em',color:activeStage===i?'var(--neon-magenta)':'var(--ink-500)',marginBottom:6}}>{s.label.toUpperCase()}</div>
          <div style={{fontFamily:'var(--font-display)',fontSize:16,color:'var(--ink-100)',marginBottom:4}}>{s.title}</div>
          <div style={{fontFamily:'var(--font-mono)',fontSize:9,color:'var(--ink-500)',letterSpacing:'0.1em'}}>{s.density}</div>
        </button>
      ))}
    </div>

    {/* Stage 1 & 3 — image + info */}
    {activeStage!==1&&<div style={{display:'grid',gridTemplateColumns:'1fr 360px',gap:32,alignItems:'start'}}>
      <div>
        <div ref={imgBoxRef} style={{position:'relative',border:'1px solid var(--line-strong)',overflow:'hidden',background:'#04020e',display:'flex',alignItems:'center',justifyContent:'center',aspectRatio:'16/9'}}>
          <img src={stageImg}
            style={{maxWidth:'100%',maxHeight:'100%',display:'block',
              transform:`scale(${imgScale}) translate(${imgPan.x/imgScale}px,${imgPan.y/imgScale}px)`,
              transformOrigin:'center',userSelect:'none',
              cursor:imgScale>1?'grab':'zoom-in',
            }}
            onMouseDown={e=>{if(imgScale>1){e.preventDefault();imgMovedRef.current=false;imgDragRef.current={x:e.clientX-imgPan.x,y:e.clientY-imgPan.y}}}}
            onMouseMove={e=>{if(!imgDragRef.current)return;imgMovedRef.current=true;setImgPan({x:e.clientX-imgDragRef.current.x,y:e.clientY-imgDragRef.current.y})}}
            onMouseUp={()=>{imgDragRef.current=null}}
            onClick={()=>{if(!imgMovedRef.current&&imgScale===1)openLb(stageImg);imgMovedRef.current=false;}}
            alt={cur.title}
          />
          <div style={{position:'absolute',top:10,right:10,display:'flex',gap:6,zIndex:10,alignItems:'center'}}>
            {imgScale>1&&<button onClick={e=>{e.stopPropagation();setImgScale(1);setImgPan({x:0,y:0})}} style={{fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'0.15em',color:'var(--neon-cyan)',background:'rgba(7,4,26,.9)',padding:'5px 10px',border:'1px solid rgba(34,211,238,.5)',cursor:'pointer'}}>↺ ZOOM RESET</button>}
            <div style={{fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'0.15em',color:'var(--neon-cyan)',background:'rgba(7,4,26,.8)',padding:'5px 10px',border:'1px solid var(--line-soft)',pointerEvents:'none'}}>
              {imgScale>1?`${Math.round(imgScale*100)}% · 拖曳平移`:'🔍 滾輪縮放 · 點擊全屏'}
            </div>
          </div>
          <div style={{position:'absolute',bottom:10,left:10,right:10,display:'flex',justifyContent:'space-between',fontFamily:'var(--font-mono)',fontSize:9,color:'var(--ink-500)',letterSpacing:'0.12em',pointerEvents:'none'}}>
            <span>{cur.label}.png</span><span>{cur.density}</span>
          </div>
        </div>
      </div>
      <div>
        <div className="panel crt bracketed" style={{padding:0}}>
          <div className="term-bar"><div className="dots"><span/><span/><span/></div><div>stage.info</div></div>
          <div style={{padding:24}}>
            <div style={{fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.25em',color:'var(--neon-violet)',marginBottom:6}}>{cur.en}</div>
            <div style={{fontFamily:'var(--font-display)',fontSize:22,color:'var(--ink-100)',marginBottom:14}}>{cur.title}</div>
            <p style={{fontFamily:'var(--font-serif)',fontSize:13,color:'var(--ink-300)',lineHeight:1.8,margin:0}}>{cur.desc}</p>
            <div style={{marginTop:20,paddingTop:16,borderTop:'1px solid var(--line-soft)',fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.2em',color:'var(--neon-violet)',marginBottom:10}}>◇ KEY STEPS</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{cur.parts.map((p,i)=><span key={i} className="chip" style={{borderColor:'var(--line-strong)',color:'var(--ink-100)'}}>{p}</span>)}</div>
          </div>
        </div>
        <div style={{marginTop:16,padding:20,border:'1px solid var(--line-soft)'}}>
          <div style={{fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.25em',color:'var(--neon-violet)',marginBottom:12}}>◇ PIPELINE</div>
          {[{step:'01',tool:'Clip Studio Paint',task:'原稿繪製 + 拆件分層'},{step:'02',tool:'PSD Export',task:'依拆件命名分組'},{step:'03',tool:'Live2D Cubism',task:'匯入 → 變形器 → 動畫'},{step:'04',tool:'Texture Atlas',task:'打包至 4096² × 3 張'}].map((s,i)=>(
            <div key={i} style={{display:'flex',alignItems:'baseline',gap:14,padding:'8px 0',borderBottom:i<3?'1px dashed rgba(167,139,250,.15)':'none'}}>
              <span style={{fontFamily:'var(--font-mono)',fontSize:10,color:'var(--neon-magenta)',letterSpacing:'0.2em'}}>{s.step}</span>
              <div style={{flex:1}}>
                <div style={{fontFamily:'var(--font-display)',fontSize:13,color:'var(--ink-100)'}}>{s.tool}</div>
                <div style={{fontFamily:'var(--font-serif)',fontSize:11,color:'var(--ink-500)'}}>{s.task}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>}

    {/* Stage 2 — interactive layer separation */}
    {activeStage===1&&<div style={{display:'grid',gridTemplateColumns:'1fr 270px',gap:24,alignItems:'start'}}>
      <div>
        <div style={{position:'relative',aspectRatio:'3/4',border:'1px solid var(--line-strong)',
          background:'#070415',

            </div>);
          })}

        <div style={{marginTop:10,padding:'10px 14px',background:'rgba(167,139,250,.04)',border:'1px solid var(--line-soft)',fontFamily:'var(--font-mono)',fontSize:9,lineHeight:1.9,letterSpacing:'0.08em'}}>

          <div>· <span style={{color:'var(--neon-cyan)'}}>拖曳物件樹</span><span style={{color:'var(--ink-100)'}}> — 移動圖層</span></div>

<!-- ── modeling ── -->
<script type="text/babel">
const PhysicsTriggers=({canvasRef})=>{
  const[active,setActive]=React.useState(null);
  const[busy,setBusy]=React.useState(false);
  const tickRef=React.useRef(null);
  const stopAll=()=>{if(tickRef.current){cancelAnimationFrame(tickRef.current);tickRef.current=null}const c=canvasRef.current;if(c)['ParamAngleX','ParamAngleY','ParamAngleZ','ParamBodyAngleX','ParamBodyAngleY','ParamBodyAngleZ'].forEach(p=>c.clearParam(p));setActive(null);setBusy(false)};
  const run=(id,dur,fn)=>{const c=canvasRef.current;if(!c)return;stopAll();setActive(id);setBusy(true);const start=performance.now();const tick=()=>{const t=(performance.now()-start)/1000;if(t>dur){stopAll();return}fn(t,c);tickRef.current=requestAnimationFrame(tick)};tickRef.current=requestAnimationFrame(tick)};
  React.useEffect(()=>()=>stopAll(),[]);
  const triggers=[
    {id:'breeze',label:'微風',icon:'✦',desc:'柔和的左右擺動',dur:6,fn:(t,c)=>{const s=Math.sin(t*1.4)*18+Math.sin(t*2.7)*6;c.setParam('ParamAngleZ',s);c.setParam('ParamBodyAngleZ',s*.4)}},
    {id:'shake',label:'震動',icon:'◈',desc:'快速抖動 · 全身',dur:1.5,fn:(t,c)=>{const d=Math.max(0,1-t/1.5);c.setParam('ParamAngleX',(Math.random()-.5)*30*d);c.setParam('ParamAngleY',(Math.random()-.5)*25*d);c.setParam('ParamAngleZ',(Math.random()-.5)*20*d);c.setParam('ParamBodyAngleX',(Math.random()-.5)*8*d)}},
    {id:'spin',label:'旋風',icon:'⟁',desc:'頭部畫圈',dur:5,fn:(t,c)=>{const r=28;c.setParam('ParamAngleX',Math.cos(t*2)*r);c.setParam('ParamAngleY',Math.sin(t*2)*r*.7);c.setParam('ParamAngleZ',Math.sin(t*2+Math.PI/2)*15);c.setParam('ParamBodyAngleZ',Math.sin(t*2)*8)}},
    {id:'jump',label:'跳躍',icon:'↟',desc:'上下彈跳',dur:2.5,fn:(t,c)=>{const p=t*Math.PI*2/.7,d=Math.max(0,1-t/2.5),b=Math.abs(Math.sin(p))*25*d;c.setParam('ParamAngleX',-b*.5);c.setParam('ParamBodyAngleX',-b*.3);c.setParam('ParamAngleZ',Math.sin(p*1.2)*8*d)}},
    {id:'nod',label:'點頭',icon:'✓',desc:'快速點頭',dur:2,fn:(t,c)=>{const d=Math.max(0,1-t/2),n=Math.sin(t*8)*22*d;c.setParam('ParamAngleX',-Math.abs(n)*.7+n*.3);c.setParam('ParamBodyAngleY',n*.2)}},
    {id:'tilt',label:'歪頭',icon:'◐',desc:'可愛地歪頭',dur:3,fn:(t,c)=>{const v=t<.5?(t/.5)*22:t<2.5?22:22*(1-(t-2.5)/.5);c.setParam('ParamAngleZ',v);c.setParam('ParamAngleY',v*.3)}},
  ];
  return(<div>
    <div style={{padding:'14px 16px',display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,borderBottom:'1px solid var(--line-soft)'}}>
      {triggers.map(t=>(
        <button key={t.id} disabled={busy&&active!==t.id} onClick={()=>run(t.id,t.dur,t.fn)} style={{padding:'14px 8px',fontFamily:'var(--font-serif)',fontSize:13,background:active===t.id?'rgba(240,171,252,.15)':'rgba(13,7,38,.5)',border:`1px solid ${active===t.id?'var(--neon-magenta)':'var(--line-soft)'}`,color:active===t.id?'var(--neon-magenta)':busy?'var(--ink-700)':'var(--ink-100)',transition:'all .2s',textAlign:'center',opacity:busy&&active!==t.id?.4:1}}>
          <div style={{fontSize:18,color:'var(--neon-violet)',marginBottom:6}}>{t.icon}</div>
          <div style={{marginBottom:2}}>{t.label}</div>
          <div style={{fontFamily:'var(--font-mono)',fontSize:9,color:'var(--ink-500)'}}>{t.desc}</div>
        </button>
      ))}
    </div>
    <div style={{padding:'12px 20px',fontFamily:'var(--font-mono)',fontSize:10,color:'var(--ink-500)',letterSpacing:'0.1em',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <span>※ 觸發後脈衝送入 <span style={{color:'var(--neon-magenta)'}}>ParamAngle*</span>，由 Cubism 內建物理傳遞</span>
      <button onClick={stopAll} className="btn" style={{padding:'6px 14px',fontSize:10}} disabled={!busy}>⊘ 停止</button>
    </div>
  </div>);
};

const ParamSliders=({canvasRef})=>{
  const params=[
    {id:'ParamAngleX',label:'角度 X',range:[-30,30],step:1,init:0},{id:'ParamAngleY',label:'角度 Y',range:[-30,30],step:1,init:0},
    {id:'ParamAngleZ',label:'角度 Z',range:[-30,30],step:1,init:0},{id:'ParamEyeBallX',label:'眼珠 X',range:[-1,1],step:.05,init:0},
    {id:'ParamEyeBallY',label:'眼珠 Y',range:[-1,1],step:.05,init:0},{id:'ParamEyeLOpen',label:'左眼 開合',range:[0,1],step:.05,init:1},
    {id:'ParamEyeROpen',label:'右眼 開合',range:[0,1],step:.05,init:1},{id:'ParamMouthOpenY',label:'張嘴',range:[0,1],step:.05,init:0},
    {id:'ParamMouthForm',label:'嘴型',range:[-1,1],step:.05,init:0},{id:'ParamCheek',label:'臉頰泛紅',range:[0,1],step:.05,init:0},
    {id:'ParamBodyAngleX',label:'身體 X',range:[-10,10],step:1,init:0},{id:'ParamBodyAngleZ',label:'身體 Z',range:[-10,10],step:1,init:0},
  ];
  const[vals,setVals]=React.useState(Object.fromEntries(params.map(p=>[p.id,p.init])));
  const handleChange=(id,v)=>{setVals(s=>({...s,[id]:v}));canvasRef.current?.setParam(id,v)};
  const reset=()=>{setVals(Object.fromEntries(params.map(p=>[p.id,p.init])));params.forEach(p=>canvasRef.current?.clearParam(p.id))};
  return(<div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',fontFamily:'var(--font-mono)',fontSize:11}}>
      {params.map((p,i)=>(
        <div key={p.id} style={{padding:14,borderRight:i%2!==1?'1px solid var(--line-soft)':'none',borderBottom:i<params.length-2?'1px solid var(--line-soft)':'none'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:8,alignItems:'baseline'}}>
            <div><div style={{color:'var(--neon-magenta)',fontSize:11}}>{p.id}</div><div style={{color:'var(--ink-300)',fontSize:10,fontFamily:'var(--font-serif)'}}>{p.label}</div></div>
            <span style={{color:'var(--neon-cyan)',fontSize:11}}>{Number(vals[p.id]).toFixed(p.step<1?2:0)}</span>
          </div>
          <input type="range" min={p.range[0]} max={p.range[1]} step={p.step} value={vals[p.id]} onChange={e=>handleChange(p.id,parseFloat(e.target.value))} style={{width:'100%',WebkitAppearance:'none',height:2,background:'var(--line-strong)',outline:'none'}}/>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:4,color:'var(--ink-700)',fontSize:9}}><span>{p.range[0]}</span><span>{p.range[1]}</span></div>
        </div>
      ))}
    </div>
    <div style={{padding:14,borderTop:'1px solid var(--line-soft)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <div style={{fontFamily:'var(--font-mono)',fontSize:10,color:'var(--ink-500)',letterSpacing:'0.1em'}}>※ 拖動滑桿即時驅動真模型</div>
      <button onClick={reset} className="btn" style={{padding:'6px 14px',fontSize:10}}>↺ 重置全部</button>
    </div>
  </div>);
};

const ModelLiveStage=({canvasRef,onActiveChange})=>{
  const stageRef=React.useRef(null);
  const[pp,setPP]=React.useState({x:0,y:0,active:false});
  const[active,setActive]=React.useState(null);
  const[ready,setReady]=React.useState(false);
  const[view,setView]=React.useState('full');
  const[cvShow,setCvShow]=React.useState(true);
  const[cvKey,setCvKey]=React.useState(0);
  React.useEffect(()=>{
    const onStart=()=>{setCvShow(false);setReady(false)};
    const onStop=()=>setTimeout(()=>{setCvKey(k=>k+1);setCvShow(true)},350);
    window.addEventListener('live2d-webcam-start',onStart);
    window.addEventListener('live2d-webcam-stop',onStop);
    return()=>{window.removeEventListener('live2d-webcam-start',onStart);window.removeEventListener('live2d-webcam-stop',onStop)};
  },[]);
  const changeView=v=>{setView(v);canvasRef.current?.setView(v)};
  const handleMove=e=>{if(!stageRef.current||!canvasRef.current)return;const r=stageRef.current.getBoundingClientRect();const nx=(e.clientX-r.left)/r.width-.5,ny=(e.clientY-r.top)/r.height-.5;const c=canvasRef.current;c.setParam('ParamAngleX',nx*60);c.setParam('ParamAngleY',-ny*50);c.setParam('ParamAngleZ',nx*20);c.setParam('ParamBodyAngleX',nx*10);c.setParam('ParamBodyAngleY',-ny*10);c.setParam('ParamEyeBallX',nx*1.4);c.setParam('ParamEyeBallY',-ny*1.2);setPP({x:e.clientX-r.left,y:e.clientY-r.top,active:true})};
  const handleLeave=()=>{const c=canvasRef.current;if(c)['ParamAngleX','ParamAngleY','ParamAngleZ','ParamBodyAngleX','ParamBodyAngleY','ParamEyeBallX','ParamEyeBallY'].forEach(p=>c.clearParam(p));setPP(p=>({...p,active:false}))};
  const toggleExpr=name=>{if(!canvasRef.current)return;const next=active===name?null:name;canvasRef.current.setExpression(next);setActive(next);onActiveChange&&onActiveChange()};
  const viewBtns=[{v:'full',l:'全身'},{v:'upper',l:'上半身'},{v:'face',l:'臉部'}];
  return(<div>
    <div ref={stageRef} className="live2d-stage" style={{aspectRatio:'4/5',cursor:'crosshair',position:'relative'}} onMouseMove={handleMove} onMouseLeave={handleLeave}>
      <div className="stage-grid"/><div className="stage-axis"/><div className="stage-axis v"/>
      {cvShow
        ?<Live2DCanvas key={cvKey} ref={canvasRef} yOffset={0} fitScale={0.95} initialView="full" onReady={()=>setReady(true)} style={{position:'relative',zIndex:2}}/>
        :<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:10,fontFamily:'var(--font-mono)',fontSize:10,color:'var(--neon-violet)',letterSpacing:'0.2em',zIndex:2,pointerEvents:'none'}}>
          <div style={{fontSize:28,opacity:.35,animation:'rune-spin 6s linear infinite'}}>◇</div>
          <div>WEBCAM · ACTIVE</div>
          <div style={{fontSize:9,color:'var(--ink-500)',textAlign:'center',lineHeight:1.8}}>動態捕捉進行中<br/>關閉鏡頭後模型將自動恢復</div>
        </div>}
      <div style={{position:'absolute',top:12,right:12,zIndex:4,display:'flex',gap:4}}>
        {viewBtns.map(o=><button key={o.v} onClick={()=>changeView(o.v)} style={{padding:'6px 10px',fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'0.2em',background:view===o.v?'rgba(240,171,252,.2)':'rgba(7,4,26,.6)',border:`1px solid ${view===o.v?'var(--neon-magenta)':'var(--line-soft)'}`,color:view===o.v?'var(--neon-magenta)':'var(--ink-300)',transition:'all .15s'}}>{o.l}</button>)}
      </div>
      <div style={{position:'absolute',top:12,left:12,zIndex:3,fontFamily:'var(--font-mono)',fontSize:10,color:'var(--neon-cyan)',letterSpacing:'0.15em',display:'flex',alignItems:'center',gap:8,pointerEvents:'none'}}>
        <span style={{width:6,height:6,borderRadius:'50%',background:ready?'var(--neon-cyan)':'var(--neon-amber)',boxShadow:'0 0 8px currentColor'}}/>
        {ready?'LIVE2D · CUBISM 4':'LOADING'}
      </div>
      <div style={{position:'absolute',top:44,right:12,zIndex:3,fontFamily:'var(--font-mono)',fontSize:9,color:'var(--ink-500)',textAlign:'right',pointerEvents:'none'}}>◇ 移動滑鼠<br/>模型會跟著看你</div>
      <div style={{position:'absolute',bottom:12,left:12,right:12,zIndex:3,display:'flex',justifyContent:'space-between',fontFamily:'var(--font-mono)',fontSize:9,color:'var(--ink-500)',pointerEvents:'none'}}>
        <span>texture · 4096² × 3</span><span>{pp.active?`tracking · ${Math.round(pp.x)},${Math.round(pp.y)}`:'idle'}</span>
      </div>
    </div>
    <div style={{marginTop:16}}>
      <div style={{fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.25em',color:'var(--neon-violet)',marginBottom:10,display:'flex',justifyContent:'space-between'}}>
        <span>◇ EXPRESSIONS · 表 情 · 14</span><span style={{color:'var(--ink-500)'}}>active: {active||'none'}</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:6}}>
        {LIVE2D_EXPRESSIONS.map(e=>(
          <button key={e.name} onClick={()=>toggleExpr(e.name)} style={{padding:'10px 6px',background:active===e.name?'rgba(240,171,252,.2)':'rgba(13,7,38,.6)',border:`1px solid ${active===e.name?'var(--neon-magenta)':'var(--line-soft)'}`,color:active===e.name?'var(--neon-magenta)':'var(--ink-300)',fontFamily:'var(--font-serif)',fontSize:11,textAlign:'center',transition:'all .2s'}} title={e.cn}>
            <div style={{fontSize:14,marginBottom:2}}>{e.label}</div>
            <div style={{fontSize:9,opacity:.7}}>{e.cn}</div>
          </button>
        ))}
      </div>
    </div>
  </div>);
};

const Modeling=()=>{
  const canvasRef=React.useRef(null);
  const[,force]=React.useReducer(x=>x+1,0);
  const[openParts,setOpenParts]=React.useState({Head:true,Hair:true,Body:false,Face:true,Accessory:false,Effect:false});
  const toggle=k=>setOpenParts(s=>({...s,[k]:!s[k]}));

<!-- ── webcam-demo ── -->
<script type="text/babel">
const WebcamDemo=()=>{
  const videoRef=React.useRef(null);
  const modelRef=React.useRef(null);
  const faceMeshRef=React.useRef(null);
  const landmarksRef=React.useRef(null);
  const sendingRef=React.useRef(false);
  const smoothRef=React.useRef({aX:0,aY:0,aZ:0,eyeL:1,eyeR:1,mouth:0,gazeX:0,gazeY:0});
  const[status,setStatus]=React.useState('idle');
  const[fmpReady,setFmpReady]=React.useState(false);
  const[errMsg,setErrMsg]=React.useState('');
  const[dispParams,setDispParams]=React.useState({aX:'0.0',aY:'0.0',eyeL:'1.00',mouth:'0.00'});
  const[smoothing,setSmoothing]=React.useState(.18);
  const[mirror,setMirror]=React.useState(true);
  const[modelMounted,setModelMounted]=React.useState(false);
  const[view,setView]=React.useState('upper');
  const[faceDetected,setFaceDetected]=React.useState(false);

  // Init MediaPipe FaceMesh
  React.useEffect(()=>{
    if(typeof window.FaceMesh==='undefined'){console.warn('MediaPipe FaceMesh SDK not loaded');return}
    const fm=new window.FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${f}`});
    fm.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
    fm.onResults(r=>{
      if(r.multiFaceLandmarks&&r.multiFaceLandmarks.length>0){landmarksRef.current=r.multiFaceLandmarks[0]}
      else{landmarksRef.current=null}
    });
    fm.initialize().then(()=>{faceMeshRef.current=fm;setFmpReady(true)}).catch(e=>console.error('FaceMesh init:',e));
    return()=>{if(faceMeshRef.current){faceMeshRef.current.close();faceMeshRef.current=null}};
  },[]);

  const changeView=v=>{setView(v);modelRef.current?.setView(v)};
  const start=async()=>{
    window.dispatchEvent(new CustomEvent('live2d-webcam-start'));
    setStatus('requesting');setModelMounted(true);
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});
      if(videoRef.current){videoRef.current.srcObject=stream;await videoRef.current.play();setStatus('live')}
    }catch(e){setStatus(e.name==='NotAllowedError'?'denied':'error');setErrMsg(e.message||'unknown error')}
  };
  const stop=()=>{
    const v=videoRef.current;
    if(v&&v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}
    modelRef.current?.clearAllParams();landmarksRef.current=null;
    setStatus('idle');setModelMounted(false);setFaceDetected(false);
    window.dispatchEvent(new CustomEvent('live2d-webcam-stop'));
  };

  // Tracking loop — MediaPipe FaceMesh
  React.useEffect(()=>{
    if(status!=='live')return;
    let raf,t=0,lastSend=0,fc=0;
    const v=videoRef.current;if(!v)return;
    const tick=()=>{
      t+=.016;const now=performance.now();const breath=.5+Math.sin(t*1.2)*.5;
      // Send frame to MediaPipe ~30fps, no overlapping calls
      if(faceMeshRef.current&&v.readyState>=2&&!sendingRef.current&&now-lastSend>33){
        lastSend=now;sendingRef.current=true;
        faceMeshRef.current.send({image:v}).finally(()=>{sendingRef.current=false}).catch(()=>{});
      }
      const lm=landmarksRef.current;const s=smoothRef.current;
      if(lm&&lm.length>=468){
        // Head rotation: nose tip vs eye-line center
        const nose=lm[1],eyeLC=lm[33],eyeRC=lm[263];
        const fcx=(eyeLC.x+eyeRC.x)/2,fcy=(eyeLC.y+eyeRC.y)/2;
        // Mirror: flip x for display-consistent tracking
        const nx=mirror?(1-nose.x):nose.x,cx=mirror?(1-fcx):fcx;
        const rawYaw=(nx-cx)*150;
        const rawPitch=(fcy-nose.y)*120;
        const edx=eyeRC.x-eyeLC.x,edy=eyeRC.y-eyeLC.y;
        const rawRoll=Math.atan2(edy,edx)*(180/Math.PI)*(mirror?-1:1);
        // EAR — Eye Aspect Ratio for blink detection
        const lET=lm[159],lEB=lm[145],lEO=lm[33],lEI=lm[133];
        const lEAR=Math.abs(lET.y-lEB.y)/(Math.abs(lEO.x-lEI.x)+.001);
        const rawEL=Math.max(0,Math.min(1,(lEAR-.04)/.20));
        const rET=lm[386],rEB=lm[374],rEO=lm[263],rEI=lm[362];
        const rEAR=Math.abs(rET.y-rEB.y)/(Math.abs(rEO.x-rEI.x)+.001);
        const rawER=Math.max(0,Math.min(1,(rEAR-.04)/.20));
        // MAR — Mouth Aspect Ratio
        const mT=lm[13],mB=lm[14],mL=lm[61],mR=lm[291];
        const rawMouth=Math.max(0,Math.min(1,(Math.abs(mT.y-mB.y)/(Math.abs(mL.x-mR.x)+.001)-.02)/.13));
        // Iris gaze (refineLandmarks=true gives 478 total)
        let rawGX=0,rawGY=0;
        if(lm.length>=478){
          const iL=lm[473],iR=lm[468];
          const eyeW=(Math.abs(lEO.x-lEI.x)+Math.abs(rEO.x-rEI.x))/2;
          rawGX=mirror?-((iL.x+iR.x)/2-fcx)/(eyeW+.001):((iL.x+iR.x)/2-fcx)/(eyeW+.001);
          rawGY=-((iL.y+iR.y)/2-fcy)*8;
        }
        // Smooth all values
        const k=smoothing;
        s.aX+=(rawYaw-s.aX)*k;s.aY+=(rawPitch-s.aY)*k;s.aZ+=(rawRoll-s.aZ)*k;
        s.eyeL+=(rawEL-s.eyeL)*.35;s.eyeR+=(rawER-s.eyeR)*.35;
        s.mouth+=(rawMouth-s.mouth)*.3;
        s.gazeX+=(rawGX-s.gazeX)*.2;s.gazeY+=(rawGY-s.gazeY)*.2;
        // Drive Live2D
        const m=modelRef.current;
        if(m){
          m.setParam('ParamAngleX',Math.max(-30,Math.min(30,s.aX)));
          m.setParam('ParamAngleY',Math.max(-30,Math.min(30,s.aY)));
          m.setParam('ParamAngleZ',Math.max(-30,Math.min(30,s.aZ)));
          m.setParam('ParamBodyAngleX',s.aX*.3);m.setParam('ParamBodyAngleY',s.aY*.3);m.setParam('ParamBodyAngleZ',s.aZ*.5);
          m.setParam('ParamEyeLOpen',s.eyeL);m.setParam('ParamEyeROpen',s.eyeR);
          m.setParam('ParamEyeBallX',Math.max(-1,Math.min(1,s.gazeX)));
          m.setParam('ParamEyeBallY',Math.max(-1,Math.min(1,s.gazeY)));
          m.setParam('ParamMouthOpenY',s.mouth);m.setParam('ParamBreath',breath);
        }
        fc++;
        if(fc%6===0){
          setFaceDetected(true);
          setDispParams({aX:s.aX.toFixed(1),aY:s.aY.toFixed(1),eyeL:s.eyeL.toFixed(2),mouth:s.mouth.toFixed(2)});
        }
      }else{
        fc++;if(fc%30===0)setFaceDetected(false);
        const m=modelRef.current;if(m)m.setParam('ParamBreath',breath);
      }
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf);
  },[status,mirror,smoothing]);

  const vBtns=[{v:'full',l:'全身'},{v:'upper',l:'上半身'},{v:'face',l:'臉部'}];
  return(<section className="page" id="webcam">
    <div className="section-eyebrow"><span className="idx">06</span><span>motion.capture</span></div>
    <h2 className="section-title">親手試試 · 動態捕捉<br/><span style={{color:'var(--ink-500)',fontSize:'0.5em',letterSpacing:'0.3em'}}>WEBCAM · DEMO</span></h2>
    <div className="section-subtitle">// MediaPipe FaceMesh · 468點人臉追蹤 · 眨眼 · 張嘴 · 視線 · 資料不離開瀏覽器</div>
    <div className="webcam-layout">
      <div className="webcam-feed">
        <video ref={videoRef} muted playsInline style={{transform:mirror?'scaleX(-1)':'none'}}/>
        {status!=='live'&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16,padding:20,textAlign:'center'}}>
          <div style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--neon-violet)',letterSpacing:'0.3em',marginBottom:4}}>◇ CAMERA · STANDBY</div>
          {status==='idle'&&<>
            <p style={{fontFamily:'var(--font-serif)',fontSize:14,color:'var(--ink-300)',maxWidth:280,lineHeight:1.7}}>點擊下方按鈕，授權瀏覽器使用你的鏡頭。<br/><span style={{color:'var(--ink-500)',fontSize:12}}>影像僅在本機處理。</span></p>
            {!fmpReady&&<p style={{fontFamily:'var(--font-mono)',fontSize:10,color:'var(--neon-amber)',letterSpacing:'0.15em'}}>⟳ MediaPipe 載入中，請稍候...</p>}
            <button onClick={start} className="btn primary" disabled={!fmpReady} style={{opacity:fmpReady?1:.5}}>▶ 啟動鏡頭</button>
          </>}
          {status==='requesting'&&<p className="mono" style={{color:'var(--neon-amber)'}}>requesting permission...</p>}
          {status==='denied'&&<><p style={{color:'var(--neon-rose)',fontFamily:'var(--font-serif)'}}>⚠ 權限被拒絕，請在網址列重新允許後刷新。</p><button onClick={start} className="btn">↺ 重試</button></>}
          {status==='error'&&<><p style={{color:'var(--neon-rose)',fontFamily:'var(--font-mono)',fontSize:11}}>× {errMsg}</p><button onClick={start} className="btn">↺ 重試</button></>}
        </div>}
        {status==='live'&&<>
          <div className={`webcam-status${faceDetected?' live':''}`}>
            <span className="dot"/>
            {faceDetected?'FACE · DETECTED':'SEARCHING · FACE'}
          </div>
          <div className="scan"/>
          <div style={{position:'absolute',top:12,right:12,display:'flex',gap:6}}>
            <button onClick={()=>setMirror(m=>!m)} className="btn" style={{padding:'6px 10px',fontSize:9}}>{mirror?'◐ MIRROR':'◑ DIRECT'}</button>
            <button onClick={stop} className="btn" style={{padding:'6px 10px',fontSize:9}}>⊘ STOP</button>
          </div>
          {!faceDetected&&<div style={{position:'absolute',bottom:12,left:12,right:12,background:'rgba(253,164,175,.1)',border:'1px solid rgba(253,164,175,.3)',padding:'8px 12px',fontFamily:'var(--font-mono)',fontSize:10,color:'var(--neon-rose)',letterSpacing:'0.12em'}}>
            ⚠ 未偵測到人臉 — 確認光線充足並正對鏡頭
          </div>}
        </>}
      </div>
      <div className="webcam-output">
        <div style={{position:'absolute',top:12,left:12,zIndex:5,fontFamily:'var(--font-mono)',fontSize:10,color:'var(--neon-magenta)',letterSpacing:'0.2em',display:'flex',alignItems:'center',gap:8}}>
          <span style={{width:6,height:6,borderRadius:'50%',background:'var(--neon-magenta)',boxShadow:'0 0 8px var(--neon-magenta)',animation:status==='live'?'wpulse 1.4s infinite':'none'}}/>MODEL · MIRROR
        </div>
        {modelMounted?<>
          <Live2DCanvas ref={modelRef} fitScale={0.95} yOffset={0} initialView="upper"/>
          <div style={{position:'absolute',top:12,right:12,zIndex:6,display:'flex',gap:4}}>
            {vBtns.map(o=><button key={o.v} onClick={()=>changeView(o.v)} style={{padding:'6px 10px',fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'0.2em',background:view===o.v?'rgba(240,171,252,.2)':'rgba(7,4,26,.6)',border:`1px solid ${view===o.v?'var(--neon-magenta)':'var(--line-soft)'}`,color:view===o.v?'var(--neon-magenta)':'var(--ink-300)',transition:'all .15s'}}>{o.l}</button>)}
          </div>
        </>:<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12,fontFamily:'var(--font-mono)',fontSize:11,color:'var(--neon-violet)',letterSpacing:'0.25em',textAlign:'center',pointerEvents:'none'}}>
          <div style={{fontSize:32,opacity:.5}}>◇</div><div>MODEL · STANDBY</div>
          <div style={{fontSize:9,color:'var(--ink-500)',maxWidth:200,lineHeight:1.6}}>點擊左側「啟動鏡頭」後<br/>真模型才會被召喚至此</div>
        </div>}
        <div style={{position:'absolute',bottom:12,left:12,right:12,zIndex:5,fontFamily:'var(--font-mono)',fontSize:9,color:'var(--ink-500)',display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,pointerEvents:'none'}}>
          <span>AngleX <span style={{color:'var(--neon-cyan)'}}>{dispParams.aX}</span></span>
          <span>AngleY <span style={{color:'var(--neon-cyan)'}}>{dispParams.aY}</span></span>
          <span>EyeL <span style={{color:'var(--neon-cyan)'}}>{dispParams.eyeL}</span></span>
          <span>Mouth <span style={{color:'var(--neon-cyan)'}}>{dispParams.mouth}</span></span>
        </div>
      </div>
    </div>
    <div className="panel" style={{marginTop:24,padding:0}}>
      <div className="term-bar"><div className="dots"><span/><span/><span/></div><div>tracking_pipeline.log</div><div style={{color:status==='live'?'var(--neon-magenta)':'var(--ink-500)'}}>{status==='live'?'● RECORDING':'○ standby'}</div></div>
      <div style={{padding:20,fontFamily:'var(--font-mono)',fontSize:11,color:'var(--ink-500)',letterSpacing:'0.05em',lineHeight:1.9}}>
        <div><span style={{color:'var(--neon-violet)'}}>{'>'}</span> MediaPipe FaceMesh v0.4 · 468 face landmarks + 10 iris points</div>
        <div><span style={{color:'var(--neon-violet)'}}>{'>'}</span> nose tip + eye-line → ParamAngleX / Y / Z (head pose)</div>
        <div><span style={{color:'var(--neon-violet)'}}>{'>'}</span> EAR → ParamEyeLOpen / ParamEyeROpen (眨眼偵測)</div>
        <div><span style={{color:'var(--neon-violet)'}}>{'>'}</span> MAR → ParamMouthOpenY · iris → ParamEyeBallX / Y</div>
        <div><span style={{color:'var(--neon-cyan)'}}>{'>'}</span> drive <span style={{color:'var(--neon-magenta)'}}>wuyan.moc3</span> <span style={{color:'var(--ink-700)'}}>(pixi-live2d-display)</span></div>
        <div style={{marginTop:16,paddingTop:16,borderTop:'1px solid var(--line-soft)',display:'flex',alignItems:'center',gap:16}}>
          <span style={{color:'var(--neon-violet)',letterSpacing:'0.15em'}}>SMOOTHING</span>
          <input type="range" min="0.05" max="0.5" step="0.01" value={smoothing} onChange={e=>setSmoothing(parseFloat(e.target.value))} style={{flex:1,WebkitAppearance:'none',height:2,background:'var(--line-strong)'}}/>
          <span style={{color:'var(--neon-cyan)',minWidth:40}}>{smoothing.toFixed(2)}</span>
        </div>
        <div style={{marginTop:12,color:'var(--neon-amber)'}}>※ 隱私聲明：影像僅在本機處理，不會上傳任何伺服器。</div>
      </div>
    </div>
  </section>);
};
window.WebcamDemo=WebcamDemo;
</script>

<!-- ── app (TopNav + ParticleField + App) ── -->
<script type="text/babel">
const ParticleField=({count=60})=>{
  const ref=React.useRef(null);
  React.useEffect(()=>{
    const c=ref.current;if(!c)return;
    const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
    const resize=()=>{c.width=innerWidth*dpr;c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'};
    resize();window.addEventListener('resize',resize);
    const cols=['rgba(167,139,250,','rgba(240,171,252,','rgba(34,211,238,','rgba(253,230,138,'];
    const pts=Array.from({length:count},()=>({x:Math.random()*innerWidth*dpr,y:Math.random()*innerHeight*dpr,r:Math.random()*1.4+0.4,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,a:Math.random(),tw:Math.random()*.02+.005}));
    let raf;
    const tick=()=>{
      ctx.clearRect(0,0,c.width,c.height);
      pts.forEach((p,i)=>{
        p.x+=p.vx;p.y+=p.vy;
        p.a+=p.tw;if(p.a>1)p.tw=-Math.abs(p.tw);if(p.a<0)p.tw=Math.abs(p.tw);
        if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;if(p.y<0)p.y=c.height;if(p.y>c.height)p.y=0;
        const col=cols[i%cols.length];
        ctx.beginPath();ctx.arc(p.x,p.y,p.r*dpr,0,Math.PI*2);ctx.fillStyle=col+(p.a*.7).toFixed(2)+')';ctx.fill();
        ctx.beginPath();ctx.arc(p.x,p.y,p.r*4*dpr,0,Math.PI*2);ctx.fillStyle=col+(p.a*.07).toFixed(2)+')';ctx.fill();
      });
      raf=requestAnimationFrame(tick);
    };
    tick();
    return()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize)};
  },[count]);
  return<canvas ref={ref} style={{position:'fixed',inset:0,zIndex:1,pointerEvents:'none'}}/>;
};

const TopNav=()=>(
  <nav className="topnav">
    <div className="brand">✦ WUYAN · ARCHIVE</div>
    <div className="nav-links">
      {[['#hero','封面'],['#profile','設定'],['#concept','理念'],['#drawing','繪製'],['#modeling','建模'],['#webcam','鏡頭'],['#channel','頻道']].map(([h,l])=><a key={h} href={h}>{l}</a>)}
    </div>
    <div className="crumb">portfolio<span className="sep">/</span>works<span className="sep">/</span><span className="current">vtuber</span></div>
  </nav>
);

const FooterBar=()=>(
  <footer>
    <div>◇ WUYAN · CONJURED 2025</div>
    <div style={{display:'flex',gap:24}}>
      <span>Clip Studio Paint</span><span style={{color:'var(--ink-700)'}}>·</span>
      <span>Live2D Cubism</span><span style={{color:'var(--ink-700)'}}>·</span>
      <span>OBS</span><span style={{color:'var(--ink-700)'}}>·</span>
      <span style={{color:'var(--neon-violet)'}}>所有素材 © 吳言</span>
    </div>
  </footer>
);

const TWEAK_DEFAULTS={scanlines:true,ambient:'violet',particleDensity:60};

const App=()=>{
  const[tweaks,setTweak]=useTweaks(TWEAK_DEFAULTS);
  React.useEffect(()=>{document.body.classList.toggle('scanlines',!!tweaks.scanlines)},[tweaks.scanlines]);
  React.useEffect(()=>{
    const root=document.documentElement;
    const p={violet:{neonViolet:'#a78bfa',neonMagenta:'#f0abfc',neonCyan:'#22d3ee',neonAmber:'#fde68a'},cyber:{neonViolet:'#3a86ff',neonMagenta:'#ff006e',neonCyan:'#00ff9d',neonAmber:'#fde68a'},pastel:{neonViolet:'#c4b5fd',neonMagenta:'#fbcfe8',neonCyan:'#a5f3fc',neonAmber:'#fef3c7'},ember:{neonViolet:'#fda4af',neonMagenta:'#fb7185',neonCyan:'#fde68a',neonAmber:'#fed7aa'}};
    const c=p[tweaks.ambient]||p.violet;
    root.style.setProperty('--neon-violet',c.neonViolet);root.style.setProperty('--neon-magenta',c.neonMagenta);root.style.setProperty('--neon-cyan',c.neonCyan);root.style.setProperty('--neon-amber',c.neonAmber);
  },[tweaks.ambient]);
  return(<>
    <TopNav/>
    <ParticleField count={tweaks.particleDensity}/>
    <Hero/>
    <Profile/>
    <Concept/>
    <Drawing/>
    <Modeling/>
    <WebcamDemo/>
    <Channel/>
    <FooterBar/>
    <TweaksPanel title="Tweaks · 樣式調整">
      <TweakSection label="魔法配色 / Ambient">
        <TweakRadio label="主題" value={tweaks.ambient} onChange={v=>setTweak('ambient',v)} options={[{value:'violet',label:'紫夜'},{value:'cyber',label:'霓虹'},{value:'pastel',label:'柔光'},{value:'ember',label:'炭花'}]}/>
      </TweakSection>
      <TweakSection label="氛圍效果 / FX">
        <TweakToggle label="掃描線 (CRT)" value={tweaks.scanlines} onChange={v=>setTweak('scanlines',v)}/>
        <TweakSlider label="星塵密度" value={tweaks.particleDensity} min={0} max={120} step={10} onChange={v=>setTweak('particleDensity',v)}/>
      </TweakSection>
    </TweaksPanel>
  </>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<!-- ── Cursor + Stars + Progress (vanilla JS) ── -->
<script>
// cursor
const dot=document.getElementById('cursor-dot'),ring=document.getElementById('cursor-ring');
let mx=0,my=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';ring.style.left=mx+'px';ring.style.top=my+'px'});
document.querySelectorAll('a,button,.btn,.ni,.stream-card,.concept-card,.stat,.layer.folder').forEach(el=>{
  el.addEventListener('mouseenter',()=>document.body.classList.add('hov'));
  el.addEventListener('mouseleave',()=>document.body.classList.remove('hov'));
});

// stars
const starsEl=document.getElementById('stars');
const starColors=['#ffffff','rgba(255,185,215,1)','rgba(165,215,255,1)','rgba(255,220,140,1)'];
for(let i=0;i<80;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2+1;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;background:${starColors[Math.floor(Math.random()*4)]};--d:${2+Math.random()*4}s;--dl:${Math.random()*4}s;--a:${.2+Math.random()*.5}`;
  starsEl.appendChild(s);
}

// progress bar (window scroll)
const prog=document.getElementById('prog');
window.addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-window.innerHeight;
  prog.style.width=(h>0?Math.round(window.scrollY/h*100):0)+'%';
});
</script>
<script>
/* ── Page section dot nav ── */
(function(){
  var secs=[
    {id:'hero',en:'OVERVIEW'},{id:'profile',en:'CHARACTER'},
    {id:'concept',en:'CONCEPT'},{id:'drawing',en:'DRAWING'},
    {id:'modeling',en:'LIVE2D'},{id:'webcam',en:'WEBCAM'},
    {id:'channel',en:'CHANNEL'}
  ];
  setTimeout(function(){
    var nav=document.getElementById('page-nav');if(!nav)return;
    var items=[];
    secs.forEach(function(s){
      var el=document.getElementById(s.id);if(!el)return;
      var a=document.createElement('a');a.className='pn-item';a.href='#'+s.id;
      a.innerHTML='<span class="pn-label">'+s.en+'</span><div class="pn-node"></div>';
      a.addEventListener('click',function(e){e.preventDefault();el.scrollIntoView({behavior:'smooth'})});
      nav.appendChild(a);items.push({el:el,a:a});
    });
    if(!items.length)return;
    var cur=null;
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        var it=items.find(function(i){return i.el===e.target});
        if(!it||!e.isIntersecting)return;
        if(cur)cur.classList.remove('act');cur=it.a;cur.classList.add('act');
      });
    },{rootMargin:'-5% 0px -60% 0px'});
    items.forEach(function(i){io.observe(i.el)});
  },250);
  /* blink */
  setTimeout(function(){
    var bl=document.getElementById('char-blink');if(!bl)return;
    function doBlink(){bl.style.opacity='1';setTimeout(function(){bl.style.opacity='0';},150);setTimeout(doBlink,3000+Math.random()*4500);}
    setTimeout(doBlink,1500+Math.random()*2000);
  },400);
})();
</script>
