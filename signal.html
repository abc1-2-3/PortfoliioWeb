<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGNAL · WUYAN'S ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sidebar.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#04020e;color:#e8e0ff;font-family:'Courier New',monospace}

:root{
  --violet:        rgba(167,139,250,.6);
  --violet-bright: rgba(196,181,253,.9);
  --pink:          rgba(240,165,205,1);
  --azure:         rgba(165,215,255,1);
  --gold:          #d4a84e;
  --ink-0:         rgba(240,235,255,.92);
  --ink-1:         rgba(210,200,245,.75);
  --ink-2:         rgba(180,165,220,.58);
  --ink-3:         rgba(140,125,180,.42);
  --line:          rgba(167,139,250,.18);
  --ff-m:          'Courier New', monospace;
  --ff-s:          'Noto Serif TC', Georgia, serif;
}

/* ── Cursor ── */
#cursor-dot{
  position:fixed;width:6px;height:6px;border-radius:50%;
  background:#fff;box-shadow:0 0 8px rgba(255,180,220,.9);
  pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:opacity .2s
}
#cursor-ring{
  position:fixed;width:24px;height:24px;border-radius:50%;
  border:1px solid rgba(240,160,200,.4);pointer-events:none;z-index:9998;
  transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s
}
body.hov #cursor-ring{border-color:rgba(240,160,205,.75);box-shadow:0 0 12px rgba(220,120,175,.22)}

/* ── Stars canvas ── */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}

/* ── Scene background ── */
.scene-bg{position:fixed;inset:0;z-index:0}
.scene-bg-img{width:100%;height:100%;object-fit:cover;object-position:center top;opacity:.88}
.scene-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,
    rgba(4,2,14,.08) 0%,
    rgba(4,2,14,.12) 45%,
    rgba(4,2,14,.55) 72%,
    rgba(4,2,14,.82) 100%
  )
}

/* ── App shell ── */
.app{
  position:relative;z-index:1;height:100vh;width:100%;
  display:grid;grid-template-rows:auto 1fr;overflow:hidden
}

/* ── Topbar ── */
.topbar{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:24px;padding:15px 40px;
  background:linear-gradient(180deg,rgba(4,2,14,.90) 0%,rgba(4,2,14,.60) 65%,transparent 100%);
  backdrop-filter:blur(14px);
  position:relative;z-index:5
}
.tb-brand{font:400 13px var(--ff-m);letter-spacing:.34em;color:rgba(240,165,205,.92)}
.topbar-title{text-align:center}
.topbar-title h1{font:300 clamp(20px,2.4vw,30px) var(--ff-s);letter-spacing:.3em;color:var(--ink-0);margin:0;text-shadow:0 0 22px rgba(167,139,250,.5)}
.topbar-title .sub{margin-top:5px;font:400 11px var(--ff-m);letter-spacing:.38em;color:var(--ink-2)}
.topbar-right{display:flex;align-items:center;gap:16px;justify-content:flex-end;font:400 11px var(--ff-m);letter-spacing:.18em;color:var(--ink-2)}
.topbar-right .clock{color:var(--violet-bright);font-size:13px;letter-spacing:.14em}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}

/* ── Sky content area ── */
.sky-area{position:relative;overflow:hidden}
/* 星空提示 */
.sky-hint{
  position:absolute;top:22px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;
  font:400 11px var(--ff-m);letter-spacing:.24em;color:rgba(218,208,255,.90);
  white-space:nowrap;pointer-events:none;z-index:5;
  animation:hint-glow 3.5s ease-in-out infinite;
  text-shadow:0 0 14px rgba(196,181,253,.55)
}
.sky-hint::before,.sky-hint::after{content:'';display:block;width:24px;height:1px;background:rgba(196,181,253,.65)}
@keyframes hint-glow{0%,100%{opacity:.70}50%{opacity:1}}

/* ── Star nodes ── */
.star-node{
  position:absolute;
  left:var(--sx);top:var(--sy);
  transform:translate(-50%,-50%);
  z-index:10;
  animation:star-float var(--sf,4s) ease-in-out infinite;
  animation-delay:var(--sd,0s)
}
@keyframes star-float{
  0%,100%{translate:0 0}
  50%{translate:0 -9px}
}

/* star-dot: transparent hit area, glow via filter so it wraps fragments */
.star-dot{
  width:var(--ss,14px);height:var(--ss,14px);
  cursor:pointer;position:relative;z-index:2;
  transition:transform .22s,filter .22s;
  filter:drop-shadow(0 0 5px var(--sc)) drop-shadow(0 0 12px var(--sc-mid));
}
.star-node:hover .star-dot{
  transform:scale(1.3);
  filter:drop-shadow(0 0 10px var(--sc)) drop-shadow(0 0 24px var(--sc-mid)) drop-shadow(0 0 44px var(--sc-dim));
}
.star-dot::before{
  content:'';position:absolute;inset:-7px;border-radius:50%;
  border:1px solid var(--sc-mid);
  animation:ring-pulse 2.8s ease-out infinite;
  animation-delay:var(--sd,0s)
}
@keyframes ring-pulse{
  0%{transform:scale(1);opacity:.65}
  100%{transform:scale(2.6);opacity:0}
}

/* Central glow core */
.gs-core{
  position:absolute;top:50%;left:50%;
  width:3px;height:3px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,255,255,.96);
  animation:gs-core-glow calc(var(--sf,4s)*.62) ease-in-out infinite;
  animation-delay:var(--sd,0s)
}
@keyframes gs-core-glow{
  0%,100%{box-shadow:0 0 4px var(--sc),0 0 10px var(--sc-mid)}
  50%    {box-shadow:0 0 9px var(--sc),0 0 22px var(--sc-mid),0 0 40px var(--sc-dim)}
}

/* Geometric shards */
.gs-f{
  position:absolute;top:50%;left:50%;
  width:5px;height:5px;
  background:var(--sc);
  clip-path:polygon(50% 0%,100% 100%,0% 100%)
}

/* ─ Variant A: upward fountain burst ─ */
@keyframes ga-f1{
  0%,22%,78%,100%{transform:translate(-50%,-50%) translate(-2px,-3px) rotate(0deg);opacity:.9}
  50%            {transform:translate(-50%,-50%) translate(-12px,-18px) rotate(240deg) scale(.4);opacity:.12}
}
@keyframes ga-f2{
  0%,22%,78%,100%{transform:translate(-50%,-50%) translate(2px,-3px) rotate(60deg);opacity:.9}
  50%            {transform:translate(-50%,-50%) translate(12px,-18px) rotate(300deg) scale(.4);opacity:.12}
}
@keyframes ga-f3{
  0%,22%,78%,100%{transform:translate(-50%,-50%) translate(0,4px) rotate(180deg);opacity:.9}
  50%            {transform:translate(-50%,-50%) translate(0,20px) rotate(0deg) scale(.4);opacity:.12}
}
.geo-a .gs-f1{animation:ga-f1 var(--sf,4.5s) ease-in-out infinite;animation-delay:var(--sd,0s)}
.geo-a .gs-f2{animation:ga-f2 var(--sf,4.5s) ease-in-out infinite;animation-delay:calc(var(--sd,0s) + .14s)}
.geo-a .gs-f3{animation:ga-f3 var(--sf,4.5s) ease-in-out infinite;animation-delay:calc(var(--sd,0s) + .28s)}

/* ─ Variant B: spinning burst ─ */
@keyframes gb-f1{
  0%,20%,80%,100%{transform:translate(-50%,-50%) translate(0,-3px) rotate(0deg);opacity:.9}
  50%            {transform:translate(-50%,-50%) translate(0,-21px) rotate(720deg) scale(.35);opacity:.1}
}
@keyframes gb-f2{
  0%,20%,80%,100%{transform:translate(-50%,-50%) translate(3px,2px) rotate(120deg);opacity:.9}
  50%            {transform:translate(-50%,-50%) translate(19px,11px) rotate(840deg) scale(.35);opacity:.1}
}
@keyframes gb-f3{
  0%,20%,80%,100%{transform:translate(-50%,-50%) translate(-3px,2px) rotate(240deg);opacity:.9}
  50%            {transform:translate(-50%,-50%) translate(-19px,11px) rotate(960deg) scale(.35);opacity:.1}
}
.geo-b .gs-f1{animation:gb-f1 calc(var(--sf,4.5s)*1.2) ease-in-out infinite;animation-delay:var(--sd,0s)}
.geo-b .gs-f2{animation:gb-f2 calc(var(--sf,4.5s)*1.2) ease-in-out infinite;animation-delay:calc(var(--sd,0s) + .18s)}
.geo-b .gs-f3{animation:gb-f3 calc(var(--sf,4.5s)*1.2) ease-in-out infinite;animation-delay:calc(var(--sd,0s) + .36s)}

/* ─ Variant C: side scatter ─ */
@keyframes gc-f1{
  0%,22%,78%,100%{transform:translate(-50%,-50%) translate(-3px,0) rotate(270deg);opacity:.9}
  50%            {transform:translate(-50%,-50%) translate(-21px,-4px) rotate(90deg) scale(.4);opacity:.12}
}
@keyframes gc-f2{
  0%,22%,78%,100%{transform:translate(-50%,-50%) translate(3px,0) rotate(90deg);opacity:.9}
  50%            {transform:translate(-50%,-50%) translate(21px,-4px) rotate(270deg) scale(.4);opacity:.12}
}
@keyframes gc-f3{
  0%,22%,78%,100%{transform:translate(-50%,-50%) translate(0,-3px) rotate(0deg);opacity:.9}
  50%            {transform:translate(-50%,-50%) translate(0,19px) rotate(180deg) scale(.4);opacity:.12}
}
.geo-c .gs-f1{animation:gc-f1 calc(var(--sf,4.5s)*.88) ease-in-out infinite;animation-delay:var(--sd,0s)}
.geo-c .gs-f2{animation:gc-f2 calc(var(--sf,4.5s)*.88) ease-in-out infinite;animation-delay:calc(var(--sd,0s) + .12s)}
.geo-c .gs-f3{animation:gc-f3 calc(var(--sf,4.5s)*.88) ease-in-out infinite;animation-delay:calc(var(--sd,0s) + .24s)}

/* ─ Variant D: diagonal burst ─ */
@keyframes gd-f1{
  0%,20%,80%,100%{transform:translate(-50%,-50%) translate(-2px,-2px) rotate(315deg);opacity:.9}
  50%            {transform:translate(-50%,-50%) translate(-16px,-16px) rotate(675deg) scale(.35);opacity:.1}
}
@keyframes gd-f2{
  0%,20%,80%,100%{transform:translate(-50%,-50%) translate(2px,-2px) rotate(45deg);opacity:.9}
  50%            {transform:translate(-50%,-50%) translate(16px,-16px) rotate(405deg) scale(.35);opacity:.1}
}
@keyframes gd-f3{
  0%,20%,80%,100%{transform:translate(-50%,-50%) translate(0,4px) rotate(180deg);opacity:.9}
  50%            {transform:translate(-50%,-50%) translate(0,21px) rotate(540deg) scale(.35);opacity:.1}
}
.geo-d .gs-f1{animation:gd-f1 calc(var(--sf,4.5s)*1.4) ease-in-out infinite;animation-delay:var(--sd,0s)}
.geo-d .gs-f2{animation:gd-f2 calc(var(--sf,4.5s)*1.4) ease-in-out infinite;animation-delay:calc(var(--sd,0s) + .22s)}
.geo-d .gs-f3{animation:gd-f3 calc(var(--sf,4.5s)*1.4) ease-in-out infinite;animation-delay:calc(var(--sd,0s) + .44s)}

/* Star hover card */
.star-card{
  position:absolute;
  bottom:calc(100% + 16px);left:50%;
  transform:translateX(-50%) translateY(8px);
  opacity:0;pointer-events:none;
  transition:opacity .26s,transform .26s;
  min-width:158px;white-space:nowrap;z-index:20
}
.star-node:hover .star-card{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.star-node.card-below .star-card{bottom:auto;top:calc(100% + 16px);transform:translateX(-50%) translateY(-8px)}
.star-node.card-below:hover .star-card{transform:translateX(-50%) translateY(0)}

.sc-inner{
  position:relative;
  background:rgba(4,2,14,.93);
  background-image:radial-gradient(circle,var(--sc-dim,rgba(200,200,200,.1)) 1px,transparent 1px);
  background-size:7px 7px;
  border:none;
  border-radius:0;
  padding:14px 16px;
  backdrop-filter:blur(22px);
  box-shadow:0 8px 32px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04);
  overflow:visible
}
/* COD-00 SVG border */
.sc-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.sc-rect{fill:none;stroke:var(--sc-mid,rgba(200,200,200,.42));stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .5s cubic-bezier(.22,1,.36,1)}
.star-node:hover .sc-rect{stroke-dashoffset:0}
/* Corner brackets */
.sc-corner{position:absolute;width:7px;height:7px;border-color:var(--sc,rgba(200,200,200,.7));border-style:solid}
.sc-corner.tl{top:0;left:0;border-width:1px 0 0 1px;--cx:12px;--cy:12px}
.sc-corner.tr{top:0;right:0;border-width:1px 1px 0 0;--cx:-12px;--cy:12px}
.sc-corner.bl{bottom:0;left:0;border-width:0 0 1px 1px;--cx:12px;--cy:-12px}
.sc-corner.br{bottom:0;right:0;border-width:0 1px 1px 0;--cx:-12px;--cy:-12px}
/* Corner spring animation (over-shoot easing, cubic-bezier Y>1) */
@keyframes cornerSpring{
  0%{transform:translate(var(--cx),var(--cy));opacity:0}
  100%{transform:translate(0,0);opacity:1}
}
.star-node:hover .sc-corner{animation:cornerSpring .52s cubic-bezier(.34,1.56,.64,1) both}
.star-node:hover .sc-corner.tl{animation-delay:0s}
.star-node:hover .sc-corner.tr{animation-delay:.04s}
.star-node:hover .sc-corner.bl{animation-delay:.06s}
.star-node:hover .sc-corner.br{animation-delay:.08s}
/* Text stagger — appears after corners settle */
@keyframes textIn{
  from{opacity:0;transform:translateY(3px)}
  to{opacity:1;transform:translateY(0)}
}
.sc-platform,.sc-desc,.sc-btn{opacity:0}
.star-node:hover .sc-platform{animation:textIn .26s ease both;animation-delay:.30s}
.star-node:hover .sc-desc{animation:textIn .26s ease both;animation-delay:.38s}
.star-node:hover .sc-btn{animation:textIn .24s ease both;animation-delay:.46s}
.sc-platform{font:600 12px var(--ff-m);letter-spacing:.25em;color:var(--sc);text-transform:uppercase;margin-bottom:5px}
.sc-desc{font:400 12px var(--ff-m);color:rgba(200,188,235,.78);letter-spacing:.06em;line-height:1.6;margin-bottom:12px}
.sc-btn{
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:7px 14px;border-radius:6px;
  background:var(--sc-dim);border:1px solid var(--sc-mid);
  color:var(--sc);font:500 11px var(--ff-m);letter-spacing:.18em;
  text-decoration:none;text-transform:uppercase;transition:all .18s;cursor:pointer;
  width:100%
}
.sc-btn:hover{background:var(--sc-mid);box-shadow:0 0 14px var(--sc-dim)}

/* ── Signal footer ── */
.signal-footer{
  position:absolute;bottom:0;left:0;right:0;
  padding:28px 40px 44px;
  background:linear-gradient(to top,rgba(4,2,14,.97) 0%,rgba(4,2,14,.88) 32%,rgba(4,2,14,.60) 62%,rgba(4,2,14,.22) 82%,transparent 100%);
  z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:18px
}

/* Visitor counter */
.visitor-hud{
  display:flex;align-items:center;gap:10px;
  font:400 11px var(--ff-m);letter-spacing:.28em;color:var(--ink-1);text-transform:uppercase
}
.vc-num{
  font:600 24px var(--ff-m);letter-spacing:.05em;
  background:linear-gradient(135deg,var(--azure),var(--pink));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent
}

/* ── Mark section (留下足跡) ── */
.mark-section{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.mark-header{text-align:center}
.mark-title-row{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:4px}
.mark-title-line{width:44px;height:1px;background:rgba(167,139,250,.42)}
.mark-title-star{color:rgba(196,181,253,.80);font-size:12px}
.mark-title{font:200 26px var(--ff-s);letter-spacing:.14em;color:var(--ink-0)}
.mark-sub{font:400 10px var(--ff-m);letter-spacing:.48em;color:rgba(196,181,253,.78);text-transform:uppercase;text-align:center}
.mark-cards{display:flex;align-items:flex-end;gap:14px;justify-content:center}
.mark-card{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:20px 14px 14px;width:130px;
  background:rgba(6,3,22,.80);
  border:1px solid rgba(167,139,250,.22);
  cursor:pointer;transition:all .22s;user-select:none
}
.mark-card:hover{border-color:rgba(196,181,253,.52);background:rgba(10,5,32,.90);transform:translateY(-6px);box-shadow:0 12px 36px rgba(167,139,250,.22)}
.mark-card.voted{border-color:rgba(196,181,253,.38);box-shadow:0 0 18px rgba(167,139,250,.14)}
.mark-card::before{content:'';position:absolute;inset:5px;border:1px solid rgba(167,139,250,.10);pointer-events:none}
.card-badge{
  position:absolute;top:-12px;right:-12px;
  width:26px;height:26px;border-radius:50%;
  background:rgba(6,3,18,.96);border:1px solid rgba(196,181,253,.55);
  display:flex;align-items:center;justify-content:center;
  font:700 10px var(--ff-m);color:var(--violet-bright);letter-spacing:0
}
.card-img{
  width:68px;height:68px;object-fit:contain;
  filter:drop-shadow(0 0 8px rgba(167,139,250,.34));
  transition:filter .22s,transform .22s
}
.mark-card:hover .card-img{filter:drop-shadow(0 0 18px rgba(196,181,253,.65));transform:scale(1.1)}
.mark-card.voted .card-img{filter:drop-shadow(0 0 12px rgba(196,181,253,.52))}
.card-name-en{font:400 11px var(--ff-m);letter-spacing:.14em;color:rgba(232,224,255,.92);text-transform:uppercase}
.card-name-zh{font:400 11px var(--ff-m);color:rgba(200,185,240,.78);letter-spacing:.05em}
.card-count{font:600 22px var(--ff-m);letter-spacing:.04em;color:rgba(196,181,253,.94);margin-top:2px}
.mark-hint{font:400 10px var(--ff-m);letter-spacing:.20em;color:rgba(180,165,220,.65)}
.plus-one{
  position:absolute;top:-26px;left:50%;
  transform:translateX(-50%);
  font:700 14px var(--ff-m);color:var(--violet-bright);
  pointer-events:none;text-shadow:0 0 12px rgba(196,181,253,.7);
  animation:plus-float 1s ease-out forwards
}
@keyframes plus-float{
  0%{opacity:1;transform:translateX(-50%) translateY(0)}
  100%{opacity:0;transform:translateX(-50%) translateY(-32px)}
}

/* ── Responsive ── */
@media(max-width:768px){
  .topbar{padding:0 16px}
  .topbar-left span:not(:first-child){display:none}
  .signal-footer{padding:14px 16px 24px}
  .mark-cards{gap:8px}
  .mark-card{width:98px;padding:14px 10px 10px;gap:5px}
  .card-img{width:50px;height:50px}
  .card-count{font-size:16px}
  .mark-title{font-size:20px}
}
</style>
</head>
<body>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>
<canvas id="stars"></canvas>

<div class="scene-bg">
  <img class="scene-bg-img" src="assets/signal/darkbg.webp" alt="">
</div>

<div id="sidebar">
  <div class="sb-head">
    <div class="sb-info">
      <div class="sb-title">WUYAN'S ARCHIVE</div>
      <div class="sb-sub">v2.1.0</div>
      <div class="sb-pulse"><div class="sb-dot"></div><span class="sb-online">ONLINE</span></div>
    </div>
  </div>
  <nav id="sb-nav"></nav>
</div>

<div class="app">
  <header class="topbar">
    <div class="tb-brand">✦ WUYAN · ARCHIVE</div>
    <div class="topbar-title">
      <h1>SIGNAL&nbsp;&nbsp;STATION</h1>
      <div class="sub">找到我在宇宙的座標</div>
    </div>
    <div class="topbar-right">
      <span class="status-dot"></span>
      <span class="clock" id="clock">00:00:00</span>
    </div>
  </header>

  <div class="sky-area" id="sky-area">
    <div id="star-links"></div>
    <div class="sky-hint">懸停星點 · 查看連結</div>

    <div class="signal-footer">
      <div class="visitor-hud">
        <span>訊號累積</span>
        <span class="vc-num" id="vc-num">—</span>
        <span>次</span>
      </div>
      <div class="mark-section">
        <div class="mark-header">
          <div class="mark-title-row">
            <span class="mark-title-line"></span>
            <span class="mark-title-star">✦</span>
            <span class="mark-title">留下足跡</span>
            <span class="mark-title-star">✦</span>
            <span class="mark-title-line"></span>
          </div>
          <div class="mark-sub">LEAVE YOUR MARK</div>
        </div>
        <div class="mark-cards" id="mark-cards"></div>
        <div class="mark-hint">點擊圖示，記錄你到此一遊的痕跡 ✦</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ── Cursor ── */
(function(){
  var dot=document.getElementById('cursor-dot'),ring=document.getElementById('cursor-ring');
  var mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  function animRing(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(animRing);}
  animRing();
  function addHov(el){el.addEventListener('mouseenter',function(){document.body.classList.add('hov')});el.addEventListener('mouseleave',function(){document.body.classList.remove('hov')});}
  document.querySelectorAll('a,button').forEach(addHov);
  window._addHov=addHov;
})();

/* ── Stars background ── */
(function(){
  var c=document.getElementById('stars'),ctx=c.getContext('2d');
  var cols=['#ffffff','rgba(255,185,215,1)','rgba(165,215,255,1)','rgba(255,220,140,1)'];
  var stars=[];
  function resize(){
    c.width=innerWidth;c.height=innerHeight;
    stars=Array.from({length:120},function(){
      return{x:Math.random()*c.width,y:Math.random()*c.height*0.65,r:Math.random()*.9+.15,o:Math.random()*.4+.15,t:Math.random()*Math.PI*2,col:cols[Math.floor(Math.random()*cols.length)]};
    });
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(function(s){
      s.t+=.008;s.o=.15+.28*Math.sin(s.t);
      var col=s.col.includes('rgba')?s.col.replace(/[\d.]+\)$/,s.o+')'):('rgba(255,255,255,'+s.o+')');
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize();draw();window.addEventListener('resize',resize);
})();

/* ── Mark cards (留下足跡) ──
   單選互斥：同一時間只能選一張，換選時前一張歸 0。
   Worker API（部署後填入 WORKER_URL）：
     GET  ?marks=1           → { marks:{stargazer:N,...} }
     POST ?mark=ID&prev=PREV → { marks:{...} }
── */
(function(){
  var MARKS=[
    {id:'stargazer', img:'button1.png', en:'Stargazer', zh:'仰望星空'},
    {id:'wanderer',  img:'button2.png', en:'Wanderer',  zh:'漫遊者'  },
    {id:'dreamer',   img:'button3.png', en:'Dreamer',   zh:'夢想家'  },
    {id:'traveler',  img:'button4.png', en:'Traveler',  zh:'旅人'    },
    {id:'resonator', img:'button5.png', en:'Resonator', zh:'共鳴者'  },
  ];
  var WORKER_URL='https://signal-visitor.a0986676271.workers.dev';
  var SEL_KEY='wuyan_signal_selected';   /* 只存一個 id 字串 */
  var storedSel=localStorage.getItem(SEL_KEY)||''; /* 記錄上次選擇，僅用於傳 prev 給後端 */
  var selected='';                        /* 每次進頁面不預選，須主動點選 */
  var baseCounts={};                      /* 後端拿到的基底數字 */
  var cardEls={};
  MARKS.forEach(function(m){baseCounts[m.id]=0;});

  /* 顯示 = 基底 + (已選中 ? 1 : 0) */
  function renderCounts(){
    MARKS.forEach(function(m){
      var el=document.getElementById('mc-'+m.id);
      if(el)el.textContent=String(baseCounts[m.id]+(selected===m.id?1:0)).padStart(4,'0');
    });
  }

  function selectCard(newId){
    var prev=selected||storedSel; /* 本次 session 若無選擇，用上次存的值當 prev */
    selected=newId;
    storedSel=newId;
    localStorage.setItem(SEL_KEY,newId);

    /* 更新所有卡片的 voted 樣式 */
    MARKS.forEach(function(m){
      cardEls[m.id].classList.toggle('voted',m.id===newId);
    });

    /* 更新計數顯示 */
    renderCounts();

    /* +1 浮出動畫 */
    var p=document.createElement('div');
    p.className='plus-one';p.textContent='+1';
    cardEls[newId].appendChild(p);
    p.addEventListener('animationend',function(){p.remove();});

    /* POST 到後端（部署前 catch 靜默忽略） */
    var qs='?mark='+newId+(prev?'&prev='+prev:'');
    fetch(WORKER_URL+qs,{method:'POST'})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.marks){Object.assign(baseCounts,d.marks);renderCounts();}
      })
      .catch(function(){});
  }

  /* 建立卡片 */
  var wrap=document.getElementById('mark-cards');
  MARKS.forEach(function(m){
    var card=document.createElement('div');
    card.className='mark-card';
    card.innerHTML=
      '<div class="card-badge">+1</div>'+
      '<img class="card-img" src="assets/signal/'+m.img+'" alt="'+m.en+'">'+
      '<div class="card-name-en">'+m.en+'</div>'+
      '<div class="card-name-zh">'+m.zh+'</div>'+
      '<div class="card-count" id="mc-'+m.id+'">0000</div>';
    cardEls[m.id]=card;

    card.addEventListener('click',function(){
      if(selected===m.id)return; /* 已選中，不重複觸發 */
      selectCard(m.id);
    });
    if(window._addHov)window._addHov(card);
    wrap.appendChild(card);
  });

  /* 初始顯示（含已選狀態） */
  renderCounts();

  /* GET 後端基底計數（部署後才有資料） */
  fetch(WORKER_URL+'?marks=1',{method:'GET'})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.marks){Object.assign(baseCounts,d.marks);renderCounts();}
    })
    .catch(function(){});
})();

/* ── Visitor counter — Cloudflare Worker + KV ──
   Worker URL: 部署完後把 WORKER_URL 換成你的 workers.dev 網址
   Rate limit: 同一 IP 24h 只計一次（Worker 端用 KV TTL 控制）
   Client: sessionStorage 防同一分頁多次送出
── */
(function(){
  var WORKER_URL='https://signal-visitor.a0986676271.workers.dev';
  var SESSION_KEY='wuyan_signal_visited';
  var el=document.getElementById('vc-num');

  function animCount(target){
    var n=0;
    var step=Math.max(1,Math.floor(target/60));
    var iv=setInterval(function(){
      n=Math.min(n+step,target);
      el.textContent=n.toLocaleString();
      if(n>=target)clearInterval(iv);
    },28);
  }

  /* GET 先拿目前總數顯示 */
  fetch(WORKER_URL,{method:'GET'})
    .then(function(r){return r.json();})
    .then(function(d){animCount(d.count||0);})
    .catch(function(){el.textContent='—';});

  /* POST 送計次（每個 session 只送一次；IP 頻率由 Worker 控制）*/
  if(!sessionStorage.getItem(SESSION_KEY)){
    fetch(WORKER_URL,{method:'POST'})
      .then(function(r){return r.json();})
      .then(function(d){
        sessionStorage.setItem(SESSION_KEY,'1'); /* POST 成功才鎖，失敗可重試 */
        animCount(d.count||0);
      })
      .catch(function(){});
  }
})();
</script>
