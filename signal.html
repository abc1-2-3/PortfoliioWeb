<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGNAL · WUYAN'S ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#04020e;color:#e8e0ff;font-family:'Courier New',monospace}

:root{
  --violet:        rgba(167,139,250,.6);
  --violet-bright: rgba(196,181,253,.9);
  --pink:          rgba(240,165,205,1);
  --azure:         rgba(165,215,255,1);
  --gold:          #d4a84e;
  --ink-0:         rgba(240,235,255,.92);
  --ink-1:         rgba(210,200,245,.75);
  --ink-2:         rgba(180,165,220,.58);
  --ink-3:         rgba(140,125,180,.42);
  --line:          rgba(167,139,250,.18);
  --ff-m:          'Courier New', monospace;
  --ff-s:          'Noto Serif TC', Georgia, serif;
}

/* ── Cursor ── */
#cursor-dot{
  position:fixed;width:6px;height:6px;border-radius:50%;
  background:#fff;box-shadow:0 0 8px rgba(255,180,220,.9);
  pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:opacity .2s
}
#cursor-ring{
  position:fixed;width:24px;height:24px;border-radius:50%;
  border:1px solid rgba(240,160,200,.4);pointer-events:none;z-index:9998;
  transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s
}
body.hov #cursor-ring{border-color:rgba(240,160,205,.75);box-shadow:0 0 12px rgba(220,120,175,.22)}

/* ── Stars canvas ── */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}

/* ── Scene background ── */
.scene-bg{position:fixed;inset:0;z-index:0}
.scene-bg-img{width:100%;height:100%;object-fit:cover;object-position:center top;opacity:.88}
.scene-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,
    rgba(4,2,14,.08) 0%,
    rgba(4,2,14,.12) 45%,
    rgba(4,2,14,.55) 72%,
    rgba(4,2,14,.82) 100%
  )
}

/* ── Sidebar ── */
#sidebar{
  position:fixed;left:0;top:0;bottom:0;width:220px;
  background:rgba(7,5,15,.97);backdrop-filter:blur(20px);
  border-right:1px solid rgba(167,139,250,.22);z-index:50;
  transform:translateX(calc(-100% + 16px));
  transition:transform .38s cubic-bezier(.25,.46,.45,.94),box-shadow .38s
}
#sidebar:hover{transform:translateX(0);box-shadow:4px 0 44px rgba(0,0,0,.75),0 0 0 1px rgba(167,139,250,.1)}
#sidebar::before{
  content:'';position:absolute;right:0;top:22%;bottom:22%;width:2px;
  background:linear-gradient(to bottom,transparent,rgba(167,139,250,.72) 40%,rgba(165,215,255,.58) 60%,transparent);
  transition:opacity .25s
}
#sidebar:hover::before{opacity:0}
#sidebar::after{
  content:'';position:absolute;left:36px;top:80px;bottom:80px;width:1.5px;
  background:linear-gradient(to bottom,transparent,rgba(167,139,250,.5) 20%,rgba(196,181,253,.85) 50%,rgba(167,139,250,.5) 80%,transparent);
  box-shadow:0 0 6px rgba(167,139,250,.28)
}
.sb-head{display:flex;align-items:center;gap:12px;padding:20px 20px 16px;border-bottom:1px solid rgba(167,139,250,.12)}
.sb-cat{width:34px;height:34px;border:1px solid rgba(167,139,250,.42);border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(5,10,30,.6);flex-shrink:0;box-shadow:0 0 12px rgba(167,139,250,.22)}
.sb-cat img{width:22px;height:22px;filter:invert(1) sepia(1) saturate(3) hue-rotate(245deg);opacity:.85}
.sb-title{font:700 12px var(--ff-m);letter-spacing:3px;color:rgba(196,181,253,.88);text-transform:uppercase}
.sb-sub{font:400 10px var(--ff-m);color:var(--ink-3);letter-spacing:2px;margin-top:3px}
.sb-pulse{display:flex;align-items:center;gap:6px;margin-top:5px}
.sb-dot{width:5px;height:5px;border-radius:50%;background:rgba(80,255,120,.7);animation:pulse-dot 2s ease-in-out infinite;box-shadow:0 0 5px rgba(80,255,120,.4)}
.sb-online{font:400 10px var(--ff-m);letter-spacing:2px;color:rgba(80,255,120,.58)}
@keyframes pulse-dot{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.5);opacity:1}}
#sb-nav{padding:14px 0 20px}
.ni{display:flex;align-items:center;gap:12px;padding:9px 20px;cursor:pointer;transition:background .22s,transform .22s;text-decoration:none}
.ni:hover{background:rgba(167,139,250,.08);transform:translateX(4px)}
.ni.act{background:rgba(167,139,250,.13)}
.ni-icon{width:15px;height:15px;object-fit:contain;opacity:.70;filter:brightness(0) invert(1);transition:opacity .22s;flex-shrink:0}
.ni:hover .ni-icon,.ni.act .ni-icon{opacity:.95}
.ni-en{font:400 12px var(--ff-m);letter-spacing:2px;text-transform:uppercase;color:rgba(175,150,220,.78);transition:color .22s}
.ni-zh{font:400 11px var(--ff-m);color:rgba(160,142,205,.65);letter-spacing:1px;margin-top:2px;transition:color .22s}
.ni:hover .ni-en,.ni.act .ni-en{color:rgba(232,224,255,.97)}
.ni:hover .ni-zh,.ni.act .ni-zh{color:rgba(210,200,240,.88)}

/* ── App shell ── */
.app{
  position:relative;z-index:1;height:100vh;width:100%;
  display:grid;grid-template-rows:auto 1fr;overflow:hidden
}

/* ── Topbar ── */
.topbar{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:24px;padding:0 32px;height:52px;
  background:rgba(4,2,14,.62);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(240,165,205,.12);
  box-shadow:0 1px 24px rgba(0,0,0,.5);position:relative;z-index:5
}
.topbar-left{display:flex;align-items:center;gap:12px;font:400 11px var(--ff-m);letter-spacing:.18em;color:var(--ink-2)}
.topbar-title{text-align:center}
.topbar-title h1{font:400 13px var(--ff-m);letter-spacing:.45em;color:var(--ink-0);margin:0}
.topbar-title .sub{margin-top:3px;font-size:10px;letter-spacing:.35em;color:var(--ink-2)}
.topbar-right{display:flex;align-items:center;gap:16px;justify-content:flex-end;font:400 11px var(--ff-m);letter-spacing:.18em;color:var(--ink-2)}
.topbar-right .clock{color:var(--violet-bright);font-size:13px;letter-spacing:.14em}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}

/* ── Sky content area ── */
.sky-area{position:relative;overflow:hidden}

/* ── Star nodes ── */
.star-node{
  position:absolute;
  left:var(--sx);top:var(--sy);
  transform:translate(-50%,-50%);
  z-index:10;
  animation:star-float var(--sf,4s) ease-in-out infinite;
  animation-delay:var(--sd,0s)
}
@keyframes star-float{
  0%,100%{translate:0 0}
  50%{translate:0 -9px}
}

.star-dot{
  width:var(--ss,14px);height:var(--ss,14px);border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff 0%,var(--sc) 55%,transparent 100%);
  box-shadow:0 0 10px var(--sc),0 0 24px var(--sc-mid),0 0 44px var(--sc-dim);
  cursor:pointer;position:relative;z-index:2;
  transition:transform .22s,box-shadow .22s;
}
.star-dot::before{
  content:'';position:absolute;inset:-7px;border-radius:50%;
  border:1px solid var(--sc-mid);
  animation:ring-pulse 2.8s ease-out infinite;
  animation-delay:var(--sd,0s)
}
@keyframes ring-pulse{
  0%{transform:scale(1);opacity:.65}
  100%{transform:scale(2.6);opacity:0}
}
.star-node:hover .star-dot{
  transform:scale(1.35);
  box-shadow:0 0 18px var(--sc),0 0 36px var(--sc-mid),0 0 60px var(--sc-dim)
}

/* Star hover card */
.star-card{
  position:absolute;
  bottom:calc(100% + 16px);left:50%;
  transform:translateX(-50%) translateY(8px);
  opacity:0;pointer-events:none;
  transition:opacity .26s,transform .26s;
  min-width:158px;white-space:nowrap;z-index:20
}
.star-node:hover .star-card{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.star-node.card-below .star-card{bottom:auto;top:calc(100% + 16px);transform:translateX(-50%) translateY(-8px)}
.star-node.card-below:hover .star-card{transform:translateX(-50%) translateY(0)}

.sc-inner{
  background:rgba(4,2,14,.93);
  border:1px solid var(--sc-mid);
  border-radius:12px;padding:14px 16px;
  backdrop-filter:blur(22px);
  box-shadow:0 8px 32px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.04)
}
/* pointer triangle */
.sc-inner::after{
  content:'';position:absolute;bottom:-5px;left:50%;
  transform:translateX(-50%) rotate(45deg);
  width:8px;height:8px;
  background:rgba(4,2,14,.93);
  border-right:1px solid var(--sc-mid);
  border-bottom:1px solid var(--sc-mid)
}
.star-node.card-below .sc-inner::after{
  bottom:auto;top:-5px;
  border-right:none;border-bottom:none;
  border-left:1px solid var(--sc-mid);
  border-top:1px solid var(--sc-mid)
}
.sc-platform{font:600 10px var(--ff-m);letter-spacing:.25em;color:var(--sc);text-transform:uppercase;margin-bottom:4px}
.sc-desc{font:400 11px var(--ff-m);color:var(--ink-2);letter-spacing:.06em;line-height:1.55;margin-bottom:10px}
.sc-btn{
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:6px 12px;border-radius:6px;
  background:var(--sc-dim);border:1px solid var(--sc-mid);
  color:var(--sc);font:500 10px var(--ff-m);letter-spacing:.18em;
  text-decoration:none;text-transform:uppercase;transition:all .18s;cursor:pointer;
  width:100%
}
.sc-btn:hover{background:var(--sc-mid);box-shadow:0 0 14px var(--sc-dim)}

/* ── Signal footer ── */
.signal-footer{
  position:absolute;bottom:0;left:0;right:0;
  padding:16px 40px 30px;
  background:linear-gradient(to top,rgba(4,2,14,.88) 0%,rgba(4,2,14,.52) 55%,transparent 100%);
  z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:14px
}

/* Visitor counter */
.visitor-hud{
  display:flex;align-items:center;gap:10px;
  font:400 10px var(--ff-m);letter-spacing:.28em;color:var(--ink-3);text-transform:uppercase
}
.vc-num{
  font:600 20px var(--ff-m);letter-spacing:.05em;
  background:linear-gradient(135deg,var(--azure),var(--pink));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent
}

/* Emoji reactions */
.reactions-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.reactions-label{font:400 10px var(--ff-m);letter-spacing:.3em;color:var(--ink-3);text-transform:uppercase;margin-right:4px}
.emoji-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 15px;border-radius:999px;
  background:rgba(8,4,22,.68);border:1px solid rgba(167,139,250,.2);
  backdrop-filter:blur(12px);cursor:pointer;
  font:400 11px var(--ff-m);letter-spacing:.1em;color:var(--ink-2);
  transition:all .22s;user-select:none
}
.emoji-btn .ej{font-size:15px;line-height:1;transition:transform .22s}
.emoji-btn:hover{
  background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.42);
  color:var(--ink-0);transform:translateY(-2px);
  box-shadow:0 4px 18px rgba(167,139,250,.16)
}
.emoji-btn:hover .ej{transform:scale(1.25)}
.emoji-btn.clicked{
  background:rgba(167,139,250,.16);border-color:rgba(196,181,253,.5);
  color:var(--violet-bright);
  box-shadow:0 0 12px rgba(167,139,250,.22),inset 0 0 10px rgba(167,139,250,.06)
}
.emoji-btn.clicked .ej{animation:emoji-pop .32s cubic-bezier(.34,1.56,.64,1)}
@keyframes emoji-pop{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}

/* ── Responsive ── */
@media(max-width:768px){
  .topbar{padding:0 16px}
  .topbar-left span:not(:first-child){display:none}
  .signal-footer{padding:12px 16px 24px}
  .reactions-label{display:none}
}
</style>
</head>
<body>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>
<canvas id="stars"></canvas>

<div class="scene-bg">
  <img class="scene-bg-img" src="assets/signal/darkbg.webp" alt="">
</div>

<div id="sidebar">
  <div class="sb-head">
    <div class="sb-cat"><img src="assets/icon/Cat.png" alt=""></div>
    <div class="sb-info">
      <div class="sb-title">WUYAN'S ARCHIVE</div>
      <div class="sb-sub">v2.1.0</div>
      <div class="sb-pulse"><div class="sb-dot"></div><span class="sb-online">ONLINE</span></div>
    </div>
  </div>
  <nav id="sb-nav"></nav>
</div>

<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <span>WUYAN'S ARCHIVE</span>
      <span style="color:var(--ink-3)">v2.1</span>
      <span style="color:#4ade80">● ONLINE</span>
    </div>
    <div class="topbar-title">
      <h1>SIGNAL&nbsp;&nbsp;STATION</h1>
      <div class="sub">找到我在宇宙的座標</div>
    </div>
    <div class="topbar-right">
      <span>CHANNEL OPEN</span>
      <span class="status-dot"></span>
      <span class="clock" id="clock">00:00:00</span>
    </div>
  </header>

  <div class="sky-area" id="sky-area">
    <div id="star-links"></div>

    <div class="signal-footer">
      <div class="visitor-hud">
        <span>訊號累積</span>
        <span class="vc-num" id="vc-num">—</span>
        <span>次</span>
      </div>
      <div class="reactions-wrap" id="reactions-wrap">
        <span class="reactions-label">路過留個印記</span>
      </div>
    </div>
  </div>
</div>

<script>
/* ── Cursor ── */
(function(){
  var dot=document.getElementById('cursor-dot'),ring=document.getElementById('cursor-ring');
  var mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  function animRing(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(animRing);}
  animRing();
  function addHov(el){el.addEventListener('mouseenter',function(){document.body.classList.add('hov')});el.addEventListener('mouseleave',function(){document.body.classList.remove('hov')});}
  document.querySelectorAll('a,button').forEach(addHov);
  window._addHov=addHov;
})();

/* ── Stars background ── */
(function(){
  var c=document.getElementById('stars'),ctx=c.getContext('2d');
  var cols=['#ffffff','rgba(255,185,215,1)','rgba(165,215,255,1)','rgba(255,220,140,1)'];
  var stars=[];
  function resize(){
    c.width=innerWidth;c.height=innerHeight;
    stars=Array.from({length:120},function(){
      return{x:Math.random()*c.width,y:Math.random()*c.height*0.65,r:Math.random()*.9+.15,o:Math.random()*.4+.15,t:Math.random()*Math.PI*2,col:cols[Math.floor(Math.random()*cols.length)]};
    });
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(function(s){
      s.t+=.008;s.o=.15+.28*Math.sin(s.t);
      var col=s.col.includes('rgba')?s.col.replace(/[\d.]+\)$/,s.o+')'):('rgba(255,255,255,'+s.o+')');
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize();draw();window.addEventListener('resize',resize);
})();

/* ── Clock ── */
(function(){
  var el=document.getElementById('clock');
  function tick(){var n=new Date();el.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(function(v){return String(v).padStart(2,'0')}).join(':');}
  tick();setInterval(tick,1000);
})();

/* ── Sidebar ── */
(function(){
  var NAVS=[
    {href:'homepage_final.html',icon:'Home.png',    en:'HOME',       zh:'回到起點'},
    {href:'works_v3.html',      icon:'File.png',    en:'ARCHIVE',    zh:'作品庫'},
    {href:'commission.html',    icon:'Pay.png',     en:'COMMISSION', zh:'委託資訊'},
    {href:'signal.html',        icon:'Comment.png', en:'SIGNAL',     zh:'訊號站'},
  ];
  var nav=document.getElementById('sb-nav');
  NAVS.forEach(function(n){
    var a=document.createElement('a');
    a.className='ni'+(location.pathname.includes(n.href)||location.href.includes(n.href)?' act':'');
    a.href=n.href;
    a.innerHTML='<img class="ni-icon" src="assets/icon/'+n.icon+'" alt=""><div><div class="ni-en">'+n.en+'</div><div class="ni-zh">'+n.zh+'</div></div>';
    nav.appendChild(a);
    if(window._addHov)window._addHov(a);
  });
})();

/* ── Star link nodes ── */
(function(){
  /* sx/sy = position within sky-area (% left / % top)
     ss = dot size   sf = float duration   sd = animation delay
     sc = solid color   sc-mid = 45% alpha   sc-dim = 18% alpha */
  var LINKS=[
    {
      platform:'X · Twitter', desc:'日常碎片・作品更新・隨機碎念',
      href:'#', btnLabel:'前往 →',
      sc:'165,215,255',   /* azure  */
      sx:'17%', sy:'20%', ss:'15px', sf:'4.2s', sd:'0s',
    },
    {
      platform:'GitHub', desc:'技術合作・開放程式碼',
      href:'#', btnLabel:'前往 →',
      sc:'196,181,253',   /* violet */
      sx:'44%', sy:'11%', ss:'12px', sf:'3.7s', sd:'.6s',
    },
    {
      platform:'Discord', desc:'即時聊天・交流想法與靈感',
      href:'#', btnLabel:'複製帳號',
      sc:'129,140,248',   /* indigo */
      sx:'71%', sy:'22%', ss:'14px', sf:'5.1s', sd:'1.1s',
    },
    {
      platform:'Email', desc:'網站建議・正式委託・回饋',
      href:'mailto:#', btnLabel:'寄信 →',
      sc:'240,165,205',   /* pink   */
      sx:'29%', sy:'43%', ss:'11px', sf:'4.6s', sd:'.4s',
    },
    {
      platform:'作品集', desc:'瀏覽所有作品',
      href:'works_v3.html', btnLabel:'前往 →',
      sc:'212,168,78',    /* gold   */
      sx:'63%', sy:'40%', ss:'10px', sf:'3.4s', sd:'1.5s',
    },
  ];

  var container=document.getElementById('star-links');

  LINKS.forEach(function(lk){
    var isBelow=parseFloat(lk.sy)>34;
    var div=document.createElement('div');
    div.className='star-node'+(isBelow?' card-below':'');
    div.style.cssText=[
      '--sx:'+lk.sx,'--sy:'+lk.sy,'--ss:'+lk.ss,
      '--sf:'+lk.sf,'--sd:'+lk.sd,
      '--sc:rgba('+lk.sc+',1)',
      '--sc-mid:rgba('+lk.sc+',.42)',
      '--sc-dim:rgba('+lk.sc+',.16)',
    ].join(';');

    var isDiscord=lk.platform==='Discord';
    div.innerHTML=
      '<div class="star-dot"></div>'+
      '<div class="star-card">'+
        '<div class="sc-inner">'+
          '<div class="sc-platform">'+lk.platform+'</div>'+
          '<div class="sc-desc">'+lk.desc+'</div>'+
          (isDiscord
            ? '<button class="sc-btn" data-copy="wuyan_archive">'+lk.btnLabel+'</button>'
            : '<a class="sc-btn" href="'+lk.href+'" target="_blank" rel="noopener">'+lk.btnLabel+'</a>'
          )+
        '</div>'+
      '</div>';

    /* Discord copy button */
    if(isDiscord){
      div.querySelector('.sc-btn').addEventListener('click',function(){
        navigator.clipboard.writeText('wuyan_archive').then(function(){
          var btn=div.querySelector('.sc-btn');
          btn.textContent='已複製 ✓';
          setTimeout(function(){btn.textContent='複製帳號';},1800);
        });
      });
    }

    if(window._addHov)window._addHov(div.querySelector('.star-dot'));
    container.appendChild(div);
  });
})();

/* ── Emoji reactions (localStorage) ── */
(function(){
  var EMOJIS=[
    {id:'passing', emoji:'👾', label:'路過了'},
    {id:'nice',    emoji:'✨', label:'很棒'},
    {id:'night',   emoji:'🌙', label:'深夜在刷'},
    {id:'love',    emoji:'💜', label:'喜歡'},
    {id:'lost',    emoji:'🌀', label:'迷路了'},
  ];
  var KEY='wuyan_signal_reactions';
  var clicked=JSON.parse(localStorage.getItem(KEY)||'{}');
  var wrap=document.getElementById('reactions-wrap');

  EMOJIS.forEach(function(e){
    var btn=document.createElement('button');
    btn.className='emoji-btn'+(clicked[e.id]?' clicked':'');
    btn.innerHTML='<span class="ej">'+e.emoji+'</span><span>'+e.label+'</span>';
    btn.addEventListener('click',function(){
      if(clicked[e.id])return;
      clicked[e.id]=true;
      localStorage.setItem(KEY,JSON.stringify(clicked));
      btn.classList.add('clicked');
    });
    if(window._addHov)window._addHov(btn);
    wrap.appendChild(btn);
  });
})();

/* ── Visitor counter (localStorage — per device)
   To share counts across all visitors, replace the body of this function
   with a fetch() to a Cloudflare Worker endpoint that increments a KV value.
   Example endpoint: POST /api/signal-visit → { count: 1247 }
── */
(function(){
  var KEY='wuyan_signal_visits_v1';
  var seen=localStorage.getItem(KEY);
  /* Only count first visit per browser */
  if(!seen){localStorage.setItem(KEY,'1');}
  var el=document.getElementById('vc-num');
  /* Placeholder: show device visit flag. Swap with real API count. */
  var stored=parseInt(localStorage.getItem('wuyan_vc_local')||'0')+1;
  localStorage.setItem('wuyan_vc_local',stored);
  var target=stored;
  var n=0;
  var iv=setInterval(function(){
    n=Math.min(n+1,target);
    el.textContent=n.toLocaleString();
    if(n>=target)clearInterval(iv);
  },60);
})();
</script>
